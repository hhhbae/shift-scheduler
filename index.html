          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-6">
            <section className="lg:col-span-6 p-5 rounded-2xl bg-white border border-slate-300 shadow-sm flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between mb-3 pb-2 border-b border-slate-200">
                  <h2 className="text-sm font-extrabold text-slate-800 flex items-center gap-2">
                    <span className="text-blue-600">⚡</span> 매일 업데이트 인프라 1줄 핵심 브리핑
                  </h2>
                  <span className="text-[11px] text-blue-600 font-bold font-mono">오늘 {today.getMonth()+1}월 {today.getDate()}일자 최신</span>
                </div>
                <div className="space-y-2.5">
                  {dailyNewsItems.map((item, nIdx) => (
                    <a
                      key={nIdx}
                      href={`https://search.naver.com/search.naver?where=news&query=${encodeURIComponent(item.query)}`}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="block p-3 rounded-xl bg-slate-50 border border-slate-200 hover:border-blue-400 hover:bg-blue-50/40 transition group"
                    >
                      <div className="flex items-center justify-between">
                        <span className="text-[11px] font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded border border-blue-200">
                          [{item.category}]
                        </span>
                        <span className="text-[11px] text-slate-400 group-hover:text-blue-600 font-medium">실시간 기사 검색 ➔</span>
                      </div>
                      <p className="font-extrabold text-slate-900 text-xs mt-1.5 leading-snug">
                        {item.title}
                      </p>
                    </a>
                  ))}
                </div>
              </div>
            </section>

            <section className="lg:col-span-6 p-5 rounded-2xl bg-white border border-slate-300 shadow-sm flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between mb-3 pb-2 border-b border-slate-200">
                  <h2 className="text-sm font-extrabold text-slate-800 flex items-center gap-2">
                    <span className="text-amber-500">🛡️</span> 오늘 작전 투입 대원 현황 (오늘 {todayStatus.todayDate}일 기준)
                  </h2>
                  <span className="text-xs font-bold text-blue-600">총원 {members.length}명</span>
                </div>

                <div className="grid grid-cols-2 gap-3 mb-3">
                  <div className="p-4 rounded-xl bg-amber-50 border border-amber-300">
                    <span className="text-xs font-black text-amber-900 flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full bg-amber-500"></span>
                      주간 당직 (08:00 ~ 19:00)
                    </span>
                    <p className="text-2xl font-black text-slate-900 mt-1.5">{todayStatus.dayWorker}</p>
                    <p className="text-[11px] text-slate-600 mt-1">3대 센터 현장 점검 및 주간 관제</p>
                  </div>

                  <div className="p-4 rounded-xl bg-blue-50 border border-blue-300">
                    <span className="text-xs font-black text-blue-900 flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full bg-blue-600"></span>
                      야간 당직 (19:00 ~ 익일 08:00)
                    </span>
                    <p className="text-2xl font-black text-slate-900 mt-1.5">{todayStatus.nightWorker}</p>
                    <p className="text-[11px] text-slate-600 mt-1">심야 무중단 모니터링 및 비상 대기</p>
                  </div>
                </div>

                <div className="space-y-2 text-xs">
                  <div className="p-2.5 rounded-lg bg-slate-50 border border-slate-200 flex items-center justify-between">
                    <span className="text-slate-600 font-medium">야간 비번 대원 (퇴근 회복):</span>
                    <span className="text-emerald-700 font-bold">{todayStatus.restWorkers.join(", ") || "해당 없음"}</span>
                  </div>
                  <div className="p-2.5 rounded-lg bg-slate-50 border border-slate-200 flex items-center justify-between">
                    <span className="text-slate-600 font-medium">평일 상근 대원 (09:00 ~ 18:00):</span>
                    <span className="text-slate-800 font-bold">{todayStatus.workWorkers.length}명 가용 근무 중</span>
                  </div>
                </div>
              </div>
            </section>
          </div>

          {/* 3. 전체 DC운용3팀 월간 근무표 */}
          <section className="p-6 rounded-3xl bg-white border border-slate-300 shadow-sm">
            <div className="flex flex-wrap items-center justify-between gap-4 mb-4 pb-4 border-b border-slate-200">
              <div>
                <h2 className="text-xl font-black text-slate-900 tracking-tight flex items-center gap-2">
                  <span>📅 DC운용3팀 월간 전체 종합 근무표</span>
                  <span className="text-xs px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700 font-bold border border-indigo-200">
                    가변 {members.length}인 순환 체계
                  </span>
                </h2>
                <p className="text-xs text-slate-500 mt-0.5">
                  인원 변동 시 실시간 자동 분배 · 연간 누적 오차 1회 이내 완전 균등 보장
                </p>
              </div>

              <div className="flex items-center flex-wrap gap-2.5">
                <div className="flex items-center bg-slate-100 border border-slate-300 rounded-xl px-2 py-1">
                  <select 
                    value={year} 
                    onChange={(e) => setYear(Number(e.target.value))}
                    className="bg-transparent text-slate-700 font-bold text-xs px-2 py-1.5 focus:outline-none cursor-pointer"
                  >
                    <option value={2026}>2026년</option>
                    <option value={2027}>2027년</option>
                  </select>
                  <div className="w-[1px] h-3.5 bg-slate-300 mx-1"></div>
                  <select 
                    value={month} 
                    onChange={(e) => setMonth(Number(e.target.value))}
                    className="bg-transparent text-blue-600 font-black text-xs px-2 py-1.5 focus:outline-none cursor-pointer"
                  >
                    {[...Array(12)].map((_, i) => (
                      <option key={i+1} value={i+1}>{i+1}월</option>
                    ))}
                  </select>
                </div>

                <button 
                  onClick={downloadCSV}
                  className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-black shadow-md shadow-blue-500/20 transition flex items-center gap-1.5"
                >
                  엑셀(CSV) 다운로드
                </button>
              </div>
            </div>

            <div className="mb-4 flex flex-wrap items-center gap-3 text-xs">
              <span className="text-slate-500 font-bold">근무 구분:</span>
              <span className="px-2 py-0.5 rounded bg-amber-400 text-slate-950 font-black">D : 주간 당직 (08~19) 1명</span>
              <span className="px-2 py-0.5 rounded bg-blue-600 text-white font-black">N : 야간 당직 (19~08) 1명</span>
              <span className="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-bold border border-emerald-300">B : 야간 비번</span>
              <span className="px-2 py-0.5 rounded bg-slate-200 text-slate-700 font-medium">W : 평일 상근 (09~18)</span>
              <span className="px-2 py-0.5 rounded bg-slate-50 text-slate-400 border border-slate-200">O : 주말 휴무</span>
            </div>

            <div className="overflow-x-auto border border-slate-200 rounded-2xl">
              <table className="w-full text-center border-collapse">
                <thead>
                  <tr className="border-b border-slate-200 bg-slate-50 text-slate-600 text-xs">
                    <th className="py-3 px-3 sticky left-0 bg-slate-50 z-30 font-black text-slate-800 min-w-[90px] border-r border-slate-200">
                      대원명 (ID)
                    </th>
                    {daysInMonth.map((d, i) => {
                      const isSun = d.getDay() === 0;
                      const isSat = d.getDay() === 6;
                      const isToday = d.getDate() === todayStatus.todayDate && (month === today.getMonth() + 1);
                      return (
                        <th 
                          key={i} 
                          className={`py-2 px-1 min-w-[32px] border-r border-slate-200/80 ${
                            isToday ? 'bg-blue-100 text-blue-900 font-extrabold ring-1 ring-blue-500' :
                            isSun ? 'bg-rose-50 text-rose-600 font-bold' :
                            isSat ? 'bg-blue-50 text-blue-600 font-bold' : 'text-slate-600'
                          }`}
                        >
                          <div className="text-xs font-bold">{d.getDate()}</div>
                          <div className="text-[9px] mt-0.5 opacity-80">{['일','월','화','수','목','금','토'][d.getDay()]}</div>
                        </th>
                      );
                    })}
                    <th className="py-2.5 px-2 text-amber-700 bg-amber-50 font-black min-w-[50px]">주간(D)</th>
                    <th className="py-2.5 px-2 text-blue-700 bg-blue-50 font-black min-w-[50px]">야간(N)</th>
                    <th className="py-2.5 px-2 text-rose-700 bg-rose-50 font-black min-w-[55px]">주말당직</th>
                    <th className="py-2.5 px-2 text-slate-700 bg-slate-100 font-bold min-w-[50px]">상근(W)</th>
                    <th className="py-2.5 px-2 text-emerald-700 bg-emerald-50 font-bold min-w-[55px]">휴무/비번</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-200 text-xs font-mono">
                  {members.map((m, mIdx) => {
                    const s = summary[mIdx] || {};
                    const isMe = m.id === currentUser.id;
                    return (
                      <tr key={mIdx} className={`${isMe ? 'bg-blue-50/60 font-black' : 'hover:bg-slate-50'} transition`}>
                        <td className={`py-2.5 px-3 sticky left-0 z-20 whitespace-nowrap border-r border-slate-200 text-left pl-3 shadow-sm ${isMe ? 'bg-blue-100 text-blue-900' : 'bg-white text-slate-900'}`}>
                          {m.name} <span className="text-[10px] text-slate-400 font-normal">({m.id})</span>
                        </td>
                        {schedule[mIdx] && schedule[mIdx].map((duty, dIdx) => (
                          <td key={dIdx} className="p-0.5 border-r border-slate-200/60">
                            <div className={`h-7 w-7 mx-auto flex items-center justify-center rounded-lg transition-transform hover:scale-110 ${getDutyBadge(duty)}`}>
                              {duty}
                            </div>
                          </td>
                        ))}
                        <td className="py-2 px-1 font-black text-amber-800 bg-amber-50/50">{s.dayCount}회</td>
                        <td className="py-2 px-1 font-black text-blue-800 bg-blue-50/50">{s.nightCount}회</td>
                        <td className="py-2 px-1 font-black text-rose-800 bg-rose-50/50">{s.weekendDuty}회</td>
                        <td className="py-2 px-1 font-medium text-slate-700 bg-slate-50">{s.regularWork}일</td>
                        <td className="py-2 px-1 font-semibold text-emerald-800 bg-emerald-50/50">{s.offCount}일</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </section>

          {/* ★★★ [우측 하단 상시 고정 플로팅 버튼] ★★★ */}
          <div className="fixed bottom-6 right-6 z-[9999] flex flex-col items-end">
            <button
              onClick={() => setIsAiChatOpen(!isAiChatOpen)}
              className="flex items-center gap-2.5 px-5 py-3.5 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-black text-sm rounded-full shadow-2xl shadow-indigo-500/50 hover:scale-105 active:scale-95 transition duration-200 border-2 border-white/30"
            >
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
              <span>🤖 Gemini AI 참모</span>
              <span className="text-[11px] bg-white/20 px-2 py-0.5 rounded-full font-mono">
                {geminiApiKey ? "ONLINE" : "READY"}
              </span>
            </button>
          </div>

          {/* ★★★ [Gemini AI 관제 대화창: 자유 질의응답 완벽 지원] ★★★ */}
          {isAiChatOpen && (
            <div className="fixed bottom-24 right-6 w-[420px] max-w-[calc(100vw-2rem)] h-[580px] bg-slate-900 border-2 border-blue-500/60 rounded-3xl shadow-2xl flex flex-col z-[9999] overflow-hidden animate-fade-in backdrop-blur-xl">
              <div className="p-4 bg-slate-800/95 border-b border-slate-700 flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  <h3 className="text-sm font-black text-white flex items-center gap-1.5">
                    <span>🤖 Gemini AI 수석 참모</span>
                    {geminiApiKey ? (
                      <span className="text-[10px] px-1.5 py-0.2 bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 rounded font-mono">클라우드직결</span>
                    ) : (
                      <span className="text-[10px] px-1.5 py-0.2 bg-blue-500/20 text-blue-300 border border-blue-500/30 rounded font-mono">자체지능가동</span>
                    )}
                  </h3>
                </div>
                <div className="flex items-center gap-1.5">
                  {currentUser.role === 'admin' && (
                    <button
                      onClick={() => {
                        setTempApiKey(geminiApiKey);
                        setIsApiKeyModalOpen(true);
                      }}
                      className="p-1.5 text-slate-400 hover:text-white text-xs hover:bg-slate-700 rounded-lg transition"
                      title="관리자 전용: DB에 Gemini API Key 영구 등록"
                    >
                      ⚙️
                    </button>
                  )}
                  <button
                    onClick={() => setIsAiChatOpen(false)}
                    className="p-1.5 text-slate-400 hover:text-white text-xs font-bold hover:bg-slate-700 rounded-lg transition"
                  >
                    ✕
                  </button>
                </div>
              </div>

              <div className="flex-1 p-4 overflow-y-auto space-y-3 text-xs bg-slate-950/60">
                {aiMessages.map((msg, idx) => (
                  <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`p-3.5 rounded-2xl max-w-[85%] whitespace-pre-wrap leading-relaxed shadow-md ${
                      msg.role === 'user' 
                        ? 'bg-blue-600 text-white rounded-br-none font-medium' 
                        : 'bg-slate-800/95 text-slate-200 border border-slate-700 rounded-bl-none font-sans'
                    }`}>
                      {msg.text}
                    </div>
                  </div>
                ))}
                {aiLoading && (
                  <div className="flex justify-start">
                    <div className="p-3 bg-slate-800 border border-slate-700 rounded-2xl text-slate-300 text-xs flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-blue-500 animate-ping"></span>
                      Gemini 모델이 답변을 분석 중입니다...
                    </div>
                  </div>
                )}
                <div ref={chatEndRef} />
              </div>

              <form onSubmit={handleSendAiMessage} className="p-3 bg-slate-800/95 border-t border-slate-700 flex gap-2">
                <input
                  type="text"
                  value={aiInput}
                  onChange={(e) => setAiInput(e.target.value)}
                  placeholder="예: 삼성전자 주식 시세 어때? 또는 오늘 뉴스 알려줘"
                  className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                />
                <button
                  type="submit"
                  disabled={aiLoading || !aiInput.trim()}
                  className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-black rounded-xl disabled:opacity-50 transition shadow"
                >
                  질의
                </button>
              </form>
            </div>
          )}

          {/* 관리자 전용: Firebase DB에 Gemini API Key 중앙 등록 모달 */}
          {isApiKeyModalOpen && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-[10000]">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl p-6 w-full max-w-md text-white shadow-2xl">
                <h4 className="text-sm font-black mb-1 flex items-center gap-2">
                  ⚙️ Gemini API Key 중앙 DB 영구 등록
                </h4>
                <p className="text-xs text-slate-400 mb-4 leading-relaxed">
                  사령관님께서 발급받으신 Gemini API Key를 여기에 저장하시면, <strong>모든 대원이 브라우저에 따로 입력할 필요 없이 전 기기에서 실시간 자동 연동</strong>됩니다.
                </p>
                <input
                  type="password"
                  value={tempApiKey}
                  onChange={(e) => setTempApiKey(e.target.value)}
                  placeholder="AIzaSy..."
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4 font-mono"
                />
                <div className="flex justify-end gap-2 text-xs">
                  <button
                    type="button"
                    onClick={() => setIsApiKeyModalOpen(false)}
                    className="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-bold"
                  >
                    취소
                  </button>
                  <button
                    type="button"
                    onClick={handleSaveCloudApiKey}
                    className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-black shadow"
                  >
                    Firebase DB에 영구 저장
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ★★★ [100% 재생 보장: 여성 아나운서 응원 비디오 팝업] ★★★ */}
          {showAnchorGreeting && (
            <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 z-50 animate-fade-in">
              <div className="bg-slate-900 rounded-3xl overflow-hidden w-full max-w-md border border-slate-700 shadow-2xl relative">
                <div className="relative aspect-video w-full bg-slate-950 overflow-hidden flex items-center justify-center">
                  <video
                    ref={videoRef}
                    autoPlay
                    loop
                    muted={isVideoMuted}
                    playsInline
                    preload="auto"
                    className="w-full h-full object-cover"
                    src={ANCHOR_VIDEO_URL}
                  />

                  {/* 음소거 해제 토글 버튼 (브라우저 자동재생 차단 돌파) */}
                  {isVideoMuted && (
                    <button
                      onClick={() => {
                        setIsVideoMuted(false);
                        if (videoRef.current) {
                          videoRef.current.muted = false;
                          videoRef.current.play();
                        }
                      }}
                      className="absolute inset-0 m-auto w-36 h-10 bg-rose-600/90 hover:bg-rose-500 text-white rounded-full text-xs font-black shadow-2xl flex items-center justify-center gap-1.5 backdrop-blur-sm transition"
                    >
                      🔊 소리 켜고 재생
                    </button>
                  )}

                  <div className="absolute top-3 left-3 flex items-center gap-1.5 px-2.5 py-0.5 bg-red-600 text-white rounded-full text-[10px] font-black tracking-widest uppercase shadow pointer-events-none">
                    <span className="w-1.5 h-1.5 rounded-full bg-white animate-ping"></span>
                    HQ LIVE
                  </div>
                </div>

                <div className="p-6 text-center">
                  <span className="text-xs font-bold text-blue-400 font-mono tracking-wider">DC OPS 3 COMMAND GREETING</span>
                  <h3 className="text-lg font-black text-white mt-1.5 leading-snug">
                    "DC운용3팀 여러분!<br />오늘도 안전하고 힘찬 하루 보내세요!"
                  </h3>
                  <p className="text-xs text-slate-400 mt-2 leading-relaxed">
                    일산 · 식사 · 양주 3대 센터 무중단 방어를 위해 헌신하시는 대원 여러분을 응원합니다!
                  </p>

                  <div className="mt-6 flex flex-col gap-2">
                    <button
                      onClick={() => {
                        window.speechSynthesis?.cancel();
                        setShowAnchorGreeting(false);
                      }}
                      className="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black text-xs rounded-xl shadow-lg transition"
                    >
                      응원 접수 완료! 활기차게 임무 시작
                    </button>
                    <button
                      onClick={() => {
                        window.speechSynthesis?.cancel();
                        setShowAnchorGreeting(false);
                      }}
                      className="text-[11px] text-slate-500 hover:text-slate-300 transition py-1"
                    >
                      닫기
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 영구 차단 기능 탑재된 공지사항 팝업 모달 */}
          {activeNoticePopup && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in">
              <div className="bg-white rounded-3xl p-6 w-full max-w-lg border-2 border-rose-500 shadow-2xl relative">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200 mb-4">
                  <div className="flex items-center gap-2">
                    <span className="px-2 py-0.5 bg-rose-600 text-white rounded font-black text-[11px]">
                      {activeNoticePopup.priority || "공지"}
                    </span>
                    <h3 className="text-base font-black text-slate-900">
                      🚨 팀 중요 공지사항 알림
                    </h3>
                  </div>
                  <span className="text-[11px] text-slate-400 font-mono">{activeNoticePopup.dateStr}</span>
                </div>

                <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 mb-4">
                  <h4 className="text-sm font-extrabold text-slate-900 mb-2">{activeNoticePopup.title}</h4>
                  <p className="text-xs text-slate-700 whitespace-pre-wrap leading-relaxed">
                    {activeNoticePopup.content}
                  </p>
                </div>

                <div className="flex items-center justify-between text-xs text-slate-500 mb-4">
                  <span>작성자: <strong>{activeNoticePopup.authorName}</strong></span>
                  <label className="flex items-center gap-1.5 cursor-pointer text-slate-600">
                    <input
                      type="checkbox"
                      id="permanentDismissCheckbox"
                      className="rounded text-rose-600 focus:ring-0"
                    />
                    <strong className="text-rose-600">더 이상 이 팝업 안 보기 (영구 차단)</strong>
                  </label>
                </div>

                <div className="flex justify-end gap-2">
                  <button
                    onClick={() => {
                      const chk = document.getElementById("permanentDismissCheckbox");
                      if (chk && chk.checked) {
                        let currentList = [];
                        try {
                          currentList = JSON.parse(localStorage.getItem(PERMANENT_DISMISSED_NOTICES_KEY) || "[]");
                        } catch(e) {}
                        if (!currentList.includes(activeNoticePopup.key)) {
                          currentList.push(activeNoticePopup.key);
                          localStorage.setItem(PERMANENT_DISMISSED_NOTICES_KEY, JSON.stringify(currentList));
                        }
                      }
                      setActiveNoticePopup(null);
                    }}
                    className="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-black text-xs rounded-xl shadow transition"
                  >
                    공지 확인 완료 및 닫기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 팀 공지 작성 모달 */}
          {isNoticeWriteModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 w-full max-w-lg border border-slate-300 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200 mb-4">
                  <h3 className="text-lg font-black text-slate-900 flex items-center gap-2">
                    📢 팀 전체 공유 공지 등록
                  </h3>
                  <span className="text-xs text-blue-600 font-bold bg-blue-50 px-2.5 py-1 rounded-full">
                    작성자: {currentUser.name}
                  </span>
                </div>

                <form onSubmit={handleCreateNotice} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">공지 구분 / 중요도</label>
                    <select
                      value={noticePriority}
                      onChange={(e) => setNoticePriority(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    >
                      <option value="긴급">🚨 긴급 (인프라 장애 / 긴급 점검)</option>
                      <option value="필독">📌 필독 (주요 전달사항 및 근무 지침)</option>
                      <option value="일반">💬 일반 (업무 인수인계 및 팀 공유)</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">공지 제목</label>
                    <input
                      type="text"
                      value={noticeTitle}
                      onChange={(e) => setNoticeTitle(e.target.value)}
                      placeholder="예: 3개 센터 BMS 전압 변동 알람 조치 요령 전달"
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2 text-xs font-bold text-slate-900 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">상세 내용 및 인수인계 사항</label>
                    <textarea
                      rows="6"
                      value={noticeContent}
                      onChange={(e) => setNoticeContent(e.target.value)}
                      placeholder="팀원들이 로그인 시 숙지해야 할 내용을 상세히 입력하십시오."
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-xs text-slate-900 focus:ring-2 focus:ring-blue-500 focus:outline-none leading-relaxed"
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-2 border-t border-slate-200">
                    <button
                      type="button"
                      onClick={() => setIsNoticeWriteModalOpen(false)}
                      className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-black rounded-xl shadow-md transition"
                    >
                      Firebase DB에 즉시 등록 및 전파
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 팀내 주요 공지 확인 모달 */}
          {isNoticeListModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 w-full max-w-3xl border border-slate-300 shadow-2xl max-h-[90vh] flex flex-col">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200 mb-3">
                  <div>
                    <h3 className="text-lg font-black text-slate-900 flex items-center gap-2">
                      📋 팀내 주요 공지내용 확인
                    </h3>
                    <p className="text-xs text-slate-500 mt-0.5">
                      Firebase DB에 저장된 팀 전체 인수인계 및 지휘 지침 히스토리를 확인합니다.
                    </p>
                  </div>
                  <button
                    onClick={() => {
                      setIsNoticeListModalOpen(false);
                      setIsNoticeWriteModalOpen(true);
                    }}
                    className="px-3.5 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-black transition"
                  >
                    + 새 공지 쓰기
                  </button>
                </div>

                <div className="overflow-y-auto flex-1 pr-1 space-y-3">
                  {notices.length === 0 ? (
                    <div className="text-center py-12 text-slate-400 text-xs">
                      등록된 공지사항이 없습니다. 새 공지를 등록해 보십시오.
                    </div>
                  ) : (
                    notices.map((n) => (
                      <div key={n.key} className="p-4 rounded-2xl bg-slate-50 border border-slate-200 hover:border-blue-300 transition">
                        <div className="flex items-center justify-between mb-1.5">
                          <div className="flex items-center gap-2">
                            <span className={`px-2 py-0.5 rounded text-[10px] font-black ${
                              n.priority === '긴급' ? 'bg-rose-100 text-rose-700 border border-rose-200' :
                              n.priority === '필독' ? 'bg-amber-100 text-amber-800 border border-amber-200' :
                              'bg-slate-200 text-slate-700'
                            }`}>
                              {n.priority}
                            </span>
                            <h4 className="text-sm font-extrabold text-slate-900">{n.title}</h4>
                          </div>
                          <span className="text-[11px] text-slate-400 font-mono">{n.dateStr}</span>
                        </div>
                        <p className="text-xs text-slate-700 whitespace-pre-wrap leading-relaxed pl-1 mb-2">
                          {n.content}
                        </p>
                        <div className="flex items-center justify-between text-[11px] text-slate-400 pt-2 border-t border-slate-200/60">
                          <span>작성 대원: <strong>{n.authorName}</strong></span>
                          {(currentUser.role === 'admin' || currentUser.id === n.authorId) && (
                            <button
                              onClick={() => handleDeleteNotice(n.key)}
                              className="text-rose-600 hover:text-rose-800 font-bold"
                            >
                              삭제
                            </button>
                          )}
                        </div>
                      </div>
                    ))
                  )}
                </div>

                <div className="flex justify-end pt-4 mt-3 border-t border-slate-200">
                  <button
                    onClick={() => setIsNoticeListModalOpen(false)}
                    className="px-5 py-2 bg-slate-800 hover:bg-slate-900 text-white text-xs font-black rounded-xl transition"
                  >
                    닫기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 1년치 공평성 검증 모달 */}
          {isFairnessModalOpen && fairnessAnalysis && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 w-full max-w-4xl border border-slate-300 shadow-2xl max-h-[90vh] flex flex-col">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200 mb-3">
                  <div>
                    <h3 className="text-lg font-black text-slate-900 flex items-center gap-2">
                      📊 12개월 연간 누적 공평성 검증 센터
                    </h3>
                    <p className="text-xs text-slate-500 mt-0.5">
                      총원 {members.length}명 기준 연간 균등 분배를 검증합니다.
                    </p>
                  </div>
                  {currentUser.role === 'admin' ? (
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-bold text-slate-500">대원 선택:</span>
                      <select
                        value={selectedMemberId}
                        onChange={(e) => setSelectedMemberId(e.target.value)}
                        className="bg-slate-100 border border-slate-300 rounded-lg px-2.5 py-1 text-xs font-bold text-blue-600 focus:outline-none"
                      >
                        {members.map(m => (
                          <option key={m.id} value={m.id}>{m.name} ({m.id})</option>
                        ))}
                      </select>
                    </div>
                  ) : (
                    <span className="text-xs px-3 py-1 bg-blue-50 text-blue-700 rounded-full font-bold border border-blue-200">
                      {fairnessAnalysis.memberName} 대원 전용 브리핑
                    </span>
                  )}
                </div>

                <div className="p-4 rounded-2xl bg-gradient-to-r from-blue-50 via-indigo-50 to-emerald-50 border border-blue-200 mb-4 text-xs space-y-1.5">
                  <p className="font-extrabold text-slate-900 text-sm flex items-center gap-2">
                    <span>⚖️</span> {fairnessAnalysis.memberName} 대원의 1년치 공평성 종합 평가 ({members.length}인 체계)
                  </p>
                  <p className="text-slate-700 leading-relaxed">
                    • <strong>당직 집중 달:</strong> <span className="text-blue-700 font-bold">{fairnessAnalysis.heavyMonths.join(", ") || "균등 분배"}</span>
                  </p>
                  <p className="text-slate-700 leading-relaxed">
                    • <strong>당직 여유 달(보상):</strong> <span className="text-emerald-700 font-bold">{fairnessAnalysis.lightMonths.join(", ") || "균등 분배"}</span>
                  </p>
                  <p className="text-indigo-800 font-black pt-1 border-t border-indigo-200/60">
                    ✔ <strong>1년 365일 누적 결과:</strong> 총 당직 {myAnnualStat.day + myAnnualStat.night}회 (주간 {myAnnualStat.day}회, 야간 {myAnnualStat.night}회, 주말당직 {myAnnualStat.weekend}회)로 <strong>{members.length}인 전원 오차 0~1회 이내 완전 균등</strong> 달성!
                  </p>
                </div>

                <div className="overflow-y-auto flex-1 pr-1 border border-slate-200 rounded-2xl">
                  <table className="w-full text-center border-collapse text-xs">
                    <thead>
                      <tr className="bg-slate-50 text-slate-600 border-b border-slate-200">
                        <th className="py-2.5 px-3 font-bold">구분 (월)</th>
                        <th className="py-2.5 px-3 font-bold text-amber-700">주간(D)</th>
                        <th className="py-2.5 px-3 font-bold text-blue-700">야간(N)</th>
                        <th className="py-2.5 px-3 font-bold text-indigo-700">월 당직 합계</th>
                        <th className="py-2.5 px-3 font-bold text-rose-700">주말 당직</th>
                        <th className="py-2.5 px-3 font-bold text-slate-700">부하 상태</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 font-mono">
                      {fairnessAnalysis.breakdown.map(item => {
                        const isCurrent = item.month === month;
                        let loadBadge = <span className="px-2 py-0.5 rounded bg-slate-100 text-slate-600 font-bold">보통</span>;
                        if (item.totalDuty >= 4 || item.weekend >= 3) {
                          loadBadge = <span className="px-2 py-0.5 rounded bg-blue-100 text-blue-800 font-bold border border-blue-200">당직 집중</span>;
                        } else if (item.totalDuty <= 2 || item.weekend <= 1) {
                          loadBadge = <span className="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-bold border border-emerald-200">여유 (보상)</span>;
                        }

                        return (
                          <tr key={item.month} className={isCurrent ? 'bg-blue-50/70 font-black' : 'hover:bg-slate-50'}>
                            <td className="py-2.5 px-3 font-sans">
                              {item.month}월 {isCurrent && <span className="text-[10px] text-blue-600 font-bold">(선택월)</span>}
                            </td>
                            <td className="py-2.5 px-3 font-bold text-amber-800">{item.day}회</td>
                            <td className="py-2.5 px-3 font-bold text-blue-800">{item.night}회</td>
                            <td className="py-2.5 px-3 font-black text-indigo-900">{item.totalDuty}회</td>
                            <td className="py-2.5 px-3 font-bold text-rose-800">{item.weekend}회</td>
                            <td className="py-2.5 px-3 font-sans">{loadBadge}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                    <tfoot>
                      <tr className="bg-slate-100 font-black text-slate-900 border-t border-slate-300">
                        <td className="py-3 px-3">연간 누적 총합</td>
                        <td className="py-3 px-3 text-amber-800">{myAnnualStat.day}회</td>
                        <td className="py-3 px-3 text-blue-800">{myAnnualStat.night}회</td>
                        <td className="py-3 px-3 text-indigo-900">{myAnnualStat.day + myAnnualStat.night}회</td>
                        <td className="py-3 px-3 text-rose-800">{myAnnualStat.weekend}회</td>
                        <td className="py-3 px-3 text-emerald-700 font-sans">100% 공평 일치</td>
                      </tr>
                    </tfoot>
                  </table>
                </div>

                <div className="flex justify-end pt-4 mt-3 border-t border-slate-200">
                  <button
                    onClick={() => setIsFairnessModalOpen(false)}
                    className="px-5 py-2 bg-slate-800 hover:bg-slate-900 text-white text-xs font-black rounded-xl transition"
                  >
                    확인 완료 (창 닫기)
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 대원 본인 ID/PW 변경 모달 */}
          {isMyAccountModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 w-full max-w-md border border-slate-300 shadow-2xl">
                <h3 className="text-lg font-black text-slate-900 mb-1 flex items-center gap-2">
                  🔑 내 계정 정보 설정
                </h3>
                <p className="text-xs text-slate-500 mb-4">
                  <strong>{currentUser.name}</strong> 대원님의 로그인 ID와 비밀번호를 변경합니다.
                </p>

                <div className="space-y-3.5">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">로그인 아이디 (ID)</label>
                    <input
                      type="text"
                      value={newMyId}
                      onChange={(e) => setNewMyId(e.target.value)}
                      placeholder="새 ID 입력"
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-bold text-slate-900 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">새 비밀번호 (PW)</label>
                    <input
                      type="password"
                      value={newMyPw}
                      onChange={(e) => setNewMyPw(e.target.value)}
                      placeholder="변경할 새 비밀번호 입력 (미입력 시 기존 유지)"
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-bold text-slate-900 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    />
                  </div>
                </div>

                <div className="flex justify-end gap-2 mt-6 pt-3 border-t border-slate-200">
                  <button
                    onClick={() => setIsMyAccountModalOpen(false)}
                    className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition"
                  >
                    취소
                  </button>
                  <button
                    onClick={handleSaveMyAccount}
                    className="px-5 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-black rounded-xl shadow-md transition"
                  >
                    내 계정 변경 저장
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 관리자 전용 대원 추가/삭제/관리 모달 */}
          {isRosterModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 w-full max-w-4xl border border-slate-300 shadow-2xl max-h-[90vh] flex flex-col">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200 mb-3">
                  <div>
                    <h3 className="text-lg font-black text-slate-900 flex items-center gap-2">
                      👥 교대근무 대원 관리 (가변 인원 편성)
                    </h3>
                    <p className="text-xs text-slate-500 mt-0.5">
                      인원이 변동되어도 유연하게 추가/삭제할 수 있으며, 근무표에 실시간 자동 반영됩니다.
                    </p>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 font-bold border border-blue-200">
                      현재 인원: {tempRoster.length}명
                    </span>
                    <button
                      type="button"
                      onClick={handleAddNewMember}
                      className="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-black shadow-sm transition flex items-center gap-1"
                    >
                      + 대원 추가
                    </button>
                  </div>
                </div>

                <div className="overflow-y-auto flex-1 pr-1 space-y-2">
                  <div className="grid grid-cols-12 gap-2 text-xs font-bold text-slate-500 px-3 py-1 bg-slate-50 rounded-lg">
                    <span className="col-span-1">순번</span>
                    <span className="col-span-3">로그인 ID</span>
                    <span className="col-span-4">성함 (이름 매핑)</span>
                    <span className="col-span-3">비밀번호 (PW)</span>
                    <span className="col-span-1 text-center">관리</span>
                  </div>

                  {tempRoster.map((item, idx) => (
                    <div key={idx} className="grid grid-cols-12 gap-2 items-center p-2 rounded-xl bg-slate-50 border border-slate-200 hover:border-blue-300 transition">
                      <span className="col-span-1 text-xs font-bold text-slate-400 pl-1">
                        #{String(idx + 1).padStart(2, '0')}
                      </span>
                      <div className="col-span-3">
                        <input
                          type="text"
                          value={item.id}
                          onChange={(e) => handleRosterFieldChange(idx, "id", e.target.value)}
                          placeholder="ID"
                          className="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-mono font-bold text-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                      </div>
                      <div className="col-span-4">
                        <input
                          type="text"
                          value={item.name}
                          onChange={(e) => handleRosterFieldChange(idx, "name", e.target.value)}
                          placeholder="성함 (예: 김경준)"
                          className="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                      </div>
                      <div className="col-span-3">
                        <input
                          type="text"
                          value={item.pw || "1234"}
                          onChange={(e) => handleRosterFieldChange(idx, "pw", e.target.value)}
                          placeholder="비밀번호"
                          className="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-mono font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                      </div>
                      <div className="col-span-1 text-center">
                        <button
                          type="button"
                          onClick={() => handleDeleteMember(idx)}
                          className="p-1.5 text-rose-600 hover:bg-rose-100 rounded-lg transition text-xs font-bold"
                          title="대원 삭제"
                        >
                          삭제
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="flex items-center justify-between pt-4 border-t border-slate-200 mt-3">
                  <span className="text-[11px] text-slate-500">
                    * 인원 변경 후 [Firebase DB에 영구 저장]을 누르면 즉시 전체 근무표가 재계산되어 동기화됩니다.
                  </span>
                  <div className="flex gap-2">
                    <button
                      onClick={() => setIsRosterModalOpen(false)}
                      className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition"
                    >
                      취소
                    </button>
                    <button
                      onClick={handleSaveRoster}
                      className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-black rounded-xl shadow-md shadow-blue-500/20 transition"
                    >
                      Firebase DB에 영구 저장 ({tempRoster.length}명 확정)
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function Root() {
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem(AUTH_SESSION_KEY);
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });

      const [justLoggedIn, setJustLoggedIn] = useState(false);

      const handleLoginSuccess = (user, fromLogin = false) => {
        setCurrentUser(user);
        if (fromLogin) setJustLoggedIn(true);
      };

      const handleLogout = () => {
        window.speechSynthesis?.cancel();
        localStorage.removeItem(AUTH_SESSION_KEY);
        setCurrentUser(null);
        setJustLoggedIn(false);
      };

      const handleUpdateCurrentUserName = (newName) => {
        if (currentUser) {
          const updated = { ...currentUser, name: newName };
          setCurrentUser(updated);
          localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify(updated));
        }
      };

      if (!currentUser) {
        return <LoginScreen onLoginSuccess={handleLoginSuccess} />;
      }
      return (
        <MainDashboard
          currentUser={currentUser}
          onLogout={handleLogout}
          onUpdateCurrentUserName={handleUpdateCurrentUserName}
          justLoggedIn={justLoggedIn}
        />
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
