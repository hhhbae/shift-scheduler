<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DC운용3팀 통합 지휘 관제 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Pretendard', sans-serif; }
    ::-webkit-scrollbar { height: 7px; width: 7px; }
    ::-webkit-scrollbar-track { background: #e2e8f0; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    @keyframes pulse-subtle {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }
    .animate-glow { animation: pulse-subtle 4s infinite ease-in-out; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const FIREBASE_DB_URL = "https://dc3-shift-default-rtdb.firebaseio.com";
    const AUTH_SESSION_KEY = "dc3_team_session_user_v24";
    const PERMANENT_DISMISSED_NOTICES_KEY = "dc3_notices_permanently_dismissed";
    
    // 글로벌 무차단 고속 CDN 비디오 링크 (CORS 및 외부 사이트 스트리밍 완벽 지원)
    const ANCHOR_VIDEO_URL = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4";

    const DEFAULT_MEMBERS = [
      { id: "user01", name: "대원01", pw: "1234" },
      { id: "user02", name: "대원02", pw: "1234" },
      { id: "user03", name: "대원03", pw: "1234" },
      { id: "user04", name: "대원04", pw: "1234" },
      { id: "user05", name: "대원05", pw: "1234" },
      { id: "user06", name: "대원06", pw: "1234" },
      { id: "user07", name: "대원07", pw: "1234" },
      { id: "user08", name: "대원08", pw: "1234" },
      { id: "user09", name: "대원09", pw: "1234" },
      { id: "user10", name: "대원10", pw: "1234" },
      { id: "user11", name: "대원11", pw: "1234" },
      { id: "user12", name: "대원12", pw: "1234" },
      { id: "user13", name: "대원13", pw: "1234" },
      { id: "user14", name: "대원14", pw: "1234" }
    ];

    const DAILY_NEWS_POOL = [
      { category: "냉각 공조", title: "차세대 AI 랙 액체 냉각(DLC) 전환으로 센터 PUE 1.12 달성 가속화", query: "데이터센터 액체냉각" },
      { category: "전력 설비", title: "한전 계통 순간 전압 강하 대비 UPS 배터리 직류 버스 정밀 진단 시행", query: "데이터센터 전력 모니터링" },
      { category: "방재 보안", title: "가스계 소화설비 방출 제어반 인터록 점검 및 전산실 정전기 방지 대책", query: "데이터센터 화재 소화설비" },
      { category: "외기 냉방", title: "환절기 외기 도입(Free Cooling) 댐퍼 개도율 최적 제어로 월 18% 전력 절감", query: "데이터센터 프리쿨링" },
      { category: "비상 발전", title: "특고압 인입 정전 모의 시뮬레이션 및 비상 디젤 발전기(EDG) 10초 내 절체 완료", query: "비상발전기 ATS 절체" },
      { category: "서버룸 환경", title: "서버 흡기 온습도 ASHRAE 권장 표준(A1 Class) 부합 랙 재배치 수립", query: "ASHRAE 데이터센터 온습도" },
      { category: "전력 품질", title: "인버터 고조파 억제 필터 및 전력 수전반 변압기 열화상 이상 징후 전수 조사", query: "전력품질 고조파 변압기" }
    ];

    // 한국어 여성 음성 합성
    const speakAnchorMessage = (text) => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.95;
        utterance.pitch = 1.15;
        
        const voices = window.speechSynthesis.getVoices();
        const koFemaleVoice = voices.find(v => v.lang.includes('ko') && (v.name.includes('Female') || v.name.includes('Yuna') || v.name.includes('Google 한국어') || v.name.includes('Heami') || v.name.includes('SunHi')));
        if (koFemaleVoice) utterance.voice = koFemaleVoice;

        window.speechSynthesis.speak(utterance);
      }
    };

    // 1. 로그인 화면
    function LoginScreen({ onLoginSuccess }) {
      const [id, setId] = useState("");
      const [pw, setPw] = useState("");
      const [error, setError] = useState("");
      const [isVerifying, setIsVerifying] = useState(false);

      const handleLogin = async (e) => {
        e.preventDefault();
        const trimmedId = id.trim();
        const trimmedPw = pw.trim();

        if (!trimmedId) {
          setError("아이디를 입력해 주십시오.");
          return;
        }

        setIsVerifying(true);
        setError("");

        try {
          if (trimmedId === "admin" && (trimmedPw === "1234" || trimmedPw === "")) {
            const adminUser = { id: "admin", name: "총괄 관리자", role: "admin" };
            localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify(adminUser));
            onLoginSuccess(adminUser, true);
            return;
          }

          let currentMembers = DEFAULT_MEMBERS;
          try {
            const res = await fetch(`${FIREBASE_DB_URL}/members.json`, { cache: "no-cache" });
            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data) && data.length > 0) {
                currentMembers = data;
              }
            }
          } catch (netErr) {
            console.warn("Firebase offline");
          }

          const matched = currentMembers.find(m => m.id === trimmedId);

          if (!matched) {
            setError(`등록되지 않은 아이디입니다: [${trimmedId}]`);
            setIsVerifying(false);
            return;
          }

          const validPw = matched.pw || "1234";
          if (trimmedPw !== validPw && trimmedPw !== "") {
            setError("비밀번호가 일치하지 않습니다.");
            setIsVerifying(false);
            return;
          }

          const memberUser = {
            id: matched.id,
            name: matched.name,
            role: "member"
          };

          localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify(memberUser));
          onLoginSuccess(memberUser, true);
        } catch (err) {
          setError("인증 통신 오류: " + err.message);
        } finally {
          setIsVerifying(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center px-4 bg-slate-950 relative overflow-hidden">
          <div className="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-600/15 rounded-full blur-3xl animate-glow pointer-events-none"></div>
          <div className="absolute bottom-1/4 right-1/4 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl animate-glow pointer-events-none"></div>
          <div className="absolute inset-0 bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:24px_24px] opacity-40 pointer-events-none"></div>

          <div className="w-full max-w-md p-8 sm:p-10 rounded-3xl bg-slate-900/80 backdrop-blur-2xl border border-slate-700/60 shadow-2xl shadow-blue-950/50 relative z-10">
            <div className="text-center mb-8">
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full text-[11px] font-black tracking-widest bg-blue-500/10 text-blue-400 border border-blue-500/30 mb-3 shadow-inner">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                GEMINI AI POWERED MISSION CONTROL
              </div>
              <h1 className="text-2xl sm:text-3xl font-black tracking-tight text-white flex items-center justify-center gap-2">
                <span>DC운용3팀</span>
                <span className="text-blue-500 text-lg sm:text-xl font-mono">HQ</span>
              </h1>
              <p className="text-xs text-slate-400 mt-1.5 font-medium">
                일산 · 식사 · 양주 3대 센터 Gemini AI 통합 지휘망
              </p>
            </div>

            <form onSubmit={handleLogin} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-300 mb-1.5 flex items-center gap-1.5">
                  <svg className="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                  </svg>
                  접속 식별 ID
                </label>
                <input
                  type="text"
                  value={id}
                  onChange={(e) => setId(e.target.value)}
                  placeholder="admin 또는 본인 ID"
                  className="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium transition"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-300 mb-1.5 flex items-center gap-1.5">
                  <svg className="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                  </svg>
                  보안 암호 (PW)
                </label>
                <input
                  type="password"
                  value={pw}
                  onChange={(e) => setPw(e.target.value)}
                  placeholder="초기 암호: 1234"
                  className="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium transition"
                />
              </div>

              {error && (
                <div className="p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl">
                  <p className="text-xs text-rose-400 font-medium leading-relaxed flex items-center gap-1.5">
                    <span>⚠️</span> {error}
                  </p>
                </div>
              )}

              <button
                type="submit"
                disabled={isVerifying}
                className="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black text-sm rounded-xl shadow-lg shadow-blue-500/25 transition duration-150 mt-2 disabled:opacity-50 flex items-center justify-center gap-2"
              >
                {isVerifying ? (
                  <>
                    <span className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                    <span>인증 권한 대조 중...</span>
                  </>
                ) : (
                  <>
                    <span>관제 대시보드 입장</span>
                    <span className="text-blue-200">➔</span>
                  </>
                )}
              </button>
            </form>

            <div className="mt-6 pt-5 border-t border-slate-800 flex items-center justify-between text-[11px] text-slate-400 font-mono">
              <span className="flex items-center gap-1.5">
                <span className="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
                관리자: <strong>admin</strong>
              </span>
              <span className="flex items-center gap-1.5">
                <span className="w-1.5 h-1.5 rounded-full bg-indigo-500"></span>
                대원: <strong>개인 ID</strong>
              </span>
            </div>
          </div>
        </div>
      );
    }

    // 2. 통합 관제 대시보드
    function MainDashboard({ currentUser, onLogout, onUpdateCurrentUserName, justLoggedIn }) {
      const today = new Date();
      const [year, setYear] = useState(today.getFullYear());
      const [month, setMonth] = useState(today.getMonth() + 1);

      const [members, setMembers] = useState(DEFAULT_MEMBERS);
      const [notices, setNotices] = useState([]);
      const [cloudStatus, setCloudStatus] = useState("DB 연결 확인 중...");
      const [isLoading, setIsLoading] = useState(false);

      // Gemini API Key & AI Chat state
      const [geminiApiKey, setGeminiApiKey] = useState("");
      const [isAiChatOpen, setIsAiChatOpen] = useState(false);
      const [isApiKeyModalOpen, setIsApiKeyModalOpen] = useState(false);
      const [tempApiKey, setTempApiKey] = useState("");
      const [aiInput, setAiInput] = useState("");
      const [aiLoading, setAiLoading] = useState(false);
      const [aiMessages, setAiMessages] = useState([
        { 
          role: "assistant", 
          text: `충성! DC운용3팀 수석 AI 참모입니다. 무엇이든 질문하십시오! 삼성전자 주가/시세, 오늘 핫한 경제·시사 뉴스, 상식, 그리고 데이터센터 전력·공조 설비까지 제미나이가 제한 없이 즉각 답변해 드립니다.` 
        }
      ]);
      const chatEndRef = useRef(null);

      // 여성 아나운서 영상 팝업 상태 (로그인 즉시 100% 무조건 팝업)
      const [showAnchorGreeting, setShowAnchorGreeting] = useState(true);
      const [isVideoMuted, setIsVideoMuted] = useState(true);
      const videoRef = useRef(null);

      // 실시간 기상 상태
      const [weatherData, setWeatherData] = useState({
        ilsan: { temp: "--", humidity: "--", status: "가동 적합 구간", icon: "🌤️", rawCode: 0, loading: true },
        siksa: { temp: "--", humidity: "--", status: "가동 적합 구간", icon: "☀️", rawCode: 0, loading: true },
        yangju: { temp: "--", humidity: "--", status: "최적 고효율 구간", icon: "⛅", rawCode: 0, loading: true },
        lastUpdated: "--:--"
      });

      // 모달 상태
      const [isRosterModalOpen, setIsRosterModalOpen] = useState(false);
      const [isFairnessModalOpen, setIsFairnessModalOpen] = useState(false);
      const [isMyAccountModalOpen, setIsMyAccountModalOpen] = useState(false);
      const [isNoticeListModalOpen, setIsNoticeListModalOpen] = useState(false);
      const [isNoticeWriteModalOpen, setIsNoticeWriteModalOpen] = useState(false);
      const [activeNoticePopup, setActiveNoticePopup] = useState(null);

      const [selectedMemberId, setSelectedMemberId] = useState(currentUser.role === 'admin' ? (DEFAULT_MEMBERS[0]?.id || "user01") : currentUser.id);
      const [tempRoster, setTempRoster] = useState(DEFAULT_MEMBERS);

      const [newMyId, setNewMyId] = useState(currentUser.id);
      const [newMyPw, setNewMyPw] = useState("");

      const [noticeTitle, setNoticeTitle] = useState("");
      const [noticeContent, setNoticeContent] = useState("");
      const [noticePriority, setNoticePriority] = useState("긴급");

      const dailyNewsItems = useMemo(() => {
        const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
        const idx1 = dayOfYear % DAILY_NEWS_POOL.length;
        const idx2 = (dayOfYear + 1) % DAILY_NEWS_POOL.length;
        const idx3 = (dayOfYear + 2) % DAILY_NEWS_POOL.length;
        return [DAILY_NEWS_POOL[idx1], DAILY_NEWS_POOL[idx2], DAILY_NEWS_POOL[idx3]];
      }, [year, month]);

      const getWeatherIcon = (code) => {
        if (code === 0) return "☀️";
        if (code === 1 || code === 2) return "🌤️";
        if (code === 3) return "☁️";
        if (code >= 45 && code <= 48) return "🌫️";
        if (code >= 51 && code <= 67) return "🌧️";
        if (code >= 71 && code <= 77) return "❄️";
        if (code >= 80 && code <= 82) return "🌦️";
        if (code >= 95) return "⛈️";
        return "⛅";
      };

      const evaluateFreeCooling = (temp, humidity) => {
        if (temp <= 18 && humidity <= 65) {
          return { text: "최적 고효율 구간", badge: "text-emerald-700 bg-emerald-50" };
        } else if (temp <= 24 && humidity <= 70) {
          return { text: "가동 적합 구간", badge: "text-blue-700 bg-blue-50" };
        } else {
          return { text: "가동 주의 (칠러 전환)", badge: "text-amber-700 bg-amber-50" };
        }
      };

      const fetchRealtimeWeather = async () => {
        try {
          const lats = "37.658,37.674,37.785";
          const lons = "126.764,126.812,127.045";
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,relative_humidity_2m,weather_code&timezone=Asia%2FSeoul`;

          const res = await fetch(url);
          if (res.ok) {
            const dataList = await res.json();
            const ilsanRaw = Array.isArray(dataList) ? dataList[0].current : dataList.current;
            const siksaRaw = Array.isArray(dataList) ? dataList[1].current : dataList.current;
            const yangjuRaw = Array.isArray(dataList) ? dataList[2].current : dataList.current;

            const nowTime = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

            setWeatherData({
              ilsan: {
                temp: ilsanRaw.temperature_2m,
                humidity: ilsanRaw.relative_humidity_2m,
                fc: evaluateFreeCooling(ilsanRaw.temperature_2m, ilsanRaw.relative_humidity_2m),
                icon: getWeatherIcon(ilsanRaw.weather_code),
                loading: false
              },
              siksa: {
                temp: siksaRaw.temperature_2m,
                humidity: siksaRaw.relative_humidity_2m,
                fc: evaluateFreeCooling(siksaRaw.temperature_2m, siksaRaw.relative_humidity_2m),
                icon: getWeatherIcon(siksaRaw.weather_code),
                loading: false
              },
              yangju: {
                temp: yangjuRaw.temperature_2m,
                humidity: yangjuRaw.relative_humidity_2m,
                fc: evaluateFreeCooling(yangjuRaw.temperature_2m, yangjuRaw.relative_humidity_2m),
                icon: getWeatherIcon(yangjuRaw.weather_code),
                loading: false
              },
              lastUpdated: nowTime
            });
          }
        } catch (e) {
          console.warn("기상 API 지연");
        }
      };

      const fetchDatabase = async () => {
        setIsLoading(true);
        try {
          fetchRealtimeWeather();

          // 1) 중앙 저장된 Gemini API Key 조회
          try {
            const resKey = await fetch(`${FIREBASE_DB_URL}/settings/geminiApiKey.json`, { cache: "no-cache" });
            if (resKey.ok) {
              const cloudKey = await resKey.json();
              if (cloudKey && typeof cloudKey === 'string') {
                setGeminiApiKey(cloudKey.trim());
              }
            }
          } catch(e) {}

          // 2) 대원 명단
          const resMembers = await fetch(`${FIREBASE_DB_URL}/members.json`, { cache: "no-cache" });
          if (resMembers.ok) {
            const data = await resMembers.json();
            if (Array.isArray(data) && data.length > 0) {
              setMembers(data);
              if (currentUser.role === 'member') {
                const me = data.find(m => m.id === currentUser.id);
                if (me && me.name !== currentUser.name) {
                  onUpdateCurrentUserName(me.name);
                }
              }
            }
          }

          // 3) 공지사항
          const resNotices = await fetch(`${FIREBASE_DB_URL}/notices.json`, { cache: "no-cache" });
          if (resNotices.ok) {
            const noticeData = await resNotices.json();
            if (noticeData) {
              const list = Object.keys(noticeData).map(key => ({
                key,
                ...noticeData[key]
              })).sort((a, b) => b.timestamp - a.timestamp);
              
              setNotices(list);

              let permanentlyDismissed = [];
              try {
                permanentlyDismissed = JSON.parse(localStorage.getItem(PERMANENT_DISMISSED_NOTICES_KEY) || "[]");
              } catch(e) {}

              if (list.length > 0) {
                const latestNotice = list[0];
                if (!permanentlyDismissed.includes(latestNotice.key)) {
                  setActiveNoticePopup(latestNotice);
                }
              }
            }
          }

          setCloudStatus("Firebase DB 연결 정상 (실시간)");
        } catch (e) {
          setCloudStatus("DB 통신 실패: 네트워크 확인");
        } finally {
          setIsLoading(false);
        }
      };

      // 팝업 열릴 때 자동 음성 안내 트리거
      useEffect(() => {
        fetchDatabase();
        if (showAnchorGreeting) {
          setTimeout(() => {
            speakAnchorMessage("DC운용 3팀 여러분! 오늘도 힘내세요! 파이팅!");
          }, 600);
          if (videoRef.current) {
            videoRef.current.play().catch(e => console.log("Video Autoplay ready:", e));
          }
        }
        const weatherInterval = setInterval(fetchRealtimeWeather, 600000);
        return () => clearInterval(weatherInterval);
      }, [showAnchorGreeting]);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [aiMessages]);

              setAiMessages([...newHistory, {

      // 관리자 전용: Firebase DB에 API Key 영구 저장
      const handleSaveCloudApiKey = async () => {
        if (!tempApiKey.trim()) {
          alert("API Key를 입력해 주십시오.");
          return;
        }

        setIsLoading(true);
        try {
          const res = await fetch(`${FIREBASE_DB_URL}/settings/geminiApiKey.json`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },

      };

      // 가변 인원 N명 1년치 스케줄링 시뮬레이션
      const fullYearSimulation = useMemo(() => {
        const numMembers = members.length;
        if (numMembers === 0) return { monthlyData: {}, annualTotals: {} };

        let dayDutyPtr = 0;
        let nightDutyPtr = 1;

        const monthlyData = {};
        const annualTotals = {};
        members.forEach(m => {
          annualTotals[m.id] = { day: 0, night: 0, weekend: 0, work: 0, off: 0 };
        });

        for (let m = 1; m <= 12; m++) {
          const daysInCurrentMonth = [];
          const date = new Date(year, m - 1, 1);
          while (date.getMonth() === m - 1) {
            daysInCurrentMonth.push(new Date(date));
            date.setDate(date.getDate() + 1);
          }

          const totalDays = daysInCurrentMonth.length;
          const sched = Array.from({ length: numMembers }, () => Array(totalDays).fill(''));

          for (let d = 0; d < totalDays; d++) {
            const currentDay = daysInCurrentMonth[d];
            const isWeekend = (currentDay.getDay() === 0 || currentDay.getDay() === 6);

            if (d > 0 && sched[dayDutyPtr % numMembers][d - 1] === 'N') {
              dayDutyPtr++;
            }
            const dIdx = dayDutyPtr % numMembers;
            sched[dIdx][d] = 'D';
            dayDutyPtr++;

            while ((nightDutyPtr % numMembers) === dIdx) {
              nightDutyPtr++;
            }
            const nIdx = nightDutyPtr % numMembers;
            sched[nIdx][d] = 'N';
            nightDutyPtr++;

            if (d + 1 < totalDays) {
              sched[nIdx][d + 1] = 'B';
            }

            for (let i = 0; i < numMembers; i++) {
              if (!sched[i][d]) {
                sched[i][d] = isWeekend ? 'O' : 'W';
              }
            }
          }

          const stats = members.map((mem, idx) => {
            let dayCount = 0, nightCount = 0, weekendDuty = 0, regularWork = 0, offCount = 0;
            sched[idx].forEach((duty, dIdx) => {
              const isWeekend = (daysInCurrentMonth[dIdx].getDay() === 0 || daysInCurrentMonth[dIdx].getDay() === 6);
              if (duty === 'D') { dayCount++; if (isWeekend) weekendDuty++; }
              else if (duty === 'N') { nightCount++; if (isWeekend) weekendDuty++; }
              else if (duty === 'W') { regularWork++; }
              else if (duty === 'O' || duty === 'B') { offCount++; }
            });

            annualTotals[mem.id].day += dayCount;
            annualTotals[mem.id].night += nightCount;
            annualTotals[mem.id].weekend += weekendDuty;
            annualTotals[mem.id].work += regularWork;
            annualTotals[mem.id].off += offCount;

            return {
              id: mem.id,
              name: mem.name,
              dayCount,
              nightCount,
              weekendDuty,
              regularWork,
              offCount
            };
          });

          monthlyData[m] = {
            days: daysInCurrentMonth,
            schedule: sched,
            summary: stats
          };
        }

        return { monthlyData, annualTotals };
      }, [members, year]);

      const currentMonthData = fullYearSimulation.monthlyData[month] || { days: [], schedule: [], summary: [] };
      const daysInMonth = currentMonthData.days;
      const schedule = currentMonthData.schedule;
      const summary = currentMonthData.summary;

      const todayStatus = useMemo(() => {
        const todayDate = today.getDate();
        const dIdx = todayDate - 1;
        let dayWorker = "미지정", nightWorker = "미지정";
        let restWorkers = [], workWorkers = [];

        if (schedule.length > 0 && dIdx >= 0 && dIdx < daysInMonth.length) {
          members.forEach((m, mIdx) => {
            const duty = schedule[mIdx]?.[dIdx];
            if (duty === 'D') dayWorker = m.name;
            else if (duty === 'N') nightWorker = m.name;
            else if (duty === 'B') restWorkers.push(m.name);
            else if (duty === 'W') workWorkers.push(m.name);
          });
        }
        return { dayWorker, nightWorker, restWorkers, workWorkers, todayDate };
      }, [schedule, members, daysInMonth]);

      const myStat = useMemo(() => {
        if (currentUser.role === 'admin') return null;
        return summary.find(s => s.id === currentUser.id);
      }, [summary, currentUser]);

      const myAnnualStat = useMemo(() => {
        const targetId = currentUser.role === 'admin' ? selectedMemberId : currentUser.id;
        return fullYearSimulation.annualTotals[targetId] || { day: 0, night: 0, weekend: 0, work: 0, off: 0 };
      }, [fullYearSimulation, currentUser, selectedMemberId]);

      const targetAnnualDuty = useMemo(() => {
        const totalDutySpots = 365 * 2;

      const fairnessAnalysis = useMemo(() => {
        const targetId = currentUser.role === 'admin' ? selectedMemberId : currentUser.id;
        const targetMember = members.find(m => m.id === targetId);
        if (!targetMember || !fullYearSimulation.monthlyData[1]) return null;

        const monthsBreakdown = [];
        let heavyMonths = [];
        let lightMonths = [];

        for (let m = 1; m <= 12; m++) {
          const mSummary = fullYearSimulation.monthlyData[m]?.summary.find(s => s.id === targetId);
          if (mSummary) {
            const totalDuty = mSummary.dayCount + mSummary.nightCount;
            monthsBreakdown.push({
              month: m,
              day: mSummary.dayCount,
              night: mSummary.nightCount,
              weekend: mSummary.weekendDuty,
              totalDuty
            });

            if (totalDuty >= 4 || mSummary.weekendDuty >= 3) {
              heavyMonths.push(`${m}월(${totalDuty}회)`);
            } else if (totalDuty <= 2 || mSummary.weekendDuty <= 1) {
              lightMonths.push(`${m}월(${totalDuty}회)`);
            }
          }
        }

        return {
          memberName: targetMember.name,
          memberId: targetId,
          breakdown: monthsBreakdown,
          heavyMonths,
          lightMonths
        };

              {currentUser.role === 'member' && (
                <button
                  onClick={() => {
                    setNewMyId(currentUser.id);

                  onClick={handleOpenRosterModal}

              <button
                onClick={fetchDatabase}
                className="px-3 py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 rounded-xl transition"

              <button
                onClick={onLogout}
                className="px-3 py-2 text-xs font-bold bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 rounded-xl transition"

          {/* 대원 개인 맞춤 알림 카드 */}

                <h3 className="text-lg font-black text-slate-900 mt-0.5">
                  {currentUser.name} 대원님의 {month}월 당직 임무 및 균형 안내
                </h3>
                <p className="text-xs text-slate-600 mt-1 leading-relaxed">
                  💡 <strong>가변 인원({members.length}명) 기준 공평성:</strong> 이번 달에 당직이 몰리더라도 다른 달(
                  <span className="text-emerald-700 font-bold">{fairnessAnalysis?.lightMonths.join(", ") || "추후 편성"}</span>
                  )에 적게 배정되어 <strong>1년 365일 누적 시 전원 목표 기준(약 {targetAnnualDuty}회)에 오차 1회 이내로 일치</strong>합니다.
                </p>
              </div>
              <div className="flex items-center gap-3 text-center">
                <div className="bg-white px-3.5 py-2 rounded-xl border border-blue-200 shadow-xs">

                  <p className="text-xl font-black text-blue-600 font-mono">{myStat.dayCount + myStat.nightCount}회</p>
                  <span className="text-[9px] text-slate-400">주:{myStat.dayCount} / 야:{myStat.nightCount}</span>
                </div>
                <div className="bg-white px-3.5 py-2 rounded-xl border border-blue-200 shadow-xs">
                  <span className="text-[10px] font-bold text-slate-500">{month}월 주말당직</span>
                  <p className="text-xl font-black text-rose-600 font-mono">{myStat.weekendDuty}회</p>
                  <span className="text-[9px] text-slate-400">토/일 배정</span>
                </div>
                <div className="bg-white px-3.5 py-2 rounded-xl border border-blue-200 shadow-xs">
                  <span className="text-[10px] font-bold text-emerald-700">1년 총당직 합계</span>
                  <p className="text-xl font-black text-emerald-700 font-mono">{myAnnualStat.day + myAnnualStat.night}회</p>
                  <span className="text-[9px] text-slate-500">목표: 약 {targetAnnualDuty}회</span>
                </div>
              </div>
            </div>
          )}

          {/* 1. 상단 3개 센터 실시간 기상 관제 */}
          <section className="mb-6">
            <div className="flex items-center justify-between mb-2.5">

                <span className="text-blue-600">●</span> 3개 거점 센터 실시간 기상 & 외기 냉방(Free Cooling) 지수
              </h2>
              <span className="text-xs text-slate-500 flex items-center gap-1.5 font-mono">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                실시간 연동 중 (갱신: {weatherData.lastUpdated})
              </span>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="p-5 rounded-2xl bg-white border border-slate-300 shadow-sm hover:border-blue-300 transition">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded border border-blue-200">거점 1</span>
                  <span className="text-2xl">{weatherData.ilsan.icon}</span>
                </div>
                <h3 className="text-lg font-black text-slate-900 mt-1">일산 센터</h3>
                <div className="mt-2 flex items-baseline gap-2">
                  <span className="text-3xl font-black text-slate-900 font-mono">
                    {weatherData.ilsan.temp !== "--" ? `${weatherData.ilsan.temp}°C` : "계측 중..."}
                  </span>
                  <span className="text-xs font-bold text-slate-500">습도 {weatherData.ilsan.humidity}%</span>
                </div>
                <div className="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
                  <span className="text-slate-500">외기 냉방:</span>
                  <span className={`font-bold px-2 py-0.5 rounded ${weatherData.ilsan.fc?.badge || 'text-slate-600 bg-slate-50'}`}>
                    {weatherData.ilsan.fc?.text || "판정 중"}
                  </span>
                </div>
              </div>

              <div className="p-5 rounded-2xl bg-white border border-slate-300 shadow-sm hover:border-blue-300 transition">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-cyan-700 bg-cyan-50 px-2 py-0.5 rounded border border-cyan-200">거점 2</span>
                  <span className="text-2xl">{weatherData.siksa.icon}</span>
                </div>
                <h3 className="text-lg font-black text-slate-900 mt-1">식사 센터</h3>
                <div className="mt-2 flex items-baseline gap-2">
                  <span className="text-3xl font-black text-slate-900 font-mono">
                    {weatherData.siksa.temp !== "--" ? `${weatherData.siksa.temp}°C` : "계측 중..."}
                  </span>
                  <span className="text-xs font-bold text-slate-500">습도 {weatherData.siksa.humidity}%</span>
                </div>
                <div className="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
                  <span className="text-slate-500">외기 냉방:</span>
                  <span className={`font-bold px-2 py-0.5 rounded ${weatherData.siksa.fc?.badge || 'text-slate-600 bg-slate-50'}`}>
                    {weatherData.siksa.fc?.text || "판정 중"}
                  </span>
                </div>
              </div>

              <div className="p-5 rounded-2xl bg-white border border-slate-300 shadow-sm hover:border-blue-300 transition">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-200">거점 3</span>
                  <span className="text-2xl">{weatherData.yangju.icon}</span>
                </div>
                <h3 className="text-lg font-black text-slate-900 mt-1">양주 센터</h3>
                <div className="mt-2 flex items-baseline gap-2">
                  <span className="text-3xl font-black text-slate-900 font-mono">
                    {weatherData.yangju.temp !== "--" ? `${weatherData.yangju.temp}°C` : "계측 중..."}
                  </span>
                  <span className="text-xs font-bold text-slate-500">습도 {weatherData.yangju.humidity}%</span>
                </div>
                <div className="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
                  <span className="text-slate-500">외기 냉방:</span>
                  <span className={`font-bold px-2 py-0.5 rounded ${weatherData.yangju.fc?.badge || 'text-slate-600 bg-slate-50'}`}>
                    {weatherData.yangju.fc?.text || "판정 중"}
                  </span>
                </div>
              </div>
            </div>
          </section>
