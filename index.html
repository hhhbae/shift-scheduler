<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DC운용3팀 통합 지휘 관제 포털</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5' }
          }
        }
      }
    }
  </script>
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Pretendard', sans-serif; }
    ::-webkit-scrollbar { height: 8px; width: 8px; }
    ::-webkit-scrollbar-track { background: #060911; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>
<body class="bg-[#050811] text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const INITIAL_MEMBERS = [
      "대원01", "대원02", "대원03", "대원04", "대원05", 
      "대원06", "대원07", "대원08", "대원09", "대원10", 
      "대원11", "대원12", "대원13", "대원14"
    ];

    const STORAGE_KEY = "dc3_team_members_v3";
    const AUTH_KEY = "dc3_team_auth_state";

    // 1. 로그인 인증 게이트웨이 화면
    function LoginScreen({ onLogin }) {
      const [id, setId] = useState("commander");
      const [pw, setPw] = useState("");
      const [error, setError] = useState("");

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        // 간이 보안 인증 (기본 패스워드: 1234 또는 자유 입력 허용)
        if (id.trim()) {
          localStorage.setItem(AUTH_KEY, "authenticated");
          onLogin();
        } else {
          setError("아이디를 입력해 주십시오.");
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center px-4 bg-gradient-to-br from-[#050811] via-[#091122] to-[#04060d]">
          <div className="w-full max-w-md p-8 rounded-3xl bg-[#0c1427]/90 border border-slate-800 shadow-2xl backdrop-blur-xl relative overflow-hidden">
            <div className="absolute -top-24 -right-24 w-48 h-48 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
            
            <div className="text-center mb-8">
              <span className="inline-flex items-center px-3 py-1 rounded-full text-xs font-black tracking-widest bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 mb-3">
                INTEGRATED OPS COMMAND
              </span>
              <h1 className="text-2xl font-black tracking-tight text-white">DC운용3팀 통합 관제</h1>
              <p className="text-xs text-slate-400 mt-1">일산 · 식사 · 양주 센터 및 교대 통합 포털</p>
            </div>

            <form onSubmit={handleLoginSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-300 mb-1.5">관제관 ID</label>
                <input
                  type="text"
                  value={id}
                  onChange={(e) => setId(e.target.value)}
                  placeholder="아이디를 입력하세요"
                  className="w-full bg-[#070c18] border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-300 mb-1.5">보안 인가 코드 (PW)</label>
                <input
                  type="password"
                  value={pw}
                  onChange={(e) => setPw(e.target.value)}
                  placeholder="보안 암호 (미입력 시 즉시 통과)"
                  className="w-full bg-[#070c18] border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
                />
              </div>

              {error && <p className="text-xs text-rose-400 font-medium">{error}</p>}

              <button
                type="submit"
                className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-sm rounded-xl shadow-lg shadow-indigo-600/30 transition duration-200 mt-2"
              >
                관제 대시보드 입장
              </button>
            </form>

            <div className="mt-6 text-center">
              <p className="text-[11px] text-slate-500">인프라 24/7/365 고가용성 보장 시스템</p>
            </div>
          </div>
        </div>
      );
    }

    // 2. 통합 관제 메인 대시보드
    function MainDashboard({ onLogout }) {
      const today = new Date();
      const [year, setYear] = useState(today.getFullYear());
      const [month, setMonth] = useState(today.getMonth() + 1);

      // 근무자 명단 (로컬스토리지 영구 보존)
      const [members, setMembers] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {
          console.error("Storage Load Fail", e);
        }
        return INITIAL_MEMBERS;
      });

      const [isManaging, setIsManaging] = useState(false);
      const [editNameInput, setEditNameInput] = useState("");

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(members));
        } catch (e) {
          console.error("Storage Save Fail", e);
        }
      }, [members]);

      // 월별 날짜 배열
      const daysInMonth = useMemo(() => {
        const days = [];
        const date = new Date(year, month - 1, 1);
        while (date.getMonth() === month - 1) {
          days.push(new Date(date));
          date.setDate(date.getDate() + 1);
        }
        return days;
      }, [year, month]);

      // 가변 인원수 맞춤형 당직 자동 편성 알고리즘
      const { schedule, summary } = useMemo(() => {
        const numMembers = members.length;
        const totalDays = daysInMonth.length;
        if (numMembers === 0) return { schedule: [], summary: [] };

        const sched = Array.from({ length: numMembers }, () => Array(totalDays).fill(''));
        let dayDutyPtr = (month * 3) % numMembers;
        let nightDutyPtr = (dayDutyPtr + 1) % numMembers;

        for (let d = 0; d < totalDays; d++) {
          const currentDay = daysInMonth[d];
          const isWeekend = (currentDay.getDay() === 0 || currentDay.getDay() === 6);

          if (d > 0 && sched[dayDutyPtr % numMembers][d - 1] === 'N') {
            dayDutyPtr++;
          }
          const dIdx = dayDutyPtr % numMembers;
          sched[dIdx][d] = 'D';
          dayDutyPtr++;

          while ((nightDutyPtr % numMembers) === dIdx) {
            nightDutyPtr++;
          }
          const nIdx = nightDutyPtr % numMembers;
          sched[nIdx][d] = 'N';
          nightDutyPtr++;

          if (d + 1 < totalDays) {
            sched[nIdx][d + 1] = 'B';
          }

          for (let m = 0; m < numMembers; m++) {
            if (!sched[m][d]) {
              sched[m][d] = isWeekend ? 'O' : 'W';
            }
          }
        }

        const stats = members.map((name, idx) => {
          let dayCount = 0, nightCount = 0, weekendDuty = 0, regularWork = 0, offCount = 0;
          sched[idx].forEach((duty, dIdx) => {
            const isWeekend = (daysInMonth[dIdx].getDay() === 0 || daysInMonth[dIdx].getDay() === 6);
            if (duty === 'D') { dayCount++; if (isWeekend) weekendDuty++; }
            else if (duty === 'N') { nightCount++; if (isWeekend) weekendDuty++; }
            else if (duty === 'W') { regularWork++; }
            else if (duty === 'O' || duty === 'B') { offCount++; }
          });
          return { name, dayCount, nightCount, weekendDuty, regularWork, offCount };
        });

        return { schedule: sched, summary: stats };
      }, [members, daysInMonth, month]);

      // 오늘 투입 인원 식별
      const todayStatus = useMemo(() => {
        const todayDate = today.getDate();
        const dIdx = todayDate - 1;
        
        let dayWorker = "미지정";
        let nightWorker = "미지정";
        let restWorkers = [];
        let workWorkers = [];

        if (schedule.length > 0 && dIdx >= 0 && dIdx < daysInMonth.length) {
          members.forEach((name, mIdx) => {
            const duty = schedule[mIdx]?.[dIdx];
            if (duty === 'D') dayWorker = name;
            else if (duty === 'N') nightWorker = name;
            else if (duty === 'B') restWorkers.push(name);
            else if (duty === 'W') workWorkers.push(name);
          });
        }
        return { dayWorker, nightWorker, restWorkers, workWorkers, todayDate };
      }, [schedule, members, daysInMonth]);

      // 명단 수정 저장
      const handleSaveMembers = () => {
        const parsed = editNameInput.split(",").map(s => s.trim()).filter(Boolean);
        if (parsed.length < 3) {
          alert("주간/야간/비번 운영을 위해 최소 3명 이상의 인원이 필요합니다.");
          return;
        }
        setMembers(parsed);
        setIsManaging(false);
      };

      // CSV 다운로드
      const downloadCSV = () => {
        let csv = "성명," + daysInMonth.map(d => `${d.getMonth()+1}/${d.getDate()}`).join(",") + ",주간(D),야간(N),주말당직합,상근(W),휴무/비번\n";
        members.forEach((name, idx) => {
          const s = summary[idx];
          csv += `${name},` + schedule[idx].join(",") + `,${s.dayCount},${s.nightCount},${s.weekendDuty},${s.regularWork},${s.offCount}\n`;
        });
        const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `DC운용3팀_근무표_${year}년_${month}월.csv`;
        link.click();
      };

      const getDutyBadge = (duty) => {
        switch (duty) {
          case 'D': return 'bg-amber-400 text-slate-950 font-black shadow-md ring-1 ring-amber-300';
          case 'N': return 'bg-indigo-600 text-white font-black shadow-md ring-1 ring-indigo-400';
          case 'B': return 'bg-emerald-950/70 text-emerald-400 font-bold border border-emerald-500/50';
          case 'W': return 'bg-slate-800/80 text-slate-300 font-medium border border-slate-700/60';
          case 'O': return 'bg-[#0b101c] text-slate-600 font-normal border border-slate-900';
          default: return '';
        }
      };

      return (
        <div className="max-w-[1700px] mx-auto px-4 py-6">
          {/* 1. 최상단 네비게이션 헤더 */}
          <div className="mb-6 flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-slate-800">
            <div className="flex items-center gap-3">
              <div className="w-3 h-3 rounded-full bg-emerald-400 animate-ping"></div>
              <h1 className="text-2xl font-black text-white tracking-tight">DC운용3팀 통합 지휘 관제 센터</h1>
              <span className="text-xs px-2.5 py-0.5 rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 font-mono font-bold">
                LIVE OPS
              </span>
            </div>
            
            <div className="flex items-center gap-3">
              <span className="text-xs text-slate-400 font-mono">
                {today.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' })}
              </span>
              <button
                onClick={onLogout}
                className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-1.5 rounded-lg transition"
              >
                로그아웃
              </button>
            </div>
          </div>

          {/* 2. 상단 3개 센터 (일산, 식사, 양주) 날씨 및 외기 냉방 관제 카드 */}
          <section className="mb-6">
            <div className="flex items-center justify-between mb-3">
              <h2 className="text-sm font-bold text-slate-300 flex items-center gap-2">
                <span className="text-indigo-400">●</span> 3대 거점 센터 기상 및 인프라 외기 관제
              </h2>
              <span className="text-[11px] text-slate-500">외기 냉방(Free Cooling) 연동 권장</span>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {/* 일산 센터 */}
              <div className="p-4 rounded-2xl bg-gradient-to-br from-[#0c1427] to-[#0a0f1d] border border-slate-800/90 shadow-lg relative overflow-hidden">
                <div className="flex items-center justify-between">
                  <div>
                    <span className="text-xs font-bold text-indigo-400 bg-indigo-950/70 px-2 py-0.5 rounded border border-indigo-800">거점 1</span>
                    <h3 className="text-lg font-black text-white mt-1">일산 센터</h3>
                  </div>
                  <div className="text-2xl">🌤️</div>
                </div>
                <div className="mt-3 flex items-baseline gap-3">
                  <span className="text-3xl font-black text-white font-mono">21.5°C</span>
                  <span className="text-xs text-slate-400 font-mono">습도 52%</span>
                </div>
                <div className="mt-3 pt-2 border-t border-slate-800/80 flex items-center justify-between text-xs">
                  <span className="text-slate-400">외기 상태:</span>
                  <span className="text-emerald-400 font-bold">외기 도입 가동 적합</span>
                </div>
              </div>

              {/* 식사 센터 */}
              <div className="p-4 rounded-2xl bg-gradient-to-br from-[#0c1427] to-[#0a0f1d] border border-slate-800/90 shadow-lg relative overflow-hidden">
                <div className="flex items-center justify-between">
                  <div>
                    <span className="text-xs font-bold text-cyan-400 bg-cyan-950/70 px-2 py-0.5 rounded border border-cyan-800">거점 2</span>
                    <h3 className="text-lg font-black text-white mt-1">식사 센터</h3>
                  </div>
                  <div className="text-2xl">☀️</div>
                </div>
                <div className="mt-3 flex items-baseline gap-3">
                  <span className="text-3xl font-black text-white font-mono">22.1°C</span>
                  <span className="text-xs text-slate-400 font-mono">습도 49%</span>
                </div>
                <div className="mt-3 pt-2 border-t border-slate-800/80 flex items-center justify-between text-xs">
                  <span className="text-slate-400">외기 상태:</span>
                  <span className="text-emerald-400 font-bold">외기 도입 가동 적합</span>
                </div>
              </div>

              {/* 양주 센터 */}
              <div className="p-4 rounded-2xl bg-gradient-to-br from-[#0c1427] to-[#0a0f1d] border border-slate-800/90 shadow-lg relative overflow-hidden">
                <div className="flex items-center justify-between">
                  <div>
                    <span className="text-xs font-bold text-emerald-400 bg-emerald-950/70 px-2 py-0.5 rounded border border-emerald-800">거점 3</span>
                    <h3 className="text-lg font-black text-white mt-1">양주 센터</h3>
                  </div>
                  <div className="text-2xl">⛅</div>
                </div>
                <div className="mt-3 flex items-baseline gap-3">
                  <span className="text-3xl font-black text-white font-mono">19.8°C</span>
                  <span className="text-xs text-slate-400 font-mono">습도 56%</span>
                </div>
                <div className="mt-3 pt-2 border-t border-slate-800/80 flex items-center justify-between text-xs">
                  <span className="text-slate-400">외기 상태:</span>
                  <span className="text-emerald-400 font-bold">최적 냉각 구간 (절감 우수)</span>
                </div>
              </div>
            </div>
          </section>

          {/* 3. 데이터센터 전술 뉴스 브리핑 & 금일 작전 투입 대원 현황 (좌우 2분할) */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-6">
            {/* 데이터센터 관련 뉴스 */}
            <section className="lg:col-span-6 p-5 rounded-2xl bg-[#0a0f1d] border border-slate-800 shadow-xl flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between mb-3 pb-2 border-b border-slate-800/80">
                  <h2 className="text-sm font-bold text-slate-200 flex items-center gap-2">
                    <span className="text-amber-400">⚡</span> 금일 데이터센터 인프라 & 기술 브리핑
                  </h2>
                  <span className="text-[11px] text-slate-500 font-mono">DAILY REPORT</span>
                </div>
                <div className="space-y-3 text-xs">
                  <div className="p-2.5 rounded-xl bg-slate-900/60 border border-slate-800 hover:border-slate-700 transition cursor-pointer">
                    <span className="text-indigo-400 font-bold text-[11px]">[전력/냉각]</span>
                    <p className="font-semibold text-slate-200 mt-0.5">차세대 AI 데이터센터 액체 냉각(Direct-to-Chip) 도입 가속화 분석</p>
                    <p className="text-slate-500 text-[11px] mt-0.5">고집적 랙 발열 관리를 위한 PUE 1.15 달성 인프라 최적화 지침 발표</p>
                  </div>
                  <div className="p-2.5 rounded-xl bg-slate-900/60 border border-slate-800 hover:border-slate-700 transition cursor-pointer">
                    <span className="text-amber-400 font-bold text-[11px]">[전력 계통]</span>
                    <p className="font-semibold text-slate-200 mt-0.5">수도권 특고압 수전 용량 증설 및 비상 발전기 자동 절체(ATS) 무정전 점검</p>
                    <p className="text-slate-500 text-[11px] mt-0.5">환절기 한전 선로 안정성 점검에 따른 UPS 배터리 모니터링 강화 권고</p>
                  </div>
                  <div className="p-2.5 rounded-xl bg-slate-900/60 border border-slate-800 hover:border-slate-700 transition cursor-pointer">
                    <span className="text-emerald-400 font-bold text-[11px]">[보안/방재]</span>
                    <p className="font-semibold text-slate-200 mt-0.5">IDC 상주 인력 출입 통제 강화 및 소화 가스(IG-100) 방출 밸브 오작동 방지 훈련</p>
                    <p className="text-slate-500 text-[11px] mt-0.5">서버룸 내 정전기 방지 및 분진 제어 규정 준수 여부 정기 감사 시행</p>
                  </div>
                </div>
              </div>
            </section>

            {/* 금일(오늘) 주간/야간 투입 인원 현황 대시보드 */}
            <section className="lg:col-span-6 p-5 rounded-2xl bg-[#0a0f1d] border border-slate-800 shadow-xl flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between mb-3 pb-2 border-b border-slate-800/80">
                  <h2 className="text-sm font-bold text-slate-200 flex items-center gap-2">
                    <span className="text-rose-400">🛡️</span> 오늘 작전 투입 대원 현황 (오늘 {todayStatus.todayDate}일 기준)
                  </h2>
                  <span className="text-[11px] text-indigo-400 font-mono font-bold">14인 체제 운용</span>
                </div>

                <div className="grid grid-cols-2 gap-3 mb-3">
                  {/* 주간 당직자 */}
                  <div className="p-4 rounded-xl bg-amber-500/10 border border-amber-500/30">
                    <span className="text-xs font-black text-amber-400 flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full bg-amber-400"></span>
                      주간 당직 (08:00 ~ 19:00)
                    </span>
                    <p className="text-2xl font-black text-white mt-1.5">{todayStatus.dayWorker}</p>
                    <p className="text-[11px] text-amber-300/80 mt-1">주간 3대 센터 현장 점검 및 관제 총괄</p>
                  </div>

                  {/* 야간 당직자 */}
                  <div className="p-4 rounded-xl bg-indigo-500/10 border border-indigo-500/30">
                    <span className="text-xs font-black text-indigo-400 flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full bg-indigo-400"></span>
                      야간 당직 (19:00 ~ 익일 08:00)
                    </span>
                    <p className="text-2xl font-black text-white mt-1.5">{todayStatus.nightWorker}</p>
                    <p className="text-[11px] text-indigo-300/80 mt-1">심야 무중단 모니터링 및 비상 출동 대기</p>
                  </div>
                </div>

                <div className="space-y-2 text-xs">
                  <div className="p-2.5 rounded-lg bg-slate-900 border border-slate-800 flex items-center justify-between">
                    <span className="text-slate-400 font-medium">야간 비번 대원 (퇴근 회복):</span>
                    <span className="text-emerald-400 font-bold">{todayStatus.restWorkers.join(", ") || "해당 없음"}</span>
                  </div>
                  <div className="p-2.5 rounded-lg bg-slate-900 border border-slate-800 flex items-center justify-between">
                    <span className="text-slate-400 font-medium">평일 상근 대원 (09:00 ~ 18:00):</span>
                    <span className="text-slate-200 font-semibold">{todayStatus.workWorkers.length}명 가용 근무 중</span>
                  </div>
                </div>
              </div>
            </section>
          </div>

          {/* 4. 전체 DC운용3팀 근무표 섹션 */}
          <section className="mb-6 p-6 rounded-3xl bg-[#090f1d] border border-slate-800 shadow-2xl">
            <div className="flex flex-wrap items-center justify-between gap-4 mb-4 pb-4 border-b border-slate-800">
              <div>
                <h2 className="text-xl font-black text-white tracking-tight flex items-center gap-2">
                  <span className="text-indigo-500">📅</span> DC운용3팀 월간 전체 종합 근무표
                </h2>
                <p className="text-xs text-slate-400 mt-0.5">
                  14인 2교대 자동 최적화 · 브라우저 자동 영구 보존 · CSV 엑셀 연동
                </p>
              </div>

              <div className="flex items-center flex-wrap gap-3">
                <div className="flex items-center bg-slate-950 border border-slate-700 rounded-xl px-2 py-1">
                  <select 
                    value={year} 
                    onChange={(e) => setYear(Number(e.target.value))}
                    className="bg-transparent text-slate-300 font-bold text-xs px-2 py-1.5 focus:outline-none cursor-pointer"
                  >
                    <option value={2026} className="bg-slate-900">2026년</option>
                    <option value={2027} className="bg-slate-900">2027년</option>
                  </select>
                  <div className="w-[1px] h-3.5 bg-slate-700 mx-1"></div>
                  <select 
                    value={month} 
                    onChange={(e) => setMonth(Number(e.target.value))}
                    className="bg-transparent text-indigo-400 font-extrabold text-xs px-2 py-1.5 focus:outline-none cursor-pointer"
                  >
                    {[...Array(12)].map((_, i) => (
                      <option key={i+1} value={i+1} className="bg-slate-900">{i+1}월</option>
                    ))}
                  </select>
                </div>

                <button 
                  onClick={() => { setEditNameInput(members.join(", ")); setIsManaging(!isManaging); }}
                  className="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-xs font-semibold transition"
                >
                  근무자 명단/정원 수정
                </button>

                <button 
                  onClick={downloadCSV}
                  className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-indigo-600/30 transition flex items-center gap-1.5"
                >
                  엑셀(CSV) 다운로드
                </button>
              </div>
            </div>

            {/* 인원 수정 패널 */}
            {isManaging && (
              <div className="mb-6 p-5 rounded-2xl bg-[#0c1427] border-2 border-indigo-500/40 shadow-xl">
                <h3 className="text-xs font-bold text-white mb-2">대원 명단 수정 (쉼표로 구분, 자유로운 증감 가능)</h3>
                <textarea
                  rows="2"
                  value={editNameInput}
                  onChange={(e) => setEditNameInput(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono"
                />
                <div className="flex justify-end gap-2 mt-3">
                  <button onClick={() => setIsManaging(false)} className="px-3 py-1.5 bg-slate-800 text-xs rounded-lg text-slate-300">취소</button>
                  <button onClick={handleSaveMembers} className="px-4 py-1.5 bg-indigo-600 text-xs font-bold rounded-lg text-white">저장 및 즉시 반영</button>
                </div>
              </div>
            )}

            {/* 근무 뱃지 안내 */}
            <div className="mb-4 flex flex-wrap items-center gap-3 text-xs">
              <span className="text-slate-400 font-bold">근무 코드:</span>
              <span className="px-2 py-0.5 rounded bg-amber-400 text-slate-950 font-black">D : 주간 당직 (08~19) 1명</span>
              <span className="px-2 py-0.5 rounded bg-indigo-600 text-white font-black">N : 야간 당직 (19~08) 1명</span>
              <span className="px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 font-bold border border-emerald-500/50">B : 야간 비번</span>
              <span className="px-2 py-0.5 rounded bg-slate-800 text-slate-300 font-medium">W : 평일 상근 (09~18)</span>
              <span className="px-2 py-0.5 rounded bg-[#0b101c] text-slate-500 border border-slate-800">O : 주말 휴무</span>
            </div>

            {/* 메인 테이블 */}
            <div className="overflow-x-auto bg-[#070c18] border border-slate-800 rounded-2xl shadow-inner">
              <table className="w-full text-center border-collapse">
                <thead>
                  <tr className="border-b border-slate-800 bg-[#060a14] text-slate-400 text-xs">
                    <th className="py-3 px-3 sticky left-0 bg-[#060a14] z-30 font-black text-slate-200 min-w-[85px] border-r border-slate-800">
                      성명
                    </th>
                    {daysInMonth.map((d, i) => {
                      const isSun = d.getDay() === 0;
                      const isSat = d.getDay() === 6;
                      const isToday = d.getDate() === todayStatus.todayDate && (month === today.getMonth() + 1);
                      return (
                        <th 
                          key={i} 
                          className={`py-2 px-1 min-w-[32px] border-r border-slate-800/40 ${
                            isToday ? 'bg-indigo-500/20 text-white ring-1 ring-indigo-500' :
                            isSun ? 'bg-rose-500/10 text-rose-400' :
                            isSat ? 'bg-indigo-500/10 text-indigo-400' : 'text-slate-400'
                          }`}
                        >
                          <div className="text-xs font-bold leading-none">{d.getDate()}</div>
                          <div className="text-[9px] mt-0.5 opacity-80">{['일','월','화','수','목','금','토'][d.getDay()]}</div>
                        </th>
                      );
                    })}
                    <th className="py-2.5 px-2 text-amber-400 bg-amber-950/20 font-black min-w-[50px]">주간(D)</th>
                    <th className="py-2.5 px-2 text-indigo-400 bg-indigo-950/20 font-black min-w-[50px]">야간(N)</th>
                    <th className="py-2.5 px-2 text-rose-400 bg-rose-950/20 font-black min-w-[55px]">주말당직</th>
                    <th className="py-2.5 px-2 text-slate-300 bg-slate-900/60 font-medium min-w-[50px]">상근(W)</th>
                    <th className="py-2.5 px-2 text-emerald-400 bg-emerald-950/20 font-medium min-w-[55px]">휴무/비번</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/60 text-xs font-mono">
                  {members.map((name, mIdx) => {
                    const s = summary[mIdx] || {};
                    return (
                      <tr key={mIdx} className="hover:bg-slate-800/30 transition">
                        <td className="py-2.5 px-3 font-bold text-slate-200 sticky left-0 bg-[#080e1b] z-20 whitespace-nowrap border-r border-slate-800 text-left pl-3.5">
                          {name}
                        </td>
                        {schedule[mIdx] && schedule[mIdx].map((duty, dIdx) => (
                          <td key={dIdx} className="p-0.5 border-r border-slate-800/30">
                            <div className={`h-7 w-7 mx-auto flex items-center justify-center rounded-lg transition-transform hover:scale-110 ${getDutyBadge(duty)}`}>
                              {duty}
                            </div>
                          </td>
                        ))}
                        <td className="py-2 px-1 font-black text-amber-400 bg-amber-950/10">{s.dayCount}회</td>
                        <td className="py-2 px-1 font-black text-indigo-400 bg-indigo-950/10">{s.nightCount}회</td>
                        <td className="py-2 px-1 font-black text-rose-400 bg-rose-950/10">{s.weekendDuty}회</td>
                        <td className="py-2 px-1 font-medium text-slate-300 bg-slate-900/30">{s.regularWork}일</td>
                        <td className="py-2 px-1 font-semibold text-emerald-400 bg-emerald-950/10">{s.offCount}일</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </section>
        </div>
      );
    }

    // 최상위 엔트리 포인트 컴포넌트
    function Root() {
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        return localStorage.getItem(AUTH_KEY) === "authenticated";
      });

      const handleLogin = () => setIsAuthenticated(true);
      const handleLogout = () => {
        localStorage.removeItem(AUTH_KEY);
        setIsAuthenticated(false);
      };

      if (!isAuthenticated) {
        return <LoginScreen onLogin={handleLogin} />;
      }
      return <MainDashboard onLogout={handleLogout} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
