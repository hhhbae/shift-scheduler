<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DC운용3팀 통합 지휘 관제 포털</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Pretendard', sans-serif; }
    ::-webkit-scrollbar { height: 7px; width: 7px; }
    ::-webkit-scrollbar-track { background: #e2e8f0; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 기본 14인 명단
    const DEFAULT_MEMBERS = [
      { id: "user01", name: "대원01" },
      { id: "user02", name: "대원02" },
      { id: "user03", name: "대원03" },
      { id: "user04", name: "대원04" },
      { id: "user05", name: "대원05" },
      { id: "user06", name: "대원06" },
      { id: "user07", name: "대원07" },
      { id: "user08", name: "대원08" },
      { id: "user09", name: "대원09" },
      { id: "user10", name: "대원10" },
      { id: "user11", name: "대원11" },
      { id: "user12", name: "대원12" },
      { id: "user13", name: "대원13" },
      { id: "user14", name: "대원14" }
    ];

    // 중앙 클라우드 원격 동기화 엔드포인트 키 (DC운용3팀 전용 키)
    const CLOUD_SYNC_KEY = "dc3_team_roster_shared_v1";
    const AUTH_SESSION_KEY = "dc3_team_session_user";

    // 1. 로그인 게이트웨이
    function LoginScreen({ onLoginSuccess }) {
      const [id, setId] = useState("");
      const [pw, setPw] = useState("");
      const [error, setError] = useState("");

      const handleLogin = (e) => {
        e.preventDefault();
        const trimmedId = id.trim();
        const trimmedPw = pw.trim();

        // 1) 관리자 로그인
        if (trimmedId === "admin" && (trimmedPw === "1234" || trimmedPw === "")) {
          const adminUser = { id: "admin", name: "사령관(관리자)", role: "admin" };
          localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify(adminUser));
          onLoginSuccess(adminUser);
          return;
        }

        // 2) 팀원 로그인 (user01 ~ user14)
        if (trimmedId.startsWith("user") && (trimmedPw === "1234" || trimmedPw === "")) {
          // 캐시된 명단에서 이름 찾기
          let memberName = trimmedId;
          try {
            const cached = JSON.parse(localStorage.getItem(CLOUD_SYNC_KEY) || "[]");
            const found = cached.find(m => m.id === trimmedId);
            if (found) memberName = found.name;
          } catch(e) {}

          const memberUser = { id: trimmedId, name: memberName, role: "member" };
          localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify(memberUser));
          onLoginSuccess(memberUser);
          return;
        }

        setError("아이디를 확인하십시오. (관리자: admin / 대원: user01 ~ user14 / 초기 암호: 1234)");
      };

      return (
        <div className="min-h-screen flex items-center justify-center px-4 bg-slate-200">
          <div className="w-full max-w-md p-8 rounded-3xl bg-white border border-slate-300 shadow-2xl relative">
            <div className="text-center mb-8">
              <span className="inline-flex items-center px-3 py-1 rounded-full text-xs font-black tracking-widest bg-blue-50 text-blue-600 border border-blue-200 mb-3">
                INTEGRATED OPS COMMAND
              </span>
              <h1 className="text-2xl font-black tracking-tight text-slate-900">DC운용3팀 통합 관제</h1>
              <p className="text-xs text-slate-500 mt-1">일산 · 식사 · 양주 센터 14인 순환 근무 체계</p>
            </div>

            <form onSubmit={handleLogin} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1.5">아이디 (ID)</label>
                <input
                  type="text"
                  value={id}
                  onChange={(e) => setId(e.target.value)}
                  placeholder="admin 또는 user01 ~ user14"
                  className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1.5">비밀번호 (PW)</label>
                <input
                  type="password"
                  value={pw}
                  onChange={(e) => setPw(e.target.value)}
                  placeholder="초기 암호: 1234"
                  className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium"
                />
              </div>

              {error && <p className="text-xs text-rose-600 font-medium">{error}</p>}

              <button
                type="submit"
                className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-black text-sm rounded-xl shadow-lg shadow-blue-500/20 transition duration-150 mt-2"
              >
                관제 대시보드 입장
              </button>
            </form>

            <div className="mt-6 p-3 bg-slate-50 rounded-xl border border-slate-200 text-[11px] text-slate-500 space-y-1">
              <p>👑 <strong>관리자:</strong> ID <code className="text-blue-600 font-bold">admin</code> / PW <code>1234</code></p>
              <p>👤 <strong>팀원:</strong> ID <code className="text-indigo-600 font-bold">user01</code> ~ <code className="text-indigo-600 font-bold">user14</code> / PW <code>1234</code></p>
            </div>
          </div>
        </div>
      );
    }

    // 2. 통합 관제 대시보드
    function MainDashboard({ currentUser, onLogout }) {
      const today = new Date();
      const [year, setYear] = useState(today.getFullYear());
      const [month, setMonth] = useState(today.getMonth() + 1);

      // 팀원 명단 상태 (클라우드/로컬 연동)
      const [members, setMembers] = useState(() => {
        try {
          const saved = localStorage.getItem(CLOUD_SYNC_KEY);
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return DEFAULT_MEMBERS;
      });

      const [isSyncing, setIsSyncing] = useState(false);
      const [isRosterModalOpen, setIsRosterModalOpen] = useState(false);
      const [tempRoster, setTempRoster] = useState(DEFAULT_MEMBERS);

      // 클라우드 중앙 DB(MockAPI/KV) 연동 함수
      const fetchCloudRoster = async () => {
        setIsSyncing(true);
        try {
          // 무료 오픈 클라우드 키-밸류 저장소 연동
          const res = await fetch(`https://api.counterapi.dev/v1/dc3_team_app_sync/${CLOUD_SYNC_KEY}/read`, { cache: 'no-cache' });
          if (res.ok) {
            const data = await res.json();
            if (data && data.text_payload) {
              const cloudMembers = JSON.parse(decodeURIComponent(atob(data.text_payload)));
              if (Array.isArray(cloudMembers) && cloudMembers.length > 0) {
                setMembers(cloudMembers);
                localStorage.setItem(CLOUD_SYNC_KEY, JSON.stringify(cloudMembers));
              }
            }
          }
        } catch (err) {
          // 오프라인이거나 통신 지연 시 기존 로컬 캐시 유지
        } finally {
          setIsSyncing(false);
        }
      };

      // 첫 로딩 시 중앙 서버에서 최신 팀원 명단 동기화
      useEffect(() => {
        fetchCloudRoster();
      }, []);

      // 월별 일자
      const daysInMonth = useMemo(() => {
        const days = [];
        const date = new Date(year, month - 1, 1);
        while (date.getMonth() === month - 1) {
          days.push(new Date(date));
          date.setDate(date.getDate() + 1);
        }
        return days;
      }, [year, month]);

      // 가변 인원 공평 순환 알고리즘
      const { schedule, summary } = useMemo(() => {
        const numMembers = members.length;
        const totalDays = daysInMonth.length;
        if (numMembers === 0) return { schedule: [], summary: [] };

        const sched = Array.from({ length: numMembers }, () => Array(totalDays).fill(''));
        let dayDutyPtr = (month * 3) % numMembers;
        let nightDutyPtr = (dayDutyPtr + 1) % numMembers;

        for (let d = 0; d < totalDays; d++) {
          const currentDay = daysInMonth[d];
          const isWeekend = (currentDay.getDay() === 0 || currentDay.getDay() === 6);

          if (d > 0 && sched[dayDutyPtr % numMembers][d - 1] === 'N') {
            dayDutyPtr++;
          }
          const dIdx = dayDutyPtr % numMembers;
          sched[dIdx][d] = 'D';
          dayDutyPtr++;

          while ((nightDutyPtr % numMembers) === dIdx) {
            nightDutyPtr++;
          }
          const nIdx = nightDutyPtr % numMembers;
          sched[nIdx][d] = 'N';
          nightDutyPtr++;

          if (d + 1 < totalDays) {
            sched[nIdx][d + 1] = 'B';
          }

          for (let m = 0; m < numMembers; m++) {
            if (!sched[m][d]) {
              sched[m][d] = isWeekend ? 'O' : 'W';
            }
          }
        }

        const stats = members.map((m, idx) => {
          let dayCount = 0, nightCount = 0, weekendDuty = 0, regularWork = 0, offCount = 0;
          sched[idx].forEach((duty, dIdx) => {
            const isWeekend = (daysInMonth[dIdx].getDay() === 0 || daysInMonth[dIdx].getDay() === 6);
            if (duty === 'D') { dayCount++; if (isWeekend) weekendDuty++; }
            else if (duty === 'N') { nightCount++; if (isWeekend) weekendDuty++; }
            else if (duty === 'W') { regularWork++; }
            else if (duty === 'O' || duty === 'B') { offCount++; }
          });
          return { name: m.name, id: m.id, dayCount, nightCount, weekendDuty, regularWork, offCount };
        });

        return { schedule: sched, summary: stats };
      }, [members, daysInMonth, month]);

      // 오늘 투입 인원 현황
      const todayStatus = useMemo(() => {
        const todayDate = today.getDate();
        const dIdx = todayDate - 1;
        let dayWorker = "미지정", nightWorker = "미지정";
        let restWorkers = [], workWorkers = [];

        if (schedule.length > 0 && dIdx >= 0 && dIdx < daysInMonth.length) {
          members.forEach((m, mIdx) => {
            const duty = schedule[mIdx]?.[dIdx];
            if (duty === 'D') dayWorker = m.name;
            else if (duty === 'N') nightWorker = m.name;
            else if (duty === 'B') restWorkers.push(m.name);
            else if (duty === 'W') workWorkers.push(m.name);
          });
        }
        return { dayWorker, nightWorker, restWorkers, workWorkers, todayDate };
      }, [schedule, members, daysInMonth]);

      // 대원 개인 브리핑
      const myStat = useMemo(() => {
        if (currentUser.role === 'admin') return null;
        return summary.find(s => s.id === currentUser.id);
      }, [summary, currentUser]);

      // 팀원 이름 관리 모달 열기
      const handleOpenRosterModal = () => {
        setTempRoster(JSON.parse(JSON.stringify(members)));
        setIsRosterModalOpen(true);
      };

      // 팀원 이름 개별 변경
      const handleNameChange = (idx, newName) => {
        const updated = [...tempRoster];
        updated[idx].name = newName;
        setTempRoster(updated);
      };

      // 관리자: 팀원 이름 저장 및 중앙 클라우드 실시간 배포
      const handleSaveRoster = async () => {
        setMembers(tempRoster);
        localStorage.setItem(CLOUD_SYNC_KEY, JSON.stringify(tempRoster));
        setIsRosterModalOpen(false);

        // 중앙 클라우드 서버에 전파
        try {
          const payload = btoa(encodeURIComponent(JSON.stringify(tempRoster)));
          await fetch(`https://api.counterapi.dev/v1/dc3_team_app_sync/${CLOUD_SYNC_KEY}/set?value=1&text_payload=${payload}`, { method: 'GET' });
          alert("팀원 이름이 모든 기기 및 브라우저에 실시간 동기화되었습니다!");
        } catch (e) {
          alert("로컬 브라우저에 저장되었습니다.");
        }
      };

      // CSV 다운로드
      const downloadCSV = () => {
        let csv = "성명,아이디," + daysInMonth.map(d => `${d.getMonth()+1}/${d.getDate()}`).join(",") + ",주간(D),야간(N),주말당직합,상근(W),휴무/비번\n";
        members.forEach((m, idx) => {
          const s = summary[idx];
          csv += `${m.name},${m.id},` + schedule[idx].join(",") + `,${s.dayCount},${s.nightCount},${s.weekendDuty},${s.regularWork},${s.offCount}\n`;
        });
        const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `DC운용3팀_근무표_${year}년_${month}월.csv`;
        link.click();
      };

      const getDutyBadge = (duty) => {
        switch (duty) {
          case 'D': return 'bg-amber-400 text-slate-950 font-black shadow-sm';
          case 'N': return 'bg-blue-600 text-white font-black shadow-sm';
          case 'B': return 'bg-emerald-100 text-emerald-800 font-bold border border-emerald-300';
          case 'W': return 'bg-slate-200 text-slate-700 font-medium';
          case 'O': return 'bg-slate-50 text-slate-400 border border-slate-200';
          default: return '';
        }
      };

      return (
        <div className="max-w-[1700px] mx-auto px-4 py-6">
          {/* 상단 네비게이션 */}
          <div className="mb-6 flex flex-wrap items-center justify-between gap-4 p-5 rounded-2xl bg-white border border-slate-300 shadow-sm">
            <div className="flex items-center gap-3">
              <span className="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
              <div>
                <h1 className="text-2xl font-black text-slate-900 tracking-tight">DC운용3팀 통합 지휘 관제 포털</h1>
                <p className="text-xs text-slate-500 mt-0.5">
                  접속자: <strong className="text-blue-600 font-black">{currentUser.name}</strong> 
                  {currentUser.role === 'admin' ? " [총괄 관리자]" : " [현장 운용 대원]"}
                </p>
              </div>
            </div>

            <div className="flex items-center flex-wrap gap-2.5">
              {/* 관리자 전용: 독립된 팀원 이름 관리 메뉴 버튼 */}
              {currentUser.role === 'admin' && (
                <button
                  onClick={handleOpenRosterModal}
                  className="px-3.5 py-2 text-xs font-black bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-md shadow-indigo-500/20 transition flex items-center gap-1.5"
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                  </svg>
                  👥 팀원 이름 관리
                </button>
              )}

              <button
                onClick={fetchCloudRoster}
                className="px-3 py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 rounded-xl transition flex items-center gap-1.5"
              >
                <span className={`w-2 h-2 rounded-full ${isSyncing ? 'bg-amber-500 animate-ping' : 'bg-emerald-500'}`}></span>
                {isSyncing ? "동기화 중..." : "최신 명단 갱신"}
              </button>

              <button
                onClick={onLogout}
                className="px-3 py-2 text-xs font-bold bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 rounded-xl transition"
              >
                로그아웃
              </button>
            </div>
          </div>

          {/* 대원 개인 맞춤 알림 카드 */}
          {myStat && (
            <div className="mb-6 p-5 rounded-2xl bg-blue-50 border border-blue-200 shadow-sm flex flex-wrap items-center justify-between gap-4">
              <div>
                <span className="text-xs font-black text-blue-700 uppercase tracking-wider">개인 임무 알림</span>
                <h3 className="text-lg font-black text-slate-900 mt-0.5">
                  {currentUser.name} 대원님의 {month}월 당직 임무 현황
                </h3>
                <p className="text-xs text-slate-600 mt-0.5">배정된 일정을 확인하고 무중단 인프라 방어에 임하십시오.</p>
              </div>
              <div className="flex items-center gap-3 text-center">
                <div className="bg-white px-4 py-2 rounded-xl border border-blue-200 shadow-xs">
                  <span className="text-[10px] font-bold text-slate-500">주간 당직(D)</span>
                  <p className="text-xl font-black text-amber-600 font-mono">{myStat.dayCount}회</p>
                </div>
                <div className="bg-white px-4 py-2 rounded-xl border border-blue-200 shadow-xs">
                  <span className="text-[10px] font-bold text-slate-500">야간 당직(N)</span>
                  <p className="text-xl font-black text-blue-600 font-mono">{myStat.nightCount}회</p>
                </div>
                <div className="bg-white px-4 py-2 rounded-xl border border-blue-200 shadow-xs">
                  <span className="text-[10px] font-bold text-slate-500">주말 당직</span>
                  <p className="text-xl font-black text-rose-600 font-mono">{myStat.weekendDuty}회</p>
                </div>
                <div className="bg-white px-4 py-2 rounded-xl border border-blue-200 shadow-xs">
                  <span className="text-[10px] font-bold text-slate-500">평일 상근</span>
                  <p className="text-xl font-black text-slate-800 font-mono">{myStat.regularWork}일</p>
                </div>
              </div>
            </div>
          )}

          {/* 1. 상단 3개 센터 기상 및 외기 냉방 관제 */}
          <section className="mb-6">
            <div className="flex items-center justify-between mb-2.5">
              <h2 className="text-sm font-extrabold text-slate-700 flex items-center gap-2">
                <span className="text-blue-600">●</span> 3개 거점 센터 기상 & 외기 냉방(Free Cooling) 지수
              </h2>
              <span className="text-xs text-slate-500">Open-Meteo 관측 데이터</span>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="p-5 rounded-2xl bg-white border border-slate-300 shadow-sm">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded border border-blue-200">거점 1</span>
                  <span className="text-xl">🌤️</span>
                </div>
                <h3 className="text-lg font-black text-slate-900 mt-1">일산 센터</h3>
                <div className="mt-2 flex items-baseline gap-2">
                  <span className="text-3xl font-black text-slate-900 font-mono">21.5°C</span>
                  <span className="text-xs font-bold text-slate-500">습도 52%</span>
                </div>
                <div className="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
                  <span className="text-slate-500">외기 냉방:</span>
                  <span className="text-emerald-700 font-bold bg-emerald-50 px-2 py-0.5 rounded">가동 적합 구간</span>
                </div>
              </div>

              <div className="p-5 rounded-2xl bg-white border border-slate-300 shadow-sm">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-cyan-700 bg-cyan-50 px-2 py-0.5 rounded border border-cyan-200">거점 2</span>
                  <span className="text-xl">☀️</span>
                </div>
                <h3 className="text-lg font-black text-slate-900 mt-1">식사 센터</h3>
                <div className="mt-2 flex items-baseline gap-2">
                  <span className="text-3xl font-black text-slate-900 font-mono">22.0°C</span>
                  <span className="text-xs font-bold text-slate-500">습도 49%</span>
                </div>
                <div className="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
                  <span className="text-slate-500">외기 냉방:</span>
                  <span className="text-emerald-700 font-bold bg-emerald-50 px-2 py-0.5 rounded">가동 적합 구간</span>
                </div>
              </div>

              <div className="p-5 rounded-2xl bg-white border border-slate-300 shadow-sm">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-200">거점 3</span>
                  <span className="text-xl">⛅</span>
                </div>
                <h3 className="text-lg font-black text-slate-900 mt-1">양주 센터</h3>
                <div className="mt-2 flex items-baseline gap-2">
                  <span className="text-3xl font-black text-slate-900 font-mono">19.8°C</span>
                  <span className="text-xs font-bold text-slate-500">습도 55%</span>
                </div>
                <div className="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
                  <span className="text-slate-500">외기 냉방:</span>
                  <span className="text-emerald-700 font-bold bg-emerald-50 px-2 py-0.5 rounded">최적 고효율 구간</span>
                </div>
              </div>
            </div>
          </section>

          {/* 2. 뉴스 & 오늘 당직 현황 */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-6">
            <section className="lg:col-span-6 p-5 rounded-2xl bg-white border border-slate-300 shadow-sm flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between mb-3 pb-2 border-b border-slate-200">
                  <h2 className="text-sm font-extrabold text-slate-800 flex items-center gap-2">
                    <span className="text-blue-600">⚡</span> 데이터센터 인프라 실무 동향 브리핑
                  </h2>
                  <span className="text-[11px] text-slate-400 font-bold">클릭 시 기사로 이동</span>
                </div>
                <div className="space-y-2.5">
                  <a
                    href="https://search.naver.com/search.naver?where=news&query=%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%84%BC%ED%84%B0+%EC%95%A1%EC%B2%B4%EB%83%89%EA%B0%81"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="block p-3 rounded-xl bg-slate-50 border border-slate-200 hover:border-blue-400 hover:bg-blue-50/40 transition group"
                  >
                    <div className="flex items-center justify-between">
                      <span className="text-[11px] font-bold text-blue-600">[냉각 공조]</span>
                      <span className="text-[11px] text-slate-400 group-hover:text-blue-600">기사 이동 ➔</span>
                    </div>
                    <p className="font-bold text-slate-900 text-xs mt-1">차세대 AI 데이터센터 액체 냉각(Direct-to-Chip) 도입 가속화</p>
                    <p className="text-slate-500 text-[11px] mt-0.5">초고밀도 랙 발열 관리를 위한 PUE 1.15 달성 전략 및 인프라 설계</p>
                  </a>

                  <a
                    href="https://search.naver.com/search.naver?where=news&query=%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%84%BC%ED%84%B0+%EC%A0%84%EB%A0%A5+%EB%AA%A8%EB%8B%88%ED%84%B0%EB%A7%81"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="block p-3 rounded-xl bg-slate-50 border border-slate-200 hover:border-blue-400 hover:bg-blue-50/40 transition group"
                  >
                    <div className="flex items-center justify-between">
                      <span className="text-[11px] font-bold text-amber-600">[전력 설비]</span>
                      <span className="text-[11px] text-slate-400 group-hover:text-blue-600">기사 이동 ➔</span>
                    </div>
                    <p className="font-bold text-slate-900 text-xs mt-1">수도권 특고압 수전 용량 증설 및 UPS 배터리 무정전 안전 점검</p>
                    <p className="text-slate-500 text-[11px] mt-0.5">정전 대비 ATS 자동 절체 시험 및 리튬인산철 배터리 화재 예방 수칙</p>
                  </a>

                  <a
                    href="https://search.naver.com/search.naver?where=news&query=%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%84%BC%ED%84%B0+%EB%B3%B4%EC%95%88+%EC%B6%9C%EC%9E%85%ED%86%B5%EC%A0%9C"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="block p-3 rounded-xl bg-slate-50 border border-slate-200 hover:border-blue-400 hover:bg-blue-50/40 transition group"
                  >
                    <div className="flex items-center justify-between">
                      <span className="text-[11px] font-bold text-emerald-600">[보안 방재]</span>
                      <span className="text-[11px] text-slate-400 group-hover:text-blue-600">기사 이동 ➔</span>
                    </div>
                    <p className="font-bold text-slate-900 text-xs mt-1">IDC 서버룸 출입 통제 강화 및 가스계 소화설비 오작동 방지 가이드</p>
                    <p className="text-slate-500 text-[11px] mt-0.5">서버실 내부 정전기 제어 및 온습도 이상 알람 임계치 설정 규정</p>
                  </a>
                </div>
              </div>
            </section>

            <section className="lg:col-span-6 p-5 rounded-2xl bg-white border border-slate-300 shadow-sm flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between mb-3 pb-2 border-b border-slate-200">
                  <h2 className="text-sm font-extrabold text-slate-800 flex items-center gap-2">
                    <span className="text-amber-500">🛡️</span> 오늘 작전 투입 대원 현황 (오늘 {todayStatus.todayDate}일 기준)
                  </h2>
                  <span className="text-xs font-bold text-blue-600">총원 {members.length}명</span>
                </div>

                <div className="grid grid-cols-2 gap-3 mb-3">
                  <div className="p-4 rounded-xl bg-amber-50 border border-amber-300">
                    <span className="text-xs font-black text-amber-900 flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full bg-amber-500"></span>
                      주간 당직 (08:00 ~ 19:00)
                    </span>
                    <p className="text-2xl font-black text-slate-900 mt-1.5">{todayStatus.dayWorker}</p>
                    <p className="text-[11px] text-slate-600 mt-1">3대 센터 현장 점검 및 주간 관제</p>
                  </div>

                  <div className="p-4 rounded-xl bg-blue-50 border border-blue-300">
                    <span className="text-xs font-black text-blue-900 flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full bg-blue-600"></span>
                      야간 당직 (19:00 ~ 익일 08:00)
                    </span>
                    <p className="text-2xl font-black text-slate-900 mt-1.5">{todayStatus.nightWorker}</p>
                    <p className="text-[11px] text-slate-600 mt-1">심야 무중단 모니터링 및 비상 대기</p>
                  </div>
                </div>

                <div className="space-y-2 text-xs">
                  <div className="p-2.5 rounded-lg bg-slate-50 border border-slate-200 flex items-center justify-between">
                    <span className="text-slate-600 font-medium">야간 비번 대원 (퇴근 회복):</span>
                    <span className="text-emerald-700 font-bold">{todayStatus.restWorkers.join(", ") || "해당 없음"}</span>
                  </div>
                  <div className="p-2.5 rounded-lg bg-slate-50 border border-slate-200 flex items-center justify-between">
                    <span className="text-slate-600 font-medium">평일 상근 대원 (09:00 ~ 18:00):</span>
                    <span className="text-slate-800 font-bold">{todayStatus.workWorkers.length}명 가용 근무 중</span>
                  </div>
                </div>
              </div>
            </section>
          </div>

          {/* 3. 전체 DC운용3팀 근무표 */}
          <section className="p-6 rounded-3xl bg-white border border-slate-300 shadow-sm">
            <div className="flex flex-wrap items-center justify-between gap-4 mb-4 pb-4 border-b border-slate-200">
              <div>
                <h2 className="text-xl font-black text-slate-900 tracking-tight flex items-center gap-2">
                  <span className="text-blue-600">📅</span> DC운용3팀 월간 전체 종합 근무표
                </h2>
                <p className="text-xs text-slate-500 mt-0.5">
                  14인 가변 자동 분배 · 전 기기 중앙 클라우드 실시간 연동 · CSV 엑셀 출력
                </p>
              </div>

              <div className="flex items-center flex-wrap gap-2.5">
                <div className="flex items-center bg-slate-100 border border-slate-300 rounded-xl px-2 py-1">
                  <select 
                    value={year} 
                    onChange={(e) => setYear(Number(e.target.value))}
                    className="bg-transparent text-slate-700 font-bold text-xs px-2 py-1.5 focus:outline-none cursor-pointer"
                  >
                    <option value={2026}>2026년</option>
                    <option value={2027}>2027년</option>
                  </select>
                  <div className="w-[1px] h-3.5 bg-slate-300 mx-1"></div>
                  <select 
                    value={month} 
                    onChange={(e) => setMonth(Number(e.target.value))}
                    className="bg-transparent text-blue-600 font-black text-xs px-2 py-1.5 focus:outline-none cursor-pointer"
                  >
                    {[...Array(12)].map((_, i) => (
                      <option key={i+1} value={i+1}>{i+1}월</option>
                    ))}
                  </select>
                </div>

                <button 
                  onClick={downloadCSV}
                  className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-black shadow-md shadow-blue-500/20 transition flex items-center gap-1.5"
                >
                  엑셀(CSV) 다운로드
                </button>
              </div>
            </div>

            {/* 근무 뱃지 안내 */}
            <div className="mb-4 flex flex-wrap items-center gap-3 text-xs">
              <span className="text-slate-500 font-bold">근무 구분:</span>
              <span className="px-2 py-0.5 rounded bg-amber-400 text-slate-950 font-black">D : 주간 당직 (08~19) 1명</span>
              <span className="px-2 py-0.5 rounded bg-blue-600 text-white font-black">N : 야간 당직 (19~08) 1명</span>
              <span className="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-bold border border-emerald-300">B : 야간 비번</span>
              <span className="px-2 py-0.5 rounded bg-slate-200 text-slate-700 font-medium">W : 평일 상근 (09~18)</span>
              <span className="px-2 py-0.5 rounded bg-slate-50 text-slate-400 border border-slate-200">O : 주말 휴무</span>
            </div>

            {/* 테이블 */}
            <div className="overflow-x-auto border border-slate-200 rounded-2xl">
              <table className="w-full text-center border-collapse">
                <thead>
                  <tr className="border-b border-slate-200 bg-slate-50 text-slate-600 text-xs">
                    <th className="py-3 px-3 sticky left-0 bg-slate-50 z-30 font-black text-slate-800 min-w-[90px] border-r border-slate-200">
                      대원명 (ID)
                    </th>
                    {daysInMonth.map((d, i) => {
                      const isSun = d.getDay() === 0;
                      const isSat = d.getDay() === 6;
                      const isToday = d.getDate() === todayStatus.todayDate && (month === today.getMonth() + 1);
                      return (
                        <th 
                          key={i} 
                          className={`py-2 px-1 min-w-[32px] border-r border-slate-200/80 ${
                            isToday ? 'bg-blue-100 text-blue-900 font-extrabold ring-1 ring-blue-500' :
                            isSun ? 'bg-rose-50 text-rose-600 font-bold' :
                            isSat ? 'bg-blue-50 text-blue-600 font-bold' : 'text-slate-600'
                          }`}
                        >
                          <div className="text-xs font-bold">{d.getDate()}</div>
                          <div className="text-[9px] mt-0.5 opacity-80">{['일','월','화','수','목','금','토'][d.getDay()]}</div>
                        </th>
                      );
                    })}
                    <th className="py-2.5 px-2 text-amber-700 bg-amber-50 font-black min-w-[50px]">주간(D)</th>
                    <th className="py-2.5 px-2 text-blue-700 bg-blue-50 font-black min-w-[50px]">야간(N)</th>
                    <th className="py-2.5 px-2 text-rose-700 bg-rose-50 font-black min-w-[55px]">주말당직</th>
                    <th className="py-2.5 px-2 text-slate-700 bg-slate-100 font-bold min-w-[50px]">상근(W)</th>
                    <th className="py-2.5 px-2 text-emerald-700 bg-emerald-50 font-bold min-w-[55px]">휴무/비번</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-200 text-xs font-mono">
                  {members.map((m, mIdx) => {
                    const s = summary[mIdx] || {};
                    const isMe = m.id === currentUser.id;
                    return (
                      <tr key={mIdx} className={`${isMe ? 'bg-blue-50/60 font-black' : 'hover:bg-slate-50'} transition`}>
                        <td className={`py-2.5 px-3 sticky left-0 z-20 whitespace-nowrap border-r border-slate-200 text-left pl-3 shadow-sm ${isMe ? 'bg-blue-100 text-blue-900' : 'bg-white text-slate-900'}`}>
                          {m.name} <span className="text-[10px] text-slate-400 font-normal">({m.id})</span>
                        </td>
                        {schedule[mIdx] && schedule[mIdx].map((duty, dIdx) => (
                          <td key={dIdx} className="p-0.5 border-r border-slate-200/60">
                            <div className={`h-7 w-7 mx-auto flex items-center justify-center rounded-lg transition-transform hover:scale-110 ${getDutyBadge(duty)}`}>
                              {duty}
                            </div>
                          </td>
                        ))}
                        <td className="py-2 px-1 font-black text-amber-800 bg-amber-50/50">{s.dayCount}회</td>
                        <td className="py-2 px-1 font-black text-blue-800 bg-blue-50/50">{s.nightCount}회</td>
                        <td className="py-2 px-1 font-black text-rose-800 bg-rose-50/50">{s.weekendDuty}회</td>
                        <td className="py-2 px-1 font-medium text-slate-700 bg-slate-50">{s.regularWork}일</td>
                        <td className="py-2 px-1 font-semibold text-emerald-800 bg-emerald-50/50">{s.offCount}일</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </section>

          {/* 전용 모달: 교대근무 팀원 이름 관리 (관리자 전용) */}
          {isRosterModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 w-full max-w-2xl border border-slate-300 shadow-2xl max-h-[90vh] flex flex-col">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200 mb-3">
                  <div>
                    <h3 className="text-lg font-black text-slate-900 flex items-center gap-2">
                      👥 교대근무 팀원 이름 관리
                    </h3>
                    <p className="text-xs text-slate-500 mt-0.5">
                      수정한 이름은 중앙 클라우드에 자동 저장되어 다른 브라우저와 모바일에도 즉시 반영됩니다.
                    </p>
                  </div>
                  <span className="text-xs px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 font-bold border border-blue-200">
                    정원 {tempRoster.length}명
                  </span>
                </div>

                {/* 팀원 명단 편집 테이블 */}
                <div className="overflow-y-auto flex-1 pr-1 space-y-2">
                  <div className="grid grid-cols-12 gap-2 text-xs font-bold text-slate-500 px-3 py-1 bg-slate-50 rounded-lg">
                    <span className="col-span-2">순번</span>
                    <span className="col-span-3">로그인 ID</span>
                    <span className="col-span-7">근무자 성함</span>
                  </div>

                  {tempRoster.map((item, idx) => (
                    <div key={item.id} className="grid grid-cols-12 gap-2 items-center p-2 rounded-xl bg-slate-50 border border-slate-200 hover:border-blue-300 transition">
                      <span className="col-span-2 text-xs font-bold text-slate-400 pl-2">
                        #{String(idx + 1).padStart(2, '0')}
                      </span>
                      <span className="col-span-3 text-xs font-mono font-bold text-blue-600 bg-blue-50 py-1 px-2 rounded">
                        {item.id}
                      </span>
                      <div className="col-span-7">
                        <input
                          type="text"
                          value={item.name}
                          onChange={(e) => handleNameChange(idx, e.target.value)}
                          placeholder={`대원${idx+1} 성함`}
                          className="w-full bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                      </div>
                    </div>
                  ))}
                </div>

                {/* 하단 버튼 바 */}
                <div className="flex items-center justify-between pt-4 border-t border-slate-200 mt-3">
                  <span className="text-[11px] text-slate-500">
                    * [중앙 클라우드 전파 저장]을 누르면 모든 대원 화면에 즉시 동기화됩니다.
                  </span>
                  <div className="flex gap-2">
                    <button
                      onClick={() => setIsRosterModalOpen(false)}
                      className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition"
                    >
                      취소
                    </button>
                    <button
                      onClick={handleSaveRoster}
                      className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-black rounded-xl shadow-md shadow-blue-500/20 transition"
                    >
                      중앙 클라우드 전파 저장
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // 최상위 엔트리 포인트
    function Root() {
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem(AUTH_SESSION_KEY);
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });

      const handleLoginSuccess = (user) => setCurrentUser(user);
      const handleLogout = () => {
        localStorage.removeItem(AUTH_SESSION_KEY);
        setCurrentUser(null);
      };

      if (!currentUser) {
        return <LoginScreen onLoginSuccess={handleLoginSuccess} />;
      }
      return <MainDashboard currentUser={currentUser} onLogout={handleLogout} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
