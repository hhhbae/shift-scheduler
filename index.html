<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>당직 및 교대 순환 관제 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5' }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap');
    body { font-family: 'Pretendard', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const DEFAULT_MEMBERS = [
      "대원01", "대원02", "대원03", "대원04", "대원05", 
      "대원06", "대원07", "대원08", "대원09", "대원10", 
      "대원11", "대원12", "대원13", "대원14"
    ];

    function ShiftApp() {
      const [year, setYear] = useState(2026);
      const [month, setMonth] = useState(10);
      const [members, setMembers] = useState(DEFAULT_MEMBERS);
      const [isEditing, setIsEditing] = useState(false);
      const [memberInput, setMemberInput] = useState(DEFAULT_MEMBERS.join(", "));

      // 선택된 월의 전체 일자 계산
      const daysInMonth = useMemo(() => {
        const days = [];
        const date = new Date(year, month - 1, 1);
        while (date.getMonth() === month - 1) {
          days.push(new Date(date));
          date.setDate(date.getDate() + 1);
        }
        return days;
      }, [year, month]);

      // 공평 당직 순환 분배 알고리즘
      const { schedule, summary } = useMemo(() => {
        const numMembers = members.length;
        const totalDays = daysInMonth.length;
        
        // 초기화
        const sched = Array.from({ length: numMembers }, () => Array(totalDays).fill(''));

        // 주간/야간 당직 포인터 (연속 순환)
        let dayDutyPointer = 0;
        let nightDutyPointer = 1;

        for (let d = 0; d < totalDays; d++) {
          const currentDay = daysInMonth[d];
          const isWeekend = (currentDay.getDay() === 0 || currentDay.getDay() === 6);

          // 1. 주간 당직 1명 지정
          // 이전날 야간을 섰던 인원은 다음날 주간 투입 금지
          if (d > 0 && sched[dayDutyPointer % numMembers][d - 1] === 'N') {
            dayDutyPointer++;
          }
          const dayIdx = dayDutyPointer % numMembers;
          sched[dayIdx][d] = 'D';
          dayDutyPointer++;

          // 2. 야간 당직 1명 지정 (당일 주간 당직자와 겹치지 않게)
          while ((nightDutyPointer % numMembers) === dayIdx) {
            nightDutyPointer++;
          }
          const nightIdx = nightDutyPointer % numMembers;
          sched[nightIdx][d] = 'N';
          nightDutyPointer++;

          // 3. 야간 근무자 익일 비번(B) 강제 부여
          if (d + 1 < totalDays) {
            sched[nightIdx][d + 1] = 'B';
          }

          // 4. 나머지 대원 평일 주간(W) 또는 주말 휴무(O) 처리
          for (let m = 0; m < numMembers; m++) {
            if (!sched[m][d]) {
              sched[m][d] = isWeekend ? 'O' : 'W';
            }
          }
        }

        // 대원별 통계 집계
        const stats = members.map((name, idx) => {
          let dayDuty = 0, nightDuty = 0, weekendDuty = 0, regularWork = 0, offDays = 0;
          sched[idx].forEach((duty, dIdx) => {
            const isWeekend = (daysInMonth[dIdx].getDay() === 0 || daysInMonth[dIdx].getDay() === 6);
            if (duty === 'D') {
              dayDuty++;
              if (isWeekend) weekendDuty++;
            } else if (duty === 'N') {
              nightDuty++;
              if (isWeekend) weekendDuty++;
            } else if (duty === 'W') {
              regularWork++;
            } else if (duty === 'O' || duty === 'B') {
              offDays++;
            }
          });
          return { name, dayDuty, nightDuty, weekendDuty, regularWork, offDays };
        });

        return { schedule: sched, summary: stats };
      }, [members, daysInMonth]);

      // CSV 다운로드 함수
      const handleDownloadCSV = () => {
        let csv = "이름," + daysInMonth.map(d => `${d.getMonth()+1}/${d.getDate()}`).join(",") + ",주간당직,야간당직,주말당직합계,일반근무(09-18),휴무/비번\n";
        members.forEach((name, idx) => {
          const s = summary[idx];
          csv += `${name},` + schedule[idx].join(",") + `,${s.dayDuty},${s.nightDuty},${s.weekendDuty},${s.regularWork},${s.offDays}\n`;
        });
        const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `당직편성표_${year}년_${month}월.csv`;
        link.click();
      };

      const handleSaveMembers = () => {
        const parsed = memberInput.split(",").map(s => s.trim()).filter(Boolean);
        if (parsed.length === 14) {
          setMembers(parsed);
          setIsEditing(false);
        } else {
          alert(`현재 인원: ${parsed.length}명입니다. 정확히 14명을 입력해 주십시오.`);
        }
      };

      const getDutyBadge = (duty) => {
        switch (duty) {
          case 'D': return 'bg-amber-500/20 text-amber-300 border border-amber-500/40 font-bold';
          case 'N': return 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/40 font-bold';
          case 'B': return 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-medium text-[11px]';
          case 'W': return 'bg-slate-800/80 text-slate-300 border border-slate-700/50 text-[11px]';
          case 'O': return 'bg-slate-900/40 text-slate-600 border border-slate-800/40 text-[11px]';
          default: return '';
        }
      };

      return (
        <div className="max-w-[1550px] mx-auto px-4 py-8">
          {/* Header */}
          <div className="mb-6 p-6 rounded-2xl bg-gradient-to-r from-slate-900 via-slate-900 to-indigo-950/50 border border-slate-800 shadow-2xl flex flex-wrap items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-3">
                <span className="px-2.5 py-1 text-xs font-semibold rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                  사령관 전용 지휘통제기
                </span>
                <h1 className="text-2xl font-bold tracking-tight text-white">
                  14인 주·야간 당직 & 상근 자동 스케줄러
                </h1>
              </div>
              <p className="mt-1.5 text-sm text-slate-400">
                일별 주간(08~19) 1명, 야간(19~08) 1명 자동 지정 · 나머지 평일 상근(09~18) 및 주말 휴무 공평 분배
              </p>
            </div>

            <div className="flex items-center gap-3">
              <select
                value={month}
                onChange={(e) => setMonth(Number(e.target.value))}
                className="bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500"
              >
                {[...Array(12)].map((_, i) => (
                  <option key={i+1} value={i+1}>{year}년 {i+1}월</option>
                ))}
              </select>
              
              <button
                onClick={() => setIsEditing(!isEditing)}
                className="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-sm font-medium transition"
              >
                {isEditing ? '닫기' : '14인 명단 수정'}
              </button>

              <button
                onClick={handleDownloadCSV}
                className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-sm font-semibold shadow-lg shadow-indigo-600/30 transition flex items-center gap-2"
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
                CSV 엑셀 다운로드
              </button>
            </div>
          </div>

          {/* 명단 수정 패널 */}
          {isEditing && (
            <div className="mb-6 p-5 rounded-2xl bg-slate-900 border border-slate-800 shadow-xl">
              <h3 className="text-sm font-bold text-slate-300 mb-2">대원 명단 14인 입력 (쉼표로 구분)</h3>
              <div className="flex gap-2">
                <input
                  type="text"
                  value={memberInput}
                  onChange={(e) => setMemberInput(e.target.value)}
                  className="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                />
                <button
                  onClick={handleSaveMembers}
                  className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-sm font-semibold transition"
                >
                  반영하기
                </button>
              </div>
            </div>
          )}

          {/* 범례 배너 */}
          <div className="flex flex-wrap items-center gap-4 mb-4 text-xs">
            <span className="text-slate-400 font-medium">근무 코드:</span>
            <span className="px-2.5 py-1 rounded-md bg-amber-500/20 text-amber-300 border border-amber-500/40 font-bold">D: 주간 당직 (08~19) 1명</span>
            <span className="px-2.5 py-1 rounded-md bg-indigo-500/20 text-indigo-300 border border-indigo-500/40 font-bold">N: 야간 당직 (19~08) 1명</span>
            <span className="px-2.5 py-1 rounded-md bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">B: 야간 비번 (퇴근 휴식)</span>
            <span className="px-2.5 py-1 rounded-md bg-slate-800 text-slate-300 border border-slate-700">W: 일반 주간 (09~18)</span>
            <span className="px-2.5 py-1 rounded-md bg-slate-900 text-slate-500 border border-slate-800">O: 주말 완전 휴무</span>
          </div>

          {/* 메인 근무표 테이블 */}
          <div className="overflow-x-auto bg-slate-900/80 border border-slate-800 rounded-2xl shadow-2xl backdrop-blur-md">
            <table className="w-full text-center border-collapse">
              <thead>
                <tr className="border-b border-slate-800 bg-slate-950/70 text-slate-400 text-xs">
                  <th className="py-3 px-3 sticky left-0 bg-slate-950 z-20 font-bold text-slate-200 min-w-[80px]">성명</th>
                  {daysInMonth.map((d, i) => {
                    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
                    return (
                      <th key={i} className={`py-2 px-1 min-w-[32px] ${isWeekend ? 'text-rose-400 bg-rose-500/5' : 'text-slate-400'}`}>
                        <div>{d.getDate()}</div>
                        <div className="text-[10px] font-normal">{['일','월','화','수','목','금','토'][d.getDay()]}</div>
                      </th>
                    );
                  })}
                  <th className="py-3 px-2 text-amber-400 bg-slate-950/50 min-w-[50px]">주간(D)</th>
                  <th className="py-3 px-2 text-indigo-400 bg-slate-950/50 min-w-[50px]">야간(N)</th>
                  <th className="py-3 px-2 text-rose-400 bg-slate-950/50 min-w-[50px]">주말당직</th>
                  <th className="py-3 px-2 text-slate-300 bg-slate-950/50 min-w-[55px]">상근(W)</th>
                  <th className="py-3 px-2 text-emerald-400 bg-slate-950/50 min-w-[55px]">휴무/비번</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-800/60 text-sm">
                {members.map((name, mIdx) => {
                  const s = summary[mIdx];
                  return (
                    <tr key={mIdx} className="hover:bg-slate-800/40 transition">
                      <td className="py-2.5 px-3 font-semibold text-slate-200 sticky left-0 bg-slate-900 z-10 whitespace-nowrap">
                        {name}
                      </td>
                      {schedule[mIdx].map((duty, dIdx) => (
                        <td key={dIdx} className="p-0.5">
                          <div className={`h-7 w-7 mx-auto flex items-center justify-center rounded-lg transition ${getDutyBadge(duty)}`}>
                            {duty}
                          </div>
                        </td>
                      ))}
                      <td className="py-2.5 px-2 font-bold text-amber-400/90 text-xs bg-slate-950/30">{s.dayDuty}회</td>
                      <td className="py-2.5 px-2 font-bold text-indigo-400/90 text-xs bg-slate-950/30">{s.nightDuty}회</td>
                      <td className="py-2.5 px-2 font-bold text-rose-400/90 text-xs bg-slate-950/30">{s.weekendDuty}회</td>
                      <td className="py-2.5 px-2 font-medium text-slate-300 text-xs bg-slate-950/30">{s.regularWork}일</td>
                      <td className="py-2.5 px-2 font-medium text-emerald-400/90 text-xs bg-slate-950/30">{s.offDays}일</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          {/* 균등 분배 통계 요약 */}
          <div className="mt-8 grid grid-cols-1 md:grid-cols-4 gap-4">
            <div className="p-4 rounded-xl bg-slate-900/80 border border-slate-800">
              <p className="text-xs text-slate-400 font-semibold">일일 당직 정원</p>
              <p className="text-lg font-bold text-white mt-1">주간 1명 / 야간 1명</p>
              <p className="text-[11px] text-slate-500 mt-0.5">인프라 모니터링 무공백 유지</p>
            </div>
            <div className="p-4 rounded-xl bg-slate-900/80 border border-slate-800">
              <p className="text-xs text-slate-400 font-semibold">1인당 월평균 당직</p>
              <p className="text-lg font-bold text-indigo-400 mt-1">약 2회 ~ 3회</p>
              <p className="text-[11px] text-slate-500 mt-0.5">14인 기준 당직 부담 최소화</p>
            </div>
            <div className="p-4 rounded-xl bg-slate-900/80 border border-slate-800">
              <p className="text-xs text-slate-400 font-semibold">주말 당직 공평 편차</p>
              <p className="text-lg font-bold text-rose-400 mt-1">오차 ±1회 이내</p>
              <p className="text-[11px] text-slate-500 mt-0.5">주말 당직 독점/누락 원천 차단</p>
            </div>
            <div className="p-4 rounded-xl bg-slate-900/80 border border-slate-800">
              <p className="text-xs text-slate-400 font-semibold">야간 근무자 보호</p>
              <p className="text-lg font-bold text-emerald-400 mt-1">익일 비번(B) 100%</p>
              <p className="text-[11px] text-slate-500 mt-0.5">야간 직후 주간 투입 원천 차단</p>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ShiftApp />);
  </script>
</body>
</html>
