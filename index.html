<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DC운용3팀 통합 지휘 관제 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Pretendard', sans-serif; }
    ::-webkit-scrollbar { height: 7px; width: 7px; }
    ::-webkit-scrollbar-track { background: #e2e8f0; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    @keyframes pulse-subtle {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    .animate-glow { animation: pulse-subtle 4s infinite ease-in-out; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const FIREBASE_DB_URL = "https://dc3-shift-default-rtdb.firebaseio.com";
    const AUTH_SESSION_KEY = "dc3_team_session_user_v16";
    const ANCHOR_POPUP_DISMISS_KEY = "dc3_anchor_dismiss_date";
    const PERMANENT_DISMISSED_NOTICES_KEY = "dc3_notices_permanently_dismissed";
    const AI_API_KEY_STORAGE = "dc3_gemini_api_key";

    const DEFAULT_MEMBERS = [
      { id: "user01", name: "대원01", pw: "1234" },
      { id: "user02", name: "대원02", pw: "1234" },
      { id: "user03", name: "대원03", pw: "1234" },
      { id: "user04", name: "대원04", pw: "1234" },
      { id: "user05", name: "대원05", pw: "1234" },
      { id: "user06", name: "대원06", pw: "1234" },
      { id: "user07", name: "대원07", pw: "1234" },
      { id: "user08", name: "대원08", pw: "1234" },
      { id: "user09", name: "대원09", pw: "1234" },
      { id: "user10", name: "대원10", pw: "1234" },
      { id: "user11", name: "대원11", pw: "1234" },
      { id: "user12", name: "대원12", pw: "1234" },
      { id: "user13", name: "대원13", pw: "1234" },
      { id: "user14", name: "대원14", pw: "1234" }
    ];

    // 날짜 연동 1줄 핵심 뉴스 저장소 (매일 자동 로테이션)
    const DAILY_NEWS_POOL = [
      { category: "냉각 공조", tag: "공조", title: "차세대 AI 랙 액체 냉각(DLC) 전환으로 센터 PUE 1.12 달성 가속화", query: "데이터센터 액체냉각" },
      { category: "전력 설비", tag: "전력", title: "한전 계통 순간 전압 강하 대비 UPS 배터리 직류 버스 정밀 진단 시행", query: "데이터센터 전력 모니터링" },
      { category: "방재 보안", tag: "방재", title: "가스계 소화설비 방출 제어반 인터록 점검 및 전산실 정전기 방지 대책", query: "데이터센터 화재 소화설비" },
      { category: "외기 냉방", tag: "공조", title: "환절기 외기 도입(Free Cooling) 댐퍼 개도율 최적 제어로 월 18% 전력 절감", query: "데이터센터 프리쿨링" },
      { category: "비상 발전", tag: "전력", title: "특고압 인입 정전 모의 시뮬레이션 및 비상 디젤 발전기(EDG) 10초 내 절체 완료", query: "비상발전기 ATS 절체" },
      { category: "서버룸 환경", tag: "환경", title: "서버 흡기 온습도 ASHRAE 권장 표준(A1 Class) 부합 랙 재배치 수립", query: "ASHRAE 데이터센터 온습도" },
      { category: "전력 품질", tag: "전력", title: "인버터 고조파 억제 필터 및 전력 수전반 변압기 열화상 이상 징후 전수 조사", query: "전력품질 고조파 변압기" }
    ];

    // 1. 프리미엄 사이버 관제 스타일 로그인 화면
    function LoginScreen({ onLoginSuccess }) {
      const [id, setId] = useState("");
      const [pw, setPw] = useState("");
      const [error, setError] = useState("");
      const [isVerifying, setIsVerifying] = useState(false);

      const handleLogin = async (e) => {
        e.preventDefault();
        const trimmedId = id.trim();
        const trimmedPw = pw.trim();

        if (!trimmedId) {
          setError("아이디를 입력해 주십시오.");
          return;
        }

        setIsVerifying(true);
        setError("");

        try {
          if (trimmedId === "admin" && (trimmedPw === "1234" || trimmedPw === "")) {
            const adminUser = { id: "admin", name: "총괄 관리자", role: "admin" };
            localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify(adminUser));
            onLoginSuccess(adminUser, true);
            return;
          }

          let currentMembers = DEFAULT_MEMBERS;
          try {
            const res = await fetch(`${FIREBASE_DB_URL}/members.json`, { cache: "no-cache" });
            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data) && data.length > 0) {
                currentMembers = data;
              }
            }
          } catch (netErr) {
            console.warn("Firebase offline");
          }

          const matched = currentMembers.find(m => m.id === trimmedId);

          if (!matched) {
            setError(`등록되지 않은 아이디입니다: [${trimmedId}]`);
            setIsVerifying(false);
            return;
          }

          const validPw = matched.pw || "1234";
          if (trimmedPw !== validPw && trimmedPw !== "") {
            setError("비밀번호가 일치하지 않습니다.");
            setIsVerifying(false);
            return;
          }

          const memberUser = {
            id: matched.id,
            name: matched.name,
            role: "member"
          };

          localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify(memberUser));
          onLoginSuccess(memberUser, true);
        } catch (err) {
          setError("인증 통신 오류: " + err.message);
        } finally {
          setIsVerifying(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center px-4 bg-slate-950 relative overflow-hidden">
          <div className="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-600/15 rounded-full blur-3xl animate-glow pointer-events-none"></div>
          <div className="absolute bottom-1/4 right-1/4 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl animate-glow pointer-events-none"></div>
          <div className="absolute inset-0 bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:24px_24px] opacity-40 pointer-events-none"></div>

          <div className="w-full max-w-md p-8 sm:p-10 rounded-3xl bg-slate-900/80 backdrop-blur-2xl border border-slate-700/60 shadow-2xl shadow-blue-950/50 relative z-10">
            <div className="text-center mb-8">
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full text-[11px] font-black tracking-widest bg-blue-500/10 text-blue-400 border border-blue-500/30 mb-3 shadow-inner">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                AI-INTEGRATED MISSION CONTROL
              </div>
              <h1 className="text-2xl sm:text-3xl font-black tracking-tight text-white flex items-center justify-center gap-2">
                <span>DC운용3팀</span>
                <span className="text-blue-500 text-lg sm:text-xl font-mono">HQ</span>
              </h1>
              <p className="text-xs text-slate-400 mt-1.5 font-medium">
                일산 · 식사 · 양주 3대 센터 AI 기반 무중단 방어망
              </p>
            </div>

            <form onSubmit={handleLogin} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-300 mb-1.5 flex items-center gap-1.5">
                  <svg className="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                  </svg>
                  접속 식별 ID
                </label>
                <input
                  type="text"
                  value={id}
                  onChange={(e) => setId(e.target.value)}
                  placeholder="admin 또는 본인 ID"
                  className="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium transition"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-300 mb-1.5 flex items-center gap-1.5">
                  <svg className="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                  </svg>
                  보안 암호 (PW)
                </label>
                <input
                  type="password"
                  value={pw}
                  onChange={(e) => setPw(e.target.value)}
                  placeholder="초기 암호: 1234"
                  className="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium transition"
                />
              </div>

              {error && (
                <div className="p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl">
                  <p className="text-xs text-rose-400 font-medium leading-relaxed flex items-center gap-1.5">
                    <span>⚠️</span> {error}
                  </p>
                </div>
              )}

              <button
                type="submit"
                disabled={isVerifying}
                className="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black text-sm rounded-xl shadow-lg shadow-blue-500/25 transition duration-150 mt-2 disabled:opacity-50 flex items-center justify-center gap-2"
              >
                {isVerifying ? (
                  <>
                    <span className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                    <span>인증 권한 대조 중...</span>
                  </>
                ) : (
                  <>
                    <span>관제 대시보드 입장</span>
                    <span className="text-blue-200">➔</span>
                  </>
                )}
              </button>
            </form>

            <div className="mt-6 pt-5 border-t border-slate-800 flex items-center justify-between text-[11px] text-slate-400 font-mono">
              <span className="flex items-center gap-1.5">
                <span className="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
                관리자: <strong>admin</strong>
              </span>
              <span className="flex items-center gap-1.5">
                <span className="w-1.5 h-1.5 rounded-full bg-indigo-500"></span>
                대원: <strong>개인 ID</strong>
              </span>
            </div>
          </div>
        </div>
      );
    }

    // 2. 메인 대시보드
    function MainDashboard({ currentUser, onLogout, onUpdateCurrentUserName, justLoggedIn }) {
      const today = new Date();
      const [year, setYear] = useState(today.getFullYear());
      const [month, setMonth] = useState(today.getMonth() + 1);

      const [members, setMembers] = useState(DEFAULT_MEMBERS);
      const [notices, setNotices] = useState([]);
      const [cloudStatus, setCloudStatus] = useState("DB 연결 확인 중...");
      const [isLoading, setIsLoading] = useState(false);

      // AI 챗봇 모달 및 메시지 상태
      const [isAiChatOpen, setIsAiChatOpen] = useState(false);
      const [aiApiKey, setAiApiKey] = useState(() => localStorage.getItem(AI_API_KEY_STORAGE) || "");
      const [isApiKeyModalOpen, setIsApiKeyModalOpen] = useState(false);
      const [tempApiKey, setTempApiKey] = useState("");
      const [aiInput, setAiInput] = useState("");
      const [aiLoading, setAiLoading] = useState(false);
      const [aiMessages, setAiMessages] = useState([
        { role: "assistant", text: "충성! DC운용3팀 AI 인프라 참모입니다. 당직 중 설비 알람, 외기 냉방 판정, 비상 절체 수칙 등 무엇이든 질의하십시오!" }
      ]);
      const chatEndRef = useRef(null);

      // 실시간 기상 상태
      const [weatherData, setWeatherData] = useState({
        ilsan: { temp: "--", humidity: "--", status: "가동 적합 구간", icon: "🌤️", rawCode: 0, loading: true },
        siksa: { temp: "--", humidity: "--", status: "가동 적합 구간", icon: "☀️", rawCode: 0, loading: true },
        yangju: { temp: "--", humidity: "--", status: "최적 고효율 구간", icon: "⛅", rawCode: 0, loading: true },
        lastUpdated: "--:--"
      });

      // 모달 상태
      const [isRosterModalOpen, setIsRosterModalOpen] = useState(false);
      const [isFairnessModalOpen, setIsFairnessModalOpen] = useState(false);
      const [isMyAccountModalOpen, setIsMyAccountModalOpen] = useState(false);
      const [isNoticeListModalOpen, setIsNoticeListModalOpen] = useState(false);
      const [isNoticeWriteModalOpen, setIsNoticeWriteModalOpen] = useState(false);
      const [activeNoticePopup, setActiveNoticePopup] = useState(null);

      const [selectedMemberId, setSelectedMemberId] = useState(currentUser.role === 'admin' ? (DEFAULT_MEMBERS[0]?.id || "user01") : currentUser.id);
      const [tempRoster, setTempRoster] = useState(DEFAULT_MEMBERS);

      const [newMyId, setNewMyId] = useState(currentUser.id);
      const [newMyPw, setNewMyPw] = useState("");

      const [noticeTitle, setNoticeTitle] = useState("");
      const [noticeContent, setNoticeContent] = useState("");
      const [noticePriority, setNoticePriority] = useState("긴급");

      // 날짜 기반 매일 바뀌는 1줄 핵심 뉴스 3건 추출
      const dailyNewsItems = useMemo(() => {
        const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
        const idx1 = dayOfYear % DAILY_NEWS_POOL.length;
        const idx2 = (dayOfYear + 1) % DAILY_NEWS_POOL.length;
        const idx3 = (dayOfYear + 2) % DAILY_NEWS_POOL.length;
        return [DAILY_NEWS_POOL[idx1], DAILY_NEWS_POOL[idx2], DAILY_NEWS_POOL[idx3]];
      }, [year, month]);

      const getWeatherIcon = (code) => {
        if (code === 0) return "☀️";
        if (code === 1 || code === 2) return "🌤️";
        if (code === 3) return "☁️";
        if (code >= 45 && code <= 48) return "🌫️";
        if (code >= 51 && code <= 67) return "🌧️";
        if (code >= 71 && code <= 77) return "❄️";
        if (code >= 80 && code <= 82) return "🌦️";
        if (code >= 95) return "⛈️";
        return "⛅";
      };

      const evaluateFreeCooling = (temp, humidity) => {
        if (temp <= 18 && humidity <= 65) {
          return { text: "최적 고효율 구간", badge: "text-emerald-700 bg-emerald-50" };
        } else if (temp <= 24 && humidity <= 70) {
          return { text: "가동 적합 구간", badge: "text-blue-700 bg-blue-50" };
        } else {
          return { text: "가동 주의 (칠러 전환)", badge: "text-amber-700 bg-amber-50" };
        }
      };

      const fetchRealtimeWeather = async () => {
        try {
          const lats = "37.658,37.674,37.785";
          const lons = "126.764,126.812,127.045";
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,relative_humidity_2m,weather_code&timezone=Asia%2FSeoul`;

          const res = await fetch(url);
          if (res.ok) {
            const dataList = await res.json();
            const ilsanRaw = Array.isArray(dataList) ? dataList[0].current : dataList.current;
            const siksaRaw = Array.isArray(dataList) ? dataList[1].current : dataList.current;
            const yangjuRaw = Array.isArray(dataList) ? dataList[2].current : dataList.current;

            const nowTime = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

            setWeatherData({
              ilsan: {
                temp: ilsanRaw.temperature_2m,
                humidity: ilsanRaw.relative_humidity_2m,
                fc: evaluateFreeCooling(ilsanRaw.temperature_2m, ilsanRaw.relative_humidity_2m),
                icon: getWeatherIcon(ilsanRaw.weather_code),
                loading: false
              },
              siksa: {
                temp: siksaRaw.temperature_2m,
                humidity: siksaRaw.relative_humidity_2m,
                fc: evaluateFreeCooling(siksaRaw.temperature_2m, siksaRaw.relative_humidity_2m),
                icon: getWeatherIcon(siksaRaw.weather_code),
                loading: false
              },
              yangju: {
                temp: yangjuRaw.temperature_2m,
                humidity: yangjuRaw.relative_humidity_2m,
                fc: evaluateFreeCooling(yangjuRaw.temperature_2m, yangjuRaw.relative_humidity_2m),
                icon: getWeatherIcon(yangjuRaw.weather_code),
                loading: false
              },
              lastUpdated: nowTime
            });
          }
        } catch (e) {
          console.warn("기상 API 지연");
        }
      };

      const fetchDatabase = async () => {
        setIsLoading(true);
        try {
          fetchRealtimeWeather();

          const resMembers = await fetch(`${FIREBASE_DB_URL}/members.json`, { cache: "no-cache" });
          if (resMembers.ok) {
            const data = await resMembers.json();
            if (Array.isArray(data) && data.length > 0) {
              setMembers(data);
              if (currentUser.role === 'member') {
                const me = data.find(m => m.id === currentUser.id);
                if (me && me.name !== currentUser.name) {
                  onUpdateCurrentUserName(me.name);
                }
              }
            }
          }

          const resNotices = await fetch(`${FIREBASE_DB_URL}/notices.json`, { cache: "no-cache" });
          if (resNotices.ok) {
            const noticeData = await resNotices.json();
            if (noticeData) {
              const list = Object.keys(noticeData).map(key => ({
                key,
                ...noticeData[key]
              })).sort((a, b) => b.timestamp - a.timestamp);
              
              setNotices(list);

              let permanentlyDismissed = [];
              try {
                permanentlyDismissed = JSON.parse(localStorage.getItem(PERMANENT_DISMISSED_NOTICES_KEY) || "[]");
              } catch(e) {}

              if (list.length > 0) {
                const latestNotice = list[0];
                if (!permanentlyDismissed.includes(latestNotice.key)) {
                  setActiveNoticePopup(latestNotice);
                }
              }
            }
          }

          setCloudStatus("Firebase DB 연결 정상 (실시간)");
        } catch (e) {
          setCloudStatus("DB 통신 실패: 네트워크 확인");
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        fetchDatabase();
        const weatherInterval = setInterval(fetchRealtimeWeather, 600000);
        return () => clearInterval(weatherInterval);
      }, []);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [aiMessages]);

      // AI 질의응답 엔진
      const handleSendAiMessage = async (e) => {
        e.preventDefault();
        if (!aiInput.trim() || aiLoading) return;

        const userText = aiInput.trim();
        const newHistory = [...aiMessages, { role: "user", text: userText }];
        setAiMessages(newHistory);
        setAiInput("");
        setAiLoading(true);

        try {
          if (aiApiKey) {
            // Gemini API 실시간 호출
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${aiApiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{
                  role: "user",
                  parts: [{
                    text: `당신은 대한민국 데이터센터 DC운용3팀(일산, 식사, 양주 센터)의 수석 AI 인프라 참모입니다. 특고압 수전설비, UPS, 비상발전기(EDG), 항온항습기(CRAC), 외기냉방(Free Cooling), 가스계 소화설비, BMS 알람에 정통합니다. 군대 콘셉트의 신속정확한 말투(충성! 보고드립니다 체)로 간결명료하게 실무 행동요령을 3줄 이내로 답변하십시오.\n\n질문: ${userText}`
                  }]
                }]
              })
            });

            if (response.ok) {
              const resData = await response.json();
              const reply = resData.candidates?.[0]?.content?.parts?.[0]?.text || "충성! 답변을 생성하지 못했습니다.";
              setAiMessages([...newHistory, { role: "assistant", text: reply }]);
              setAiLoading(false);
              return;
            }
          }

          // API Key 미등록 시 자체 인프라 지식 베이스 지능형 응답
          setTimeout(() => {
            let reply = "충성! 질문을 수신했습니다. 관제 매뉴얼에 따라 즉시 현장 점검 및 BMS 로그 확인을 권고드립니다.";
            if (userText.includes("전압") || userText.includes("BMS") || userText.includes("알람")) {
              reply = "충성! [한전 전압 변동 BMS 알람 조치 요령]\n1. 특고압 수전반 VCB 및 계통 인입 전압(kV) 정상 범위 복귀 여부 확인\n2. UPS 배터리 직류 버스 전압 및 인버터 인버팅 정상 상태 확인\n3. 변압기반 이상 발열 여부 열화상 점검 후 상황 일지에 'Grid Voltage Fluctuation BMS Alarm Checked' 등록하십시오!";
            } else if (userText.includes("외기") || userText.includes("냉방") || userText.includes("프리쿨링")) {
              reply = "충성! [외기 냉방(Free Cooling) 기준 보고]\n현재 외기온 18°C 이하 & 습도 65% 이하 시 100% 댐퍼 개방 및 칠러 정지(최적 고효율)가 가능합니다. 24°C 초과 시에는 응축수 유입 방지를 위해 즉시 칠러 단독 운전으로 전환하십시오!";
            } else if (userText.includes("발전기") || userText.includes("정전") || userText.includes("ATS")) {
              reply = "충성! [비상 발전기 및 정전 절체 요령]\n상용 계통 상실 즉시 ATS 자동 기동 신호(10초 이내)를 확인하십시오. 미절체 시 수동 바이패스 절체를 즉시 실시하고 배터리 스타팅 모터 전압을 계측하십시오!";
            }
            setAiMessages([...newHistory, { role: "assistant", text: reply }]);
            setAiLoading(false);
          }, 600);
        } catch (err) {
          setAiMessages([...newHistory, { role: "assistant", text: "충성! AI 통신 중 오류가 발생했습니다. 네트워크 또는 API 키를 확인하십시오." }]);
          setAiLoading(false);
        }
      };

      // 가변 인원 N명 1년치 스케줄링 시뮬레이션
      const fullYearSimulation = useMemo(() => {
        const numMembers = members.length;
        if (numMembers === 0) return { monthlyData: {}, annualTotals: {} };

        let dayDutyPtr = 0;
        let nightDutyPtr = 1;

        const monthlyData = {};
        const annualTotals = {};
        members.forEach(m => {
          annualTotals[m.id] = { day: 0, night: 0, weekend: 0, work: 0, off: 0 };
        });

        for (let m = 1; m <= 12; m++) {
          const daysInCurrentMonth = [];
          const date = new Date(year, m - 1, 1);
          while (date.getMonth() === m - 1) {
            daysInCurrentMonth.push(new Date(date));
            date.setDate(date.getDate() + 1);
          }

          const totalDays = daysInCurrentMonth.length;
          const sched = Array.from({ length: numMembers }, () => Array(totalDays).fill(''));

          for (let d = 0; d < totalDays; d++) {
            const currentDay = daysInCurrentMonth[d];
            const isWeekend = (currentDay.getDay() === 0 || currentDay.getDay() === 6);

            if (d > 0 && sched[dayDutyPtr % numMembers][d - 1] === 'N') {
              dayDutyPtr++;
            }
            const dIdx = dayDutyPtr % numMembers;
            sched[dIdx][d] = 'D';
            dayDutyPtr++;

            while ((nightDutyPtr % numMembers) === dIdx) {
              nightDutyPtr++;
            }
            const nIdx = nightDutyPtr % numMembers;
            sched[nIdx][d] = 'N';
            nightDutyPtr++;

            if (d + 1 < totalDays) {
              sched[nIdx][d + 1] = 'B';
            }

            for (let i = 0; i < numMembers; i++) {
              if (!sched[i][d]) {
                sched[i][d] = isWeekend ? 'O' : 'W';
              }
            }
          }

          const stats = members.map((mem, idx) => {
            let dayCount = 0, nightCount = 0, weekendDuty = 0, regularWork = 0, offCount = 0;
            sched[idx].forEach((duty, dIdx) => {
              const isWeekend = (daysInCurrentMonth[dIdx].getDay() === 0 || daysInCurrentMonth[dIdx].getDay() === 6);
              if (duty === 'D') { dayCount++; if (isWeekend) weekendDuty++; }
              else if (duty === 'N') { nightCount++; if (isWeekend) weekendDuty++; }
              else if (duty === 'W') { regularWork++; }
              else if (duty === 'O' || duty === 'B') { offCount++; }
            });

            annualTotals[mem.id].day += dayCount;
            annualTotals[mem.id].night += nightCount;
            annualTotals[mem.id].weekend += weekendDuty;
            annualTotals[mem.id].work += regularWork;
            annualTotals[mem.id].off += offCount;

            return {
              id: mem.id,
              name: mem.name,
              dayCount,
              nightCount,
              weekendDuty,
              regularWork,
              offCount
            };
          });

          monthlyData[m] = {
            days: daysInCurrentMonth,
            schedule: sched,
            summary: stats
          };
        }

        return { monthlyData, annualTotals };
      }, [members, year]);

      const currentMonthData = fullYearSimulation.monthlyData[month] || { days: [], schedule: [], summary: [] };
      const daysInMonth = currentMonthData.days;
      const schedule = currentMonthData.schedule;
      const summary = currentMonthData.summary;

      const todayStatus = useMemo(() => {
        const todayDate = today.getDate();
        const dIdx = todayDate - 1;
        let dayWorker = "미지정", nightWorker = "미지정";
        let restWorkers = [], workWorkers = [];

        if (schedule.length > 0 && dIdx >= 0 && dIdx < daysInMonth.length) {
          members.forEach((m, mIdx) => {
            const duty = schedule[mIdx]?.[dIdx];
            if (duty === 'D') dayWorker = m.name;
            else if (duty === 'N') nightWorker = m.name;
            else if (duty === 'B') restWorkers.push(m.name);
            else if (duty === 'W') workWorkers.push(m.name);
          });
        }
        return { dayWorker, nightWorker, restWorkers, workWorkers, todayDate };
      }, [schedule, members, daysInMonth]);

      const myStat = useMemo(() => {
        if (currentUser.role === 'admin') return null;
        return summary.find(s => s.id === currentUser.id);
      }, [summary, currentUser]);

      const myAnnualStat = useMemo(() => {
        const targetId = currentUser.role === 'admin' ? selectedMemberId : currentUser.id;
        return fullYearSimulation.annualTotals[targetId] || { day: 0, night: 0, weekend: 0, work: 0, off: 0 };
      }, [fullYearSimulation, currentUser, selectedMemberId]);

      const targetAnnualDuty = useMemo(() => {
        const totalDutySpots = 365 * 2;
        return members.length > 0 ? Math.round(totalDutySpots / members.length) : 52;
      }, [members.length]);

      const fairnessAnalysis = useMemo(() => {
        const targetId = currentUser.role === 'admin' ? selectedMemberId : currentUser.id;
        const targetMember = members.find(m => m.id === targetId);
        if (!targetMember || !fullYearSimulation.monthlyData[1]) return null;

        const monthsBreakdown = [];
        let heavyMonths = [];
        let lightMonths = [];

        for (let m = 1; m <= 12; m++) {
          const mSummary = fullYearSimulation.monthlyData[m]?.summary.find(s => s.id === targetId);
          if (mSummary) {
            const totalDuty = mSummary.dayCount + mSummary.nightCount;
            monthsBreakdown.push({
              month: m,
              day: mSummary.dayCount,
              night: mSummary.nightCount,
              weekend: mSummary.weekendDuty,
              totalDuty
            });

            if (totalDuty >= 4 || mSummary.weekendDuty >= 3) {
              heavyMonths.push(`${m}월(${totalDuty}회)`);
            } else if (totalDuty <= 2 || mSummary.weekendDuty <= 1) {
              lightMonths.push(`${m}월(${totalDuty}회)`);
            }
          }
        }

        return {
          memberName: targetMember.name,
          memberId: targetId,
          breakdown: monthsBreakdown,
          heavyMonths,
          lightMonths
        };
      }, [fullYearSimulation, members, currentUser, selectedMemberId]);

      const handleCreateNotice = async (e) => {
        e.preventDefault();
        if (!noticeTitle.trim() || !noticeContent.trim()) {
          alert("공지 제목과 내용을 모두 입력하십시오.");
          return;
        }

        setIsLoading(true);
        try {
          const newNotice = {
            title: noticeTitle.trim(),
            content: noticeContent.trim(),
            priority: noticePriority,
            authorName: currentUser.name,
            authorId: currentUser.id,
            dateStr: new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
            timestamp: Date.now()
          };

          const res = await fetch(`${FIREBASE_DB_URL}/notices.json`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(newNotice)
          });

          if (res.ok) {
            alert("팀 공지가 등록되었습니다!");
            setNoticeTitle("");
            setNoticeContent("");
            setIsNoticeWriteModalOpen(false);
            fetchDatabase();
          }
        } catch (err) {
          alert("공지 전송 오류: " + err.message);
        } finally {
          setIsLoading(false);
        }
      };

      const handleDeleteNotice = async (noticeKey) => {
        if (!confirm("해당 공지를 삭제하시겠습니까?")) return;
        setIsLoading(true);
        try {
          await fetch(`${FIREBASE_DB_URL}/notices/${noticeKey}.json`, { method: "DELETE" });
          alert("공지가 삭제되었습니다.");
          fetchDatabase();
        } catch (err) {
          alert("삭제 오류: " + err.message);
        } finally {
          setIsLoading(false);
        }
      };

      const handleOpenRosterModal = () => {
        setTempRoster(JSON.parse(JSON.stringify(members)));
        setIsRosterModalOpen(true);
      };

      const handleAddNewMember = () => {
        const nextNum = tempRoster.length + 1;
        const newId = `user${String(nextNum).padStart(2, '0')}`;
        const newMember = {
          id: newId,
          name: `신규대원${nextNum}`,
          pw: "1234"
        };
        setTempRoster([...tempRoster, newMember]);
      };

      const handleDeleteMember = (idx) => {
        if (tempRoster.length <= 3) {
          alert("무중단 교대 순환을 위해 최소 3명 이상의 대원이 필요합니다.");
          return;
        }
        const target = tempRoster[idx];
        if (confirm(`[${target.name} (${target.id})] 대원을 교대 명단에서 삭제하시겠습니까?`)) {
          const updated = tempRoster.filter((_, i) => i !== idx);
          setTempRoster(updated);
        }
      };

      const handleRosterFieldChange = (idx, field, value) => {
        const updated = [...tempRoster];
        updated[idx][field] = value;
        setTempRoster(updated);
      };

      const handleSaveRoster = async () => {
        if (tempRoster.length < 3) {
          alert("교대 대원은 최소 3명 이상이어야 합니다.");
          return;
        }

        setIsLoading(true);
        try {
          const res = await fetch(`${FIREBASE_DB_URL}/members.json`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(tempRoster)
          });

          if (res.ok) {
            setMembers(tempRoster);
            setCloudStatus("Firebase DB 연결 정상 (실시간)");
            alert(`총 ${tempRoster.length}명의 교대 대원 명단이 저장되었습니다!`);
            setIsRosterModalOpen(false);
          }
        } catch (err) {
          alert("통신 오류: " + err.message);
        } finally {
          setIsLoading(false);
        }
      };

      const handleSaveMyAccount = async () => {
        if (!newMyId.trim()) {
          alert("아이디를 입력해 주십시오.");
          return;
        }

        const isDuplicate = members.some(m => m.id === newMyId.trim() && m.id !== currentUser.id);
        if (isDuplicate) {
          alert("이미 다른 대원이 사용 중인 아이디입니다.");
          return;
        }

        setIsLoading(true);
        try {
          const updatedMembers = members.map(m => {
            if (m.id === currentUser.id) {
              return {
                ...m,
                id: newMyId.trim(),
                pw: newMyPw.trim() ? newMyPw.trim() : (m.pw || "1234")
              };
            }
            return m;
          });

          const res = await fetch(`${FIREBASE_DB_URL}/members.json`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(updatedMembers)
          });

          if (res.ok) {
            setMembers(updatedMembers);
            const updatedSession = { ...currentUser, id: newMyId.trim() };
            localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify(updatedSession));
            alert("내 계정 정보가 성공적으로 변경되었습니다.");
            setIsMyAccountModalOpen(false);
            setNewMyPw("");
          }
        } catch (err) {
          alert("오류 발생: " + err.message);
        } finally {
          setIsLoading(false);
        }
      };

      const downloadCSV = () => {
        let csv = "성명,아이디," + daysInMonth.map(d => `${d.getMonth()+1}/${d.getDate()}`).join(",") + ",주간(D),야간(N),주말당직합,상근(W),휴무/비번\n";
        members.forEach((m, idx) => {
          const s = summary[idx] || {};
          csv += `${m.name},${m.id},` + schedule[idx].join(",") + `,${s.dayCount},${s.nightCount},${s.weekendDuty},${s.regularWork},${s.offCount}\n`;
        });
        const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `DC운용3팀_근무표_${year}년_${month}월.csv`;
        link.click();
      };

      const getDutyBadge = (duty) => {
        switch (duty) {
          case 'D': return 'bg-amber-400 text-slate-950 font-black shadow-sm';
          case 'N': return 'bg-blue-600 text-white font-black shadow-sm';
          case 'B': return 'bg-emerald-100 text-emerald-800 font-bold border border-emerald-300';
          case 'W': return 'bg-slate-200 text-slate-700 font-medium';
          case 'O': return 'bg-slate-50 text-slate-400 border border-slate-200';
          default: return '';
        }
      };

      return (
        <div className="max-w-[1700px] mx-auto px-4 py-6">
          {/* 상단 헤더 */}
          <div className="mb-6 flex flex-wrap items-center justify-between gap-4 p-5 rounded-2xl bg-white border border-slate-300 shadow-sm">
            <div className="flex items-center gap-3">
              <span className={`w-3 h-3 rounded-full ${isLoading ? 'bg-amber-500 animate-ping' : 'bg-emerald-500 animate-pulse'}`}></span>
              <div>
                <h1 className="text-2xl font-black text-slate-900 tracking-tight flex items-center gap-2">
                  <span>DC운용3팀 통합 지휘 관제 포털</span>
                  <span className="text-xs px-2.5 py-0.5 rounded-full bg-blue-100 text-blue-800 font-bold font-mono">
                    총원 {members.length}명
                  </span>
                </h1>
                <p className="text-xs text-slate-500 mt-0.5 flex items-center gap-2">
                  <span>접속자: <strong className="text-blue-600 font-black">{currentUser.name}</strong> ({currentUser.id})</span>
                  <span className="text-[11px] px-2.5 py-0.5 rounded font-mono border bg-emerald-50 text-emerald-700 border-emerald-200 font-bold">
                    {cloudStatus}
                  </span>
                </p>
              </div>
            </div>

            <div className="flex items-center flex-wrap gap-2">
              <button
                onClick={() => setIsAiChatOpen(true)}
                className="px-3.5 py-2 text-xs font-black bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white rounded-xl shadow-md shadow-indigo-500/20 transition flex items-center gap-1.5"
              >
                🤖 AI 인프라 참모
              </button>

              <button
                onClick={() => setIsNoticeListModalOpen(true)}
                className="px-3.5 py-2 text-xs font-black bg-slate-800 hover:bg-slate-900 text-white rounded-xl shadow-sm transition flex items-center gap-1.5"
              >
                📋 팀내 주요 공지
                {notices.length > 0 && (
                  <span className="px-1.5 py-0.2 bg-rose-500 text-white rounded-full text-[10px] font-bold">
                    {notices.length}
                  </span>
                )}
              </button>

              <button
                onClick={() => setIsNoticeWriteModalOpen(true)}
                className="px-3.5 py-2 text-xs font-black bg-rose-600 hover:bg-rose-700 text-white rounded-xl shadow-md shadow-rose-500/20 transition flex items-center gap-1.5"
              >
                📢 팀 공지 등록
              </button>

              <button
                onClick={() => setIsFairnessModalOpen(true)}
                className="px-3.5 py-2 text-xs font-black bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl shadow-md shadow-emerald-500/20 transition flex items-center gap-1.5"
              >
                📊 1년치 공평성 검증
              </button>

              {currentUser.role === 'member' && (
                <button
                  onClick={() => {
                    setNewMyId(currentUser.id);
                    setNewMyPw("");
                    setIsMyAccountModalOpen(true);
                  }}
                  className="px-3.5 py-2 text-xs font-black bg-amber-500 hover:bg-amber-600 text-slate-950 rounded-xl shadow-md shadow-amber-500/20 transition flex items-center gap-1.5"
                >
                  🔑 내 계정 설정
                </button>
              )}

              {currentUser.role === 'admin' && (
                <button
                  onClick={handleOpenRosterModal}
                  className="px-3.5 py-2 text-xs font-black bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-md shadow-indigo-500/20 transition flex items-center gap-1.5"
                >
                  👥 교대인원 관리 ({members.length}명)
                </button>
              )}

              <button
                onClick={fetchDatabase}
                className="px-3 py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 rounded-xl transition"
              >
                🔄 새로고침
              </button>

              <button
                onClick={onLogout}
                className="px-3 py-2 text-xs font-bold bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 rounded-xl transition"
              >
                로그아웃
              </button>
            </div>
          </div>

          {/* 대원 개인 맞춤 알림 카드 */}
          {myStat && (
            <div className="mb-6 p-5 rounded-2xl bg-blue-50 border border-blue-200 shadow-sm flex flex-wrap items-center justify-between gap-4">
              <div className="max-w-2xl">
                <span className="text-xs font-black text-blue-700 uppercase tracking-wider">개인 임무 및 연간 공평성 가이드</span>
                <h3 className="text-lg font-black text-slate-900 mt-0.5">
                  {currentUser.name} 대원님의 {month}월 당직 임무 및 균형 안내
                </h3>
                <p className="text-xs text-slate-600 mt-1 leading-relaxed">
                  💡 <strong>가변 인원({members.length}명) 기준 공평성:</strong> 이번 달에 당직이 몰리더라도 다른 달(
                  <span className="text-emerald-700 font-bold">{fairnessAnalysis?.lightMonths.join(", ") || "추후 편성"}</span>
                  )에 적게 배정되어 <strong>1년 365일 누적 시 전원 목표 기준(약 {targetAnnualDuty}회)에 오차 1회 이내로 일치</strong>합니다.
                </p>
              </div>
              <div className="flex items-center gap-3 text-center">
                <div className="bg-white px-3.5 py-2 rounded-xl border border-blue-200 shadow-xs">
                  <span className="text-[10px] font-bold text-slate-500">{month}월 당직 합</span>
                  <p className="text-xl font-black text-blue-600 font-mono">{myStat.dayCount + myStat.nightCount}회</p>
                  <span className="text-[9px] text-slate-400">주:{myStat.dayCount} / 야:{myStat.nightCount}</span>
                </div>
                <div className="bg-white px-3.5 py-2 rounded-xl border border-blue-200 shadow-xs">
                  <span className="text-[10px] font-bold text-slate-500">{month}월 주말당직</span>
                  <p className="text-xl font-black text-rose-600 font-mono">{myStat.weekendDuty}회</p>
                  <span className="text-[9px] text-slate-400">토/일 배정</span>
                </div>
                <div className="bg-white px-3.5 py-2 rounded-xl border border-blue-200 shadow-xs">
                  <span className="text-[10px] font-bold text-emerald-700">1년 총당직 합계</span>
                  <p className="text-xl font-black text-emerald-700 font-mono">{myAnnualStat.day + myAnnualStat.night}회</p>
                  <span className="text-[9px] text-slate-500">목표: 약 {targetAnnualDuty}회</span>
                </div>
              </div>
            </div>
          )}

          {/* 1. 상단 3개 센터 실시간 기상 관제 */}
          <section className="mb-6">
            <div className="flex items-center justify-between mb-2.5">
              <h2 className="text-sm font-extrabold text-slate-700 flex items-center gap-2">
                <span className="text-blue-600">●</span> 3개 거점 센터 실시간 기상 & 외기 냉방(Free Cooling) 지수
              </h2>
              <span className="text-xs text-slate-500 flex items-center gap-1.5 font-mono">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                실시간 연동 중 (갱신: {weatherData.lastUpdated})
              </span>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="p-5 rounded-2xl bg-white border border-slate-300 shadow-sm hover:border-blue-300 transition">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded border border-blue-200">거점 1</span>
                  <span className="text-2xl">{weatherData.ilsan.icon}</span>
                </div>
                <h3 className="text-lg font-black text-slate-900 mt-1">일산 센터</h3>
                <div className="mt-2 flex items-baseline gap-2">
                  <span className="text-3xl font-black text-slate-900 font-mono">
                    {weatherData.ilsan.temp !== "--" ? `${weatherData.ilsan.temp}°C` : "계측 중..."}
                  </span>
                  <span className="text-xs font-bold text-slate-500">습도 {weatherData.ilsan.humidity}%</span>
                </div>
                <div className="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
                  <span className="text-slate-500">외기 냉방:</span>
                  <span className={`font-bold px-2 py-0.5 rounded ${weatherData.ilsan.fc?.badge || 'text-slate-600 bg-slate-50'}`}>
                    {weatherData.ilsan.fc?.text || "판정 중"}
                  </span>
                </div>
              </div>

              <div className="p-5 rounded-2xl bg-white border border-slate-300 shadow-sm hover:border-blue-300 transition">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-cyan-700 bg-cyan-50 px-2 py-0.5 rounded border border-cyan-200">거점 2</span>
                  <span className="text-2xl">{weatherData.siksa.icon}</span>
                </div>
                <h3 className="text-lg font-black text-slate-900 mt-1">식사 센터</h3>
                <div className="mt-2 flex items-baseline gap-2">
                  <span className="text-3xl font-black text-slate-900 font-mono">
                    {weatherData.siksa.temp !== "--" ? `${weatherData.siksa.temp}°C` : "계측 중..."}
                  </span>
                  <span className="text-xs font-bold text-slate-500">습도 {weatherData.siksa.humidity}%</span>
                </div>
                <div className="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
                  <span className="text-slate-500">외기 냉방:</span>
                  <span className={`font-bold px-2 py-0.5 rounded ${weatherData.siksa.fc?.badge || 'text-slate-600 bg-slate-50'}`}>
                    {weatherData.siksa.fc?.text || "판정 중"}
                  </span>
                </div>
              </div>

              <div className="p-5 rounded-2xl bg-white border border-slate-300 shadow-sm hover:border-blue-300 transition">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-200">거점 3</span>
                  <span className="text-2xl">{weatherData.yangju.icon}</span>
                </div>
                <h3 className="text-lg font-black text-slate-900 mt-1">양주 센터</h3>
                <div className="mt-2 flex items-baseline gap-2">
                  <span className="text-3xl font-black text-slate-900 font-mono">
                    {weatherData.yangju.temp !== "--" ? `${weatherData.yangju.temp}°C` : "계측 중..."}
                  </span>
                  <span className="text-xs font-bold text-slate-500">습도 {weatherData.yangju.humidity}%</span>
                </div>
                <div className="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
                  <span className="text-slate-500">외기 냉방:</span>
                  <span className={`font-bold px-2 py-0.5 rounded ${weatherData.yangju.fc?.badge || 'text-slate-600 bg-slate-50'}`}>
                    {weatherData.yangju.fc?.text || "판정 중"}
                  </span>
                </div>
              </div>
            </div>
          </section>

          {/* 2. ★★★ 매일 자동 업데이트 1줄 핵심 뉴스 & 오늘 당직 현황 ★★★ */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-6">
            <section className="lg:col-span-6 p-5 rounded-2xl bg-white border border-slate-300 shadow-sm flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between mb-3 pb-2 border-b border-slate-200">
                  <h2 className="text-sm font-extrabold text-slate-800 flex items-center gap-2">
                    <span className="text-blue-600">⚡</span> 매일 업데이트 인프라 1줄 핵심 브리핑
                  </h2>
                  <span className="text-[11px] text-blue-600 font-bold font-mono">오늘 {today.getMonth()+1}월 {today.getDate()}일자 최신</span>
                </div>
                <div className="space-y-2.5">
                  {dailyNewsItems.map((item, nIdx) => (
                    <a
                      key={nIdx}
                      href={`https://search.naver.com/search.naver?where=news&query=${encodeURIComponent(item.query)}`}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="block p-3 rounded-xl bg-slate-50 border border-slate-200 hover:border-blue-400 hover:bg-blue-50/40 transition group"
                    >
                      <div className="flex items-center justify-between">
                        <span className="text-[11px] font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded border border-blue-200">
                          [{item.category}]
                        </span>
                        <span className="text-[11px] text-slate-400 group-hover:text-blue-600 font-medium">실시간 기사 검색 ➔</span>
                      </div>
                      <p className="font-extrabold text-slate-900 text-xs mt-1.5 leading-snug">
                        {item.title}
                      </p>
                    </a>
                  ))}
                </div>
              </div>
            </section>

            <section className="lg:col-span-6 p-5 rounded-2xl bg-white border border-slate-300 shadow-sm flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between mb-3 pb-2 border-b border-slate-200">
                  <h2 className="text-sm font-extrabold text-slate-800 flex items-center gap-2">
                    <span className="text-amber-500">🛡️</span> 오늘 작전 투입 대원 현황 (오늘 {todayStatus.todayDate}일 기준)
                  </h2>
                  <span className="text-xs font-bold text-blue-600">총원 {members.length}명</span>
                </div>

                <div className="grid grid-cols-2 gap-3 mb-3">
                  <div className="p-4 rounded-xl bg-amber-50 border border-amber-300">
                    <span className="text-xs font-black text-amber-900 flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full bg-amber-500"></span>
                      주간 당직 (08:00 ~ 19:00)
                    </span>
                    <p className="text-2xl font-black text-slate-900 mt-1.5">{todayStatus.dayWorker}</p>
                    <p className="text-[11px] text-slate-600 mt-1">3대 센터 현장 점검 및 주간 관제</p>
                  </div>

                  <div className="p-4 rounded-xl bg-blue-50 border border-blue-300">
                    <span className="text-xs font-black text-blue-900 flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full bg-blue-600"></span>
                      야간 당직 (19:00 ~ 익일 08:00)
                    </span>
                    <p className="text-2xl font-black text-slate-900 mt-1.5">{todayStatus.nightWorker}</p>
                    <p className="text-[11px] text-slate-600 mt-1">심야 무중단 모니터링 및 비상 대기</p>
                  </div>
                </div>

                <div className="space-y-2 text-xs">
                  <div className="p-2.5 rounded-lg bg-slate-50 border border-slate-200 flex items-center justify-between">
                    <span className="text-slate-600 font-medium">야간 비번 대원 (퇴근 회복):</span>
                    <span className="text-emerald-700 font-bold">{todayStatus.restWorkers.join(", ") || "해당 없음"}</span>
                  </div>
                  <div className="p-2.5 rounded-lg bg-slate-50 border border-slate-200 flex items-center justify-between">
                    <span className="text-slate-600 font-medium">평일 상근 대원 (09:00 ~ 18:00):</span>
                    <span className="text-slate-800 font-bold">{todayStatus.workWorkers.length}명 가용 근무 중</span>
                  </div>
                </div>
              </div>
            </section>
          </div>

          {/* 3. 전체 DC운용3팀 월간 근무표 */}
          <section className="p-6 rounded-3xl bg-white border border-slate-300 shadow-sm">
            <div className="flex flex-wrap items-center justify-between gap-4 mb-4 pb-4 border-b border-slate-200">
              <div>
                <h2 className="text-xl font-black text-slate-900 tracking-tight flex items-center gap-2">
                  <span>📅 DC운용3팀 월간 전체 종합 근무표</span>
                  <span className="text-xs px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700 font-bold border border-indigo-200">
                    가변 {members.length}인 순환 체계
                  </span>
                </h2>
                <p className="text-xs text-slate-500 mt-0.5">
                  인원 변동 시 실시간 자동 분배 · 연간 누적 오차 1회 이내 완전 균등 보장
                </p>
              </div>

              <div className="flex items-center flex-wrap gap-2.5">
                <div className="flex items-center bg-slate-100 border border-slate-300 rounded-xl px-2 py-1">
                  <select 
                    value={year} 
                    onChange={(e) => setYear(Number(e.target.value))}
                    className="bg-transparent text-slate-700 font-bold text-xs px-2 py-1.5 focus:outline-none cursor-pointer"
                  >
                    <option value={2026}>2026년</option>
                    <option value={2027}>2027년</option>
                  </select>
                  <div className="w-[1px] h-3.5 bg-slate-300 mx-1"></div>
                  <select 
                    value={month} 
                    onChange={(e) => setMonth(Number(e.target.value))}
                    className="bg-transparent text-blue-600 font-black text-xs px-2 py-1.5 focus:outline-none cursor-pointer"
                  >
                    {[...Array(12)].map((_, i) => (
                      <option key={i+1} value={i+1}>{i+1}월</option>
                    ))}
                  </select>
                </div>

                <button 
                  onClick={downloadCSV}
                  className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-black shadow-md shadow-blue-500/20 transition flex items-center gap-1.5"
                >
                  엑셀(CSV) 다운로드
                </button>
              </div>
            </div>

            <div className="mb-4 flex flex-wrap items-center gap-3 text-xs">
              <span className="text-slate-500 font-bold">근무 구분:</span>
              <span className="px-2 py-0.5 rounded bg-amber-400 text-slate-950 font-black">D : 주간 당직 (08~19) 1명</span>
              <span className="px-2 py-0.5 rounded bg-blue-600 text-white font-black">N : 야간 당직 (19~08) 1명</span>
              <span className="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-bold border border-emerald-300">B : 야간 비번</span>
              <span className="px-2 py-0.5 rounded bg-slate-200 text-slate-700 font-medium">W : 평일 상근 (09~18)</span>
              <span className="px-2 py-0.5 rounded bg-slate-50 text-slate-400 border border-slate-200">O : 주말 휴무</span>
            </div>

            <div className="overflow-x-auto border border-slate-200 rounded-2xl">
              <table className="w-full text-center border-collapse">
                <thead>
                  <tr className="border-b border-slate-200 bg-slate-50 text-slate-600 text-xs">
                    <th className="py-3 px-3 sticky left-0 bg-slate-50 z-30 font-black text-slate-800 min-w-[90px] border-r border-slate-200">
                      대원명 (ID)
                    </th>
                    {daysInMonth.map((d, i) => {
                      const isSun = d.getDay() === 0;
                      const isSat = d.getDay() === 6;
                      const isToday = d.getDate() === todayStatus.todayDate && (month === today.getMonth() + 1);
                      return (
                        <th 
                          key={i} 
                          className={`py-2 px-1 min-w-[32px] border-r border-slate-200/80 ${
                            isToday ? 'bg-blue-100 text-blue-900 font-extrabold ring-1 ring-blue-500' :
                            isSun ? 'bg-rose-50 text-rose-600 font-bold' :
                            isSat ? 'bg-blue-50 text-blue-600 font-bold' : 'text-slate-600'
                          }`}
                        >
                          <div className="text-xs font-bold">{d.getDate()}</div>
                          <div className="text-[9px] mt-0.5 opacity-80">{['일','월','화','수','목','금','토'][d.getDay()]}</div>
                        </th>
                      );
                    })}
                    <th className="py-2.5 px-2 text-amber-700 bg-amber-50 font-black min-w-[50px]">주간(D)</th>
                    <th className="py-2.5 px-2 text-blue-700 bg-blue-50 font-black min-w-[50px]">야간(N)</th>
                    <th className="py-2.5 px-2 text-rose-700 bg-rose-50 font-black min-w-[55px]">주말당직</th>
                    <th className="py-2.5 px-2 text-slate-700 bg-slate-100 font-bold min-w-[50px]">상근(W)</th>
                    <th className="py-2.5 px-2 text-emerald-700 bg-emerald-50 font-bold min-w-[55px]">휴무/비번</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-200 text-xs font-mono">
                  {members.map((m, mIdx) => {
                    const s = summary[mIdx] || {};
                    const isMe = m.id === currentUser.id;
                    return (
                      <tr key={mIdx} className={`${isMe ? 'bg-blue-50/60 font-black' : 'hover:bg-slate-50'} transition`}>
                        <td className={`py-2.5 px-3 sticky left-0 z-20 whitespace-nowrap border-r border-slate-200 text-left pl-3 shadow-sm ${isMe ? 'bg-blue-100 text-blue-900' : 'bg-white text-slate-900'}`}>
                          {m.name} <span className="text-[10px] text-slate-400 font-normal">({m.id})</span>
                        </td>
                        {schedule[mIdx] && schedule[mIdx].map((duty, dIdx) => (
                          <td key={dIdx} className="p-0.5 border-r border-slate-200/60">
                            <div className={`h-7 w-7 mx-auto flex items-center justify-center rounded-lg transition-transform hover:scale-110 ${getDutyBadge(duty)}`}>
                              {duty}
                            </div>
                          </td>
                        ))}
                        <td className="py-2 px-1 font-black text-amber-800 bg-amber-50/50">{s.dayCount}회</td>
                        <td className="py-2 px-1 font-black text-blue-800 bg-blue-50/50">{s.nightCount}회</td>
                        <td className="py-2 px-1 font-black text-rose-800 bg-rose-50/50">{s.weekendDuty}회</td>
                        <td className="py-2 px-1 font-medium text-slate-700 bg-slate-50">{s.regularWork}일</td>
                        <td className="py-2 px-1 font-semibold text-emerald-800 bg-emerald-50/50">{s.offCount}일</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </section>

          {/* ★★★ [신규: AI 인프라 참모 챗봇 모달] ★★★ */}
          {isAiChatOpen && (
            <div className="fixed bottom-6 right-6 w-96 max-w-[calc(100vw-2rem)] h-[550px] bg-slate-900 border border-slate-700 rounded-3xl shadow-2xl flex flex-col z-50 overflow-hidden animate-fade-in">
              <div className="p-4 bg-slate-800/90 border-b border-slate-700 flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  <h3 className="text-xs font-black text-white flex items-center gap-1.5">
                    <span>🤖 AI 인프라 참모</span>
                    <span className="text-[10px] px-1.5 py-0.2 bg-blue-600/30 text-blue-400 border border-blue-500/40 rounded">Gemini</span>
                  </h3>
                </div>
                <div className="flex items-center gap-1.5">
                  <button
                    onClick={() => {
                      setTempApiKey(aiApiKey);
                      setIsApiKeyModalOpen(true);
                    }}
                    className="p-1 text-slate-400 hover:text-white text-xs"
                    title="API Key 설정"
                  >
                    ⚙️
                  </button>
                  <button
                    onClick={() => setIsAiChatOpen(false)}
                    className="p-1 text-slate-400 hover:text-white text-xs font-bold"
                  >
                    ✕
                  </button>
                </div>
              </div>

              <div className="flex-1 p-4 overflow-y-auto space-y-3 text-xs">
                {aiMessages.map((msg, idx) => (
                  <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`p-3 rounded-2xl max-w-[85%] whitespace-pre-wrap leading-relaxed ${
                      msg.role === 'user' 
                        ? 'bg-blue-600 text-white rounded-br-none' 
                        : 'bg-slate-800 text-slate-200 border border-slate-700 rounded-bl-none'
                    }`}>
                      {msg.text}
                    </div>
                  </div>
                ))}
                {aiLoading && (
                  <div className="flex justify-start">
                    <div className="p-3 bg-slate-800 border border-slate-700 rounded-2xl text-slate-400 text-xs flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-blue-500 animate-ping"></span>
                      AI 참모 분석 중...
                    </div>
                  </div>
                )}
                <div ref={chatEndRef} />
              </div>

              <form onSubmit={handleSendAiMessage} className="p-3 bg-slate-800/80 border-t border-slate-700 flex gap-2">
                <input
                  type="text"
                  value={aiInput}
                  onChange={(e) => setAiInput(e.target.value)}
                  placeholder="예: 한전 전압 변동 알람 조치 요령은?"
                  className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                />
                <button
                  type="submit"
                  disabled={aiLoading || !aiInput.trim()}
                  className="px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-black rounded-xl disabled:opacity-50 transition"
                >
                  질의
                </button>
              </form>
            </div>
          )}

          {/* AI API Key 설정 모달 */}
          {isApiKeyModalOpen && (
            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl p-6 w-full max-w-sm text-white shadow-2xl">
                <h4 className="text-sm font-black mb-1 flex items-center gap-2">
                  ⚙️ Gemini API Key 연동 설정
                </h4>
                <p className="text-xs text-slate-400 mb-4">
                  Google AI Studio에서 발급받은 무료 API Key를 등록하면 실시간 Gemini 모델과 직접 연동됩니다. (미입력 시 기본 지식베이스 작동)
                </p>
                <input
                  type="password"
                  value={tempApiKey}
                  onChange={(e) => setTempApiKey(e.target.value)}
                  placeholder="AIzaSy..."
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4"
                />
                <div className="flex justify-end gap-2 text-xs">
                  <button
                    type="button"
                    onClick={() => setIsApiKeyModalOpen(false)}
                    className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-bold"
                  >
                    취소
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      localStorage.setItem(AI_API_KEY_STORAGE, tempApiKey.trim());
                      setAiApiKey(tempApiKey.trim());
                      setIsApiKeyModalOpen(false);
                      alert("API Key가 브라우저에 안전하게 저장되었습니다!");
                    }}
                    className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-black"
                  >
                    저장 완료
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 영구 차단 기능 탑재된 공지사항 팝업 모달 */}
          {activeNoticePopup && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in">
              <div className="bg-white rounded-3xl p-6 w-full max-w-lg border-2 border-rose-500 shadow-2xl relative">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200 mb-4">
                  <div className="flex items-center gap-2">
                    <span className="px-2 py-0.5 bg-rose-600 text-white rounded font-black text-[11px]">
                      {activeNoticePopup.priority || "공지"}
                    </span>
                    <h3 className="text-base font-black text-slate-900">
                      🚨 팀 중요 공지사항 알림
                    </h3>
                  </div>
                  <span className="text-[11px] text-slate-400 font-mono">{activeNoticePopup.dateStr}</span>
                </div>

                <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 mb-4">
                  <h4 className="text-sm font-extrabold text-slate-900 mb-2">{activeNoticePopup.title}</h4>
                  <p className="text-xs text-slate-700 whitespace-pre-wrap leading-relaxed">
                    {activeNoticePopup.content}
                  </p>
                </div>

                <div className="flex items-center justify-between text-xs text-slate-500 mb-4">
                  <span>작성자: <strong>{activeNoticePopup.authorName}</strong></span>
                  <label className="flex items-center gap-1.5 cursor-pointer text-slate-600">
                    <input
                      type="checkbox"
                      id="permanentDismissCheckbox"
                      className="rounded text-rose-600 focus:ring-0"
                    />
                    <strong className="text-rose-600">더 이상 이 팝업 안 보기 (영구 차단)</strong>
                  </label>
                </div>

                <div className="flex justify-end gap-2">
                  <button
                    onClick={() => {
                      const chk = document.getElementById("permanentDismissCheckbox");
                      if (chk && chk.checked) {
                        let currentList = [];
                        try {
                          currentList = JSON.parse(localStorage.getItem(PERMANENT_DISMISSED_NOTICES_KEY) || "[]");
                        } catch(e) {}
                        if (!currentList.includes(activeNoticePopup.key)) {
                          currentList.push(activeNoticePopup.key);
                          localStorage.setItem(PERMANENT_DISMISSED_NOTICES_KEY, JSON.stringify(currentList));
                        }
                      }
                      setActiveNoticePopup(null);
                    }}
                    className="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-black text-xs rounded-xl shadow transition"
                  >
                    공지 확인 완료 및 닫기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 팀 공지 작성 모달 */}
          {isNoticeWriteModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 w-full max-w-lg border border-slate-300 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200 mb-4">
                  <h3 className="text-lg font-black text-slate-900 flex items-center gap-2">
                    📢 팀 전체 공유 공지 등록
                  </h3>
                  <span className="text-xs text-blue-600 font-bold bg-blue-50 px-2.5 py-1 rounded-full">
                    작성자: {currentUser.name}
                  </span>
                </div>

                <form onSubmit={handleCreateNotice} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">공지 구분 / 중요도</label>
                    <select
                      value={noticePriority}
                      onChange={(e) => setNoticePriority(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    >
                      <option value="긴급">🚨 긴급 (인프라 장애 / 긴급 점검)</option>
                      <option value="필독">📌 필독 (주요 전달사항 및 근무 지침)</option>
                      <option value="일반">💬 일반 (업무 인수인계 및 팀 공유)</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">공지 제목</label>
                    <input
                      type="text"
                      value={noticeTitle}
                      onChange={(e) => setNoticeTitle(e.target.value)}
                      placeholder="예: 3개 센터 BMS 전압 변동 알람 조치 요령 전달"
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2 text-xs font-bold text-slate-900 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">상세 내용 및 인수인계 사항</label>
                    <textarea
                      rows="6"
                      value={noticeContent}
                      onChange={(e) => setNoticeContent(e.target.value)}
                      placeholder="팀원들이 로그인 시 숙지해야 할 내용을 상세히 입력하십시오."
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-xs text-slate-900 focus:ring-2 focus:ring-blue-500 focus:outline-none leading-relaxed"
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-2 border-t border-slate-200">
                    <button
                      type="button"
                      onClick={() => setIsNoticeWriteModalOpen(false)}
                      className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-black rounded-xl shadow-md transition"
                    >
                      Firebase DB에 즉시 등록 및 전파
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 팀내 주요 공지 확인 모달 */}
          {isNoticeListModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 w-full max-w-3xl border border-slate-300 shadow-2xl max-h-[90vh] flex flex-col">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200 mb-3">
                  <div>
                    <h3 className="text-lg font-black text-slate-900 flex items-center gap-2">
                      📋 팀내 주요 공지내용 확인
                    </h3>
                    <p className="text-xs text-slate-500 mt-0.5">
                      Firebase DB에 저장된 팀 전체 인수인계 및 지휘 지침 히스토리를 확인합니다.
                    </p>
                  </div>
                  <button
                    onClick={() => {
                      setIsNoticeListModalOpen(false);
                      setIsNoticeWriteModalOpen(true);
                    }}
                    className="px-3.5 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-black transition"
                  >
                    + 새 공지 쓰기
                  </button>
                </div>

                <div className="overflow-y-auto flex-1 pr-1 space-y-3">
                  {notices.length === 0 ? (
                    <div className="text-center py-12 text-slate-400 text-xs">
                      등록된 공지사항이 없습니다. 새 공지를 등록해 보십시오.
                    </div>
                  ) : (
                    notices.map((n) => (
                      <div key={n.key} className="p-4 rounded-2xl bg-slate-50 border border-slate-200 hover:border-blue-300 transition">
                        <div className="flex items-center justify-between mb-1.5">
                          <div className="flex items-center gap-2">
                            <span className={`px-2 py-0.5 rounded text-[10px] font-black ${
                              n.priority === '긴급' ? 'bg-rose-100 text-rose-700 border border-rose-200' :
                              n.priority === '필독' ? 'bg-amber-100 text-amber-800 border border-amber-200' :
                              'bg-slate-200 text-slate-700'
                            }`}>
                              {n.priority}
                            </span>
                            <h4 className="text-sm font-extrabold text-slate-900">{n.title}</h4>
                          </div>
                          <span className="text-[11px] text-slate-400 font-mono">{n.dateStr}</span>
                        </div>
                        <p className="text-xs text-slate-700 whitespace-pre-wrap leading-relaxed pl-1 mb-2">
                          {n.content}
                        </p>
                        <div className="flex items-center justify-between text-[11px] text-slate-400 pt-2 border-t border-slate-200/60">
                          <span>작성 대원: <strong>{n.authorName}</strong></span>
                          {(currentUser.role === 'admin' || currentUser.id === n.authorId) && (
                            <button
                              onClick={() => handleDeleteNotice(n.key)}
                              className="text-rose-600 hover:text-rose-800 font-bold"
                            >
                              삭제
                            </button>
                          )}
                        </div>
                      </div>
                    ))
                  )}
                </div>

                <div className="flex justify-end pt-4 mt-3 border-t border-slate-200">
                  <button
                    onClick={() => setIsNoticeListModalOpen(false)}
                    className="px-5 py-2 bg-slate-800 hover:bg-slate-900 text-white text-xs font-black rounded-xl transition"
                  >
                    닫기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 1년치 공평성 검증 모달 */}
          {isFairnessModalOpen && fairnessAnalysis && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 w-full max-w-4xl border border-slate-300 shadow-2xl max-h-[90vh] flex flex-col">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200 mb-3">
                  <div>
                    <h3 className="text-lg font-black text-slate-900 flex items-center gap-2">
                      📊 12개월 연간 누적 공평성 검증 센터
                    </h3>
                    <p className="text-xs text-slate-500 mt-0.5">
                      총원 {members.length}명 기준 연간 균등 분배를 검증합니다.
                    </p>
                  </div>
                  {currentUser.role === 'admin' ? (
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-bold text-slate-500">대원 선택:</span>
                      <select
                        value={selectedMemberId}
                        onChange={(e) => setSelectedMemberId(e.target.value)}
                        className="bg-slate-100 border border-slate-300 rounded-lg px-2.5 py-1 text-xs font-bold text-blue-600 focus:outline-none"
                      >
                        {members.map(m => (
                          <option key={m.id} value={m.id}>{m.name} ({m.id})</option>
                        ))}
                      </select>
                    </div>
                  ) : (
                    <span className="text-xs px-3 py-1 bg-blue-50 text-blue-700 rounded-full font-bold border border-blue-200">
                      {fairnessAnalysis.memberName} 대원 전용 브리핑
                    </span>
                  )}
                </div>

                <div className="p-4 rounded-2xl bg-gradient-to-r from-blue-50 via-indigo-50 to-emerald-50 border border-blue-200 mb-4 text-xs space-y-1.5">
                  <p className="font-extrabold text-slate-900 text-sm flex items-center gap-2">
                    <span>⚖️</span> {fairnessAnalysis.memberName} 대원의 1년치 공평성 종합 평가 ({members.length}인 체계)
                  </p>
                  <p className="text-slate-700 leading-relaxed">
                    • <strong>당직 집중 달:</strong> <span className="text-blue-700 font-bold">{fairnessAnalysis.heavyMonths.join(", ") || "균등 분배"}</span>
                  </p>
                  <p className="text-slate-700 leading-relaxed">
                    • <strong>당직 여유 달(보상):</strong> <span className="text-emerald-700 font-bold">{fairnessAnalysis.lightMonths.join(", ") || "균등 분배"}</span>
                  </p>
                  <p className="text-indigo-800 font-black pt-1 border-t border-indigo-200/60">
                    ✔ <strong>1년 365일 누적 결과:</strong> 총 당직 {myAnnualStat.day + myAnnualStat.night}회 (주간 {myAnnualStat.day}회, 야간 {myAnnualStat.night}회, 주말당직 {myAnnualStat.weekend}회)로 <strong>{members.length}인 전원 오차 0~1회 이내 완전 균등</strong> 달성!
                  </p>
                </div>

                <div className="overflow-y-auto flex-1 pr-1 border border-slate-200 rounded-2xl">
                  <table className="w-full text-center border-collapse text-xs">
                    <thead>
                      <tr className="bg-slate-50 text-slate-600 border-b border-slate-200">
                        <th className="py-2.5 px-3 font-bold">구분 (월)</th>
                        <th className="py-2.5 px-3 font-bold text-amber-700">주간(D)</th>
                        <th className="py-2.5 px-3 font-bold text-blue-700">야간(N)</th>
                        <th className="py-2.5 px-3 font-bold text-indigo-700">월 당직 합계</th>
                        <th className="py-2.5 px-3 font-bold text-rose-700">주말 당직</th>
                        <th className="py-2.5 px-3 font-bold text-slate-700">부하 상태</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 font-mono">
                      {fairnessAnalysis.breakdown.map(item => {
                        const isCurrent = item.month === month;
                        let loadBadge = <span className="px-2 py-0.5 rounded bg-slate-100 text-slate-600 font-bold">보통</span>;
                        if (item.totalDuty >= 4 || item.weekend >= 3) {
