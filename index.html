<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DC운용3팀 통합 지휘 관제 포털</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Pretendard', sans-serif; }
    ::-webkit-scrollbar { height: 7px; width: 7px; }
    ::-webkit-scrollbar-track { background: #e2e8f0; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 기본 계정 및 팀원 초기 세팅 (초기 PW는 모두 1234)
    const DEFAULT_USERS = [
      { id: "admin", pw: "1234", name: "사령관(관리자)", role: "admin" },
      { id: "user01", pw: "1234", name: "대원01", role: "member" },
      { id: "user02", pw: "1234", name: "대원02", role: "member" },
      { id: "user03", pw: "1234", name: "대원03", role: "member" },
      { id: "user04", pw: "1234", name: "대원04", role: "member" },
      { id: "user05", pw: "1234", name: "대원05", role: "member" },
      { id: "user06", pw: "1234", name: "대원06", role: "member" },
      { id: "user07", pw: "1234", name: "대원07", role: "member" },
      { id: "user08", pw: "1234", name: "대원08", role: "member" },
      { id: "user09", pw: "1234", name: "대원09", role: "member" },
      { id: "user10", pw: "1234", name: "대원10", role: "member" },
      { id: "user11", pw: "1234", name: "대원11", role: "member" },
      { id: "user12", pw: "1234", name: "대원12", role: "member" },
      { id: "user13", pw: "1234", name: "대원13", role: "member" },
      { id: "user14", pw: "1234", name: "대원14", role: "member" }
    ];

    const STORAGE_USERS_KEY = "dc3_team_users_vault_v5";
    const AUTH_SESSION_KEY = "dc3_team_current_session_v5";

    // 1. 로그인 화면
    function LoginScreen({ onLoginSuccess }) {
      const [id, setId] = useState("");
      const [pw, setPw] = useState("");
      const [error, setError] = useState("");

      const handleLogin = (e) => {
        e.preventDefault();
        const users = JSON.parse(localStorage.getItem(STORAGE_USERS_KEY) || JSON.stringify(DEFAULT_USERS));
        const matched = users.find(u => u.id === id.trim() && u.pw === pw.trim());

        if (matched) {
          localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify(matched));
          onLoginSuccess(matched);
        } else {
          setError("아이디 또는 비밀번호가 일치하지 않습니다. (관리자: admin / 대원: user01~user14 / 초기PW: 1234)");
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center px-4 bg-slate-200">
          <div className="w-full max-w-md p-8 rounded-3xl bg-white border border-slate-300 shadow-2xl relative">
            <div className="text-center mb-8">
              <span className="inline-flex items-center px-3 py-1 rounded-full text-xs font-black tracking-widest bg-blue-50 text-blue-600 border border-blue-200 mb-3">
                INTEGRATED OPS COMMAND
              </span>
              <h1 className="text-2xl font-black tracking-tight text-slate-900">DC운용3팀 통합 관제</h1>
              <p className="text-xs text-slate-500 mt-1">일산 · 식사 · 양주 센터 14인 지휘 시스템</p>
            </div>

            <form onSubmit={handleLogin} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1.5">아이디 (ID)</label>
                <input
                  type="text"
                  value={id}
                  onChange={(e) => setId(e.target.value)}
                  placeholder="admin 또는 user01 ~ user14"
                  className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1.5">비밀번호 (PW)</label>
                <input
                  type="password"
                  value={pw}
                  onChange={(e) => setPw(e.target.value)}
                  placeholder="초기 암호: 1234"
                  className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium"
                />
              </div>

              {error && <p className="text-xs text-rose-600 font-medium leading-relaxed">{error}</p>}

              <button
                type="submit"
                className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-black text-sm rounded-xl shadow-lg shadow-blue-500/20 transition duration-150 mt-2"
              >
                관제 대시보드 로그인
              </button>
            </form>

            <div className="mt-6 p-3 bg-slate-50 rounded-xl border border-slate-200 text-[11px] text-slate-500 space-y-1">
              <p>👑 <strong>관리자:</strong> ID <code className="text-blue-600 font-bold">admin</code> / PW <code>1234</code></p>
              <p>👤 <strong>팀원들:</strong> ID <code className="text-indigo-600 font-bold">user01</code> ~ <code className="text-indigo-600 font-bold">user14</code> / PW <code>1234</code></p>
            </div>
          </div>
        </div>
      );
    }

    // 2. 통합 대시보드
    function MainDashboard({ currentUser, onLogout }) {
      const today = new Date();
      const [year, setYear] = useState(today.getFullYear());
      const [month, setMonth] = useState(today.getMonth() + 1);

      // 전체 유저 및 팀원 명단 상태
      const [users, setUsers] = useState(() => {
        const saved = localStorage.getItem(STORAGE_USERS_KEY);
        return saved ? JSON.parse(saved) : DEFAULT_USERS;
      });

      // 모달 상태들
      const [isMemberManageModal, setIsMemberManageModal] = useState(false);
      const [isMyPwModal, setIsMyPwModal] = useState(false);
      const [isSyncModal, setIsSyncModal] = useState(false);
      const [syncCodeInput, setSyncCodeInput] = useState("");
      
      // 내 비번 변경용
      const [myNewPw, setMyNewPw] = useState("");

      // 관리자용 팀원 수정 데이터
      const [editUsersText, setEditUsersText] = useState("");

      useEffect(() => {
        localStorage.setItem(STORAGE_USERS_KEY, JSON.stringify(users));
      }, [users]);

      // 팀원 목록 (관리자 제외 대원 14인)
      const memberList = useMemo(() => {
        return users.filter(u => u.role === "member");
      }, [users]);

      // 월별 날짜 배열
      const daysInMonth = useMemo(() => {
        const days = [];
        const date = new Date(year, month - 1, 1);
        while (date.getMonth() === month - 1) {
          days.push(new Date(date));
          date.setDate(date.getDate() + 1);
        }
        return days;
      }, [year, month]);

      // 가변 인원 당직 자동 순환 편성 알고리즘
      const { schedule, summary } = useMemo(() => {
        const numMembers = memberList.length;
        const totalDays = daysInMonth.length;
        if (numMembers === 0) return { schedule: [], summary: [] };

        const sched = Array.from({ length: numMembers }, () => Array(totalDays).fill(''));
        let dayDutyPtr = (month * 3) % numMembers;
        let nightDutyPtr = (dayDutyPtr + 1) % numMembers;

        for (let d = 0; d < totalDays; d++) {
          const currentDay = daysInMonth[d];
          const isWeekend = (currentDay.getDay() === 0 || currentDay.getDay() === 6);

          if (d > 0 && sched[dayDutyPtr % numMembers][d - 1] === 'N') {
            dayDutyPtr++;
          }
          const dIdx = dayDutyPtr % numMembers;
          sched[dIdx][d] = 'D';
          dayDutyPtr++;

          while ((nightDutyPtr % numMembers) === dIdx) {
            nightDutyPtr++;
          }
          const nIdx = nightDutyPtr % numMembers;
          sched[nIdx][d] = 'N';
          nightDutyPtr++;

          if (d + 1 < totalDays) {
            sched[nIdx][d + 1] = 'B';
          }

          for (let m = 0; m < numMembers; m++) {
            if (!sched[m][d]) {
              sched[m][d] = isWeekend ? 'O' : 'W';
            }
          }
        }

        const stats = memberList.map((m, idx) => {
          let dayCount = 0, nightCount = 0, weekendDuty = 0, regularWork = 0, offCount = 0;
          sched[idx].forEach((duty, dIdx) => {
            const isWeekend = (daysInMonth[dIdx].getDay() === 0 || daysInMonth[dIdx].getDay() === 6);
            if (duty === 'D') { dayCount++; if (isWeekend) weekendDuty++; }
            else if (duty === 'N') { nightCount++; if (isWeekend) weekendDuty++; }
            else if (duty === 'W') { regularWork++; }
            else if (duty === 'O' || duty === 'B') { offCount++; }
          });
          return { name: m.name, id: m.id, dayCount, nightCount, weekendDuty, regularWork, offCount };
        });

        return { schedule: sched, summary: stats };
      }, [memberList, daysInMonth, month]);

      // 오늘 투입 인원 현황
      const todayStatus = useMemo(() => {
        const todayDate = today.getDate();
        const dIdx = todayDate - 1;
        let dayWorker = "미지정", nightWorker = "미지정";
        let restWorkers = [], workWorkers = [];

        if (schedule.length > 0 && dIdx >= 0 && dIdx < daysInMonth.length) {
          memberList.forEach((m, mIdx) => {
            const duty = schedule[mIdx]?.[dIdx];
            if (duty === 'D') dayWorker = m.name;
            else if (duty === 'N') nightWorker = m.name;
            else if (duty === 'B') restWorkers.push(m.name);
            else if (duty === 'W') workWorkers.push(m.name);
          });
        }
        return { dayWorker, nightWorker, restWorkers, workWorkers, todayDate };
      }, [schedule, memberList, daysInMonth]);

      // 로그인한 본인의 근무 통계 추출
      const myStat = useMemo(() => {
        if (currentUser.role === 'admin') return null;
        return summary.find(s => s.id === currentUser.id);
      }, [summary, currentUser]);

      // 내 비밀번호 자체 변경
      const handleChangeMyPw = () => {
        if (!myNewPw.trim()) {
          alert("새 비밀번호를 입력해 주십시오.");
          return;
        }
        const updated = users.map(u => u.id === currentUser.id ? { ...u, pw: myNewPw.trim() } : u);
        setUsers(updated);
        alert("비밀번호가 안전하게 변경되었습니다. 다음 로그인 시 새 비밀번호가 적용됩니다.");
        setIsMyPwModal(false);
        setMyNewPw("");
      };

      // 타 브라우저 간 완벽 동기화를 위한 설정 코드 내보내기/불러오기
      const exportSyncData = () => {
        const payload = btoa(encodeURIComponent(JSON.stringify(users)));
        navigator.clipboard.writeText(payload);
        alert("중앙 동기화 코드가 클립보드에 복사되었습니다!\n다른 브라우저나 스마트폰에서 [동기화 코드 적용]에 붙여넣으시면 100% 동일하게 복제됩니다.");
      };

      const importSyncData = () => {
        try {
          const decoded = decodeURIComponent(atob(syncCodeInput.trim()));
          const parsed = JSON.parse(decoded);
          if (Array.isArray(parsed) && parsed.length > 0) {
            setUsers(parsed);
            alert("원격 기기의 팀원 명단 및 계정 데이터가 완벽히 동기화되었습니다!");
            setIsSyncModal(false);
          } else {
            alert("올바른 동기화 코드가 아닙니다.");
          }
        } catch (e) {
          alert("코드 해석 실패: 유효한 코드를 입력해 주십시오.");
        }
      };

      // 관리자: 팀원 명단 일괄 수정 (이름, ID, PW)
      const handleOpenAdminManage = () => {
        // 형식: ID,이름,PW
        const text = memberList.map(m => `${m.id},${m.name},${m.pw}`).join("\n");
        setEditUsersText(text);
        setIsMemberManageModal(true);
      };

      const handleSaveAdminManage = () => {
        const lines = editUsersText.split("\n").map(l => l.trim()).filter(Boolean);
        const adminUser = users.find(u => u.role === "admin") || DEFAULT_USERS[0];
        
        const newMembers = lines.map((line, idx) => {
          const parts = line.split(",").map(p => p.trim());
          const id = parts[0] || `user${String(idx+1).padStart(2,'0')}`;
          const name = parts[1] || `대원${idx+1}`;
          const pw = parts[2] || "1234";
          return { id, name, pw, role: "member" };
        });

        if (newMembers.length < 3) {
          alert("원활한 교대근무 편성을 위해 최소 3명 이상의 팀원이 필요합니다.");
          return;
        }

        setUsers([adminUser, ...newMembers]);
        alert("대원 명단 및 계정 정보가 성공적으로 갱신되었습니다.");
        setIsMemberManageModal(false);
      };

      // CSV 다운로드
      const downloadCSV = () => {
        let csv = "성명,아이디," + daysInMonth.map(d => `${d.getMonth()+1}/${d.getDate()}`).join(",") + ",주간(D),야간(N),주말당직합,상근(W),휴무/비번\n";
        memberList.forEach((m, idx) => {
          const s = summary[idx];
          csv += `${m.name},${m.id},` + schedule[idx].join(",") + `,${s.dayCount},${s.nightCount},${s.weekendDuty},${s.regularWork},${s.offCount}\n`;
        });
        const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `DC운용3팀_근무표_${year}년_${month}월.csv`;
        link.click();
      };

      const getDutyBadge = (duty) => {
        switch (duty) {
          case 'D': return 'bg-amber-400 text-slate-950 font-black shadow-sm';
          case 'N': return 'bg-blue-600 text-white font-black shadow-sm';
          case 'B': return 'bg-emerald-100 text-emerald-800 font-bold border border-emerald-300';
          case 'W': return 'bg-slate-200 text-slate-700 font-medium';
          case 'O': return 'bg-slate-50 text-slate-400 border border-slate-200';
          default: return '';
        }
      };

      return (
        <div className="max-w-[1700px] mx-auto px-4 py-6">
          {/* 상단 네비게이션 */}
          <div className="mb-6 flex flex-wrap items-center justify-between gap-4 p-5 rounded-2xl bg-white border border-slate-300 shadow-sm">
            <div className="flex items-center gap-3">
              <span className="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
              <div>
                <h1 className="text-2xl font-black text-slate-900 tracking-tight flex items-center gap-2">
                  DC운용3팀 통합 지휘 관제 포털
                </h1>
                <p className="text-xs text-slate-500 mt-0.5">
                  접속자: <strong className="text-blue-600 font-black">{currentUser.name}</strong> 
                  {currentUser.role === 'admin' ? " [통합 총괄 사령관]" : " [현장 운용 대원]"}
                </p>
              </div>
            </div>

            <div className="flex items-center flex-wrap gap-2">
              {currentUser.role === 'admin' && (
                <>
                  <button
                    onClick={handleOpenAdminManage}
                    className="px-3 py-1.5 text-xs font-bold bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded-lg transition"
                  >
                    👥 대원 14인 ID/PW 관리
                  </button>
                  <button
                    onClick={() => setIsSyncModal(true)}
                    className="px-3 py-1.5 text-xs font-bold bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 rounded-lg transition"
                  >
                    ☁️ 다른 브라우저 동기화
                  </button>
                </>
              )}

              <button
                onClick={() => setIsMyPwModal(true)}
                className="px-3 py-1.5 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 rounded-lg transition"
              >
                🔑 내 비밀번호 변경
              </button>

              <button
                onClick={onLogout}
                className="px-3 py-1.5 text-xs font-bold bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 rounded-lg transition"
              >
                로그아웃
              </button>
            </div>
          </div>

          {/* 대원 본인 로그인 시 맞춤형 개인 브리핑 카드 */}
          {myStat && (
            <div className="mb-6 p-5 rounded-2xl bg-blue-50 border border-blue-200 shadow-sm flex flex-wrap items-center justify-between gap-4">
              <div>
                <span className="text-xs font-black text-blue-700 uppercase tracking-wider">대원 개인 맞춤 알림</span>
                <h3 className="text-lg font-black text-slate-900 mt-0.5">
                  {currentUser.name} 대원님의 {month}월 당직 임무 요약
                </h3>
                <p className="text-xs text-slate-600 mt-0.5">본인의 주간/야간 배정 내역을 확인하고 임무를 완수하십시오.</p>
              </div>
              <div className="flex items-center gap-3 text-center">
                <div className="bg-white px-4 py-2 rounded-xl border border-blue-200 shadow-xs">
                  <span className="text-[10px] font-bold text-slate-500">주간(D)</span>
                  <p className="text-xl font-black text-amber-600 font-mono">{myStat.dayCount}회</p>
                </div>
                <div className="bg-white px-4 py-2 rounded-xl border border-blue-200 shadow-xs">
                  <span className="text-[10px] font-bold text-slate-500">야간(N)</span>
                  <p className="text-xl font-black text-blue-600 font-mono">{myStat.nightCount}회</p>
                </div>
                <div className="bg-white px-4 py-2 rounded-xl border border-blue-200 shadow-xs">
                  <span className="text-[10px] font-bold text-slate-500">주말당직</span>
                  <p className="text-xl font-black text-rose-600 font-mono">{myStat.weekendDuty}회</p>
                </div>
                <div className="bg-white px-4 py-2 rounded-xl border border-blue-200 shadow-xs">
                  <span className="text-[10px] font-bold text-slate-500">평일상근</span>
                  <p className="text-xl font-black text-slate-800 font-mono">{myStat.regularWork}일</p>
                </div>
              </div>
            </div>
          )}

          {/* 1. 상단 3개 센터 기상 정보 (Open-Meteo 기반) */}
          <section className="mb-6">
            <div className="flex items-center justify-between mb-2.5">
              <h2 className="text-sm font-extrabold text-slate-700 flex items-center gap-2">
                <span className="text-blue-600">●</span> 3개 거점 센터 기상 & 외기 냉방(Free Cooling) 지수
              </h2>
              <span className="text-xs text-slate-500">Open-Meteo 글로벌 기상 연동</span>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="p-5 rounded-2xl bg-white border border-slate-300 shadow-sm">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded border border-blue-200">거점 1</span>
                  <span className="text-xl">🌤️</span>
                </div>
                <h3 className="text-lg font-black text-slate-900 mt-1">일산 센터</h3>
                <div className="mt-2 flex items-baseline gap-2">
                  <span className="text-3xl font-black text-slate-900 font-mono">21.5°C</span>
                  <span className="text-xs font-bold text-slate-500">습도 52%</span>
                </div>
                <div className="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
                  <span className="text-slate-500">외기 냉방:</span>
                  <span className="text-emerald-700 font-bold bg-emerald-50 px-2 py-0.5 rounded">가동 적합 구간</span>
                </div>
              </div>

              <div className="p-5 rounded-2xl bg-white border border-slate-300 shadow-sm">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-cyan-700 bg-cyan-50 px-2 py-0.5 rounded border border-cyan-200">거점 2</span>
                  <span className="text-xl">☀️</span>
                </div>
                <h3 className="text-lg font-black text-slate-900 mt-1">식사 센터</h3>
                <div className="mt-2 flex items-baseline gap-2">

                      </tr>

              </div>

          {/* 모달 3: 다른 브라우저/스마트폰 동기화 센터 */}

                    value={syncCodeInput}

                  </button>
                </div>

                <div className="flex justify-end mt-4">
                  <button onClick={() => setIsSyncModal(false)} className="px-4 py-2 bg-slate-100 text-slate-700 text-xs font-bold rounded-xl">닫기</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem(AUTH_SESSION_KEY);
        return saved ? JSON.parse(saved) : null;
      });

      const handleLoginSuccess = (user) => setCurrentUser(user);
      const handleLogout = () => {
        localStorage.removeItem(AUTH_SESSION_KEY);
        setCurrentUser(null);
      };

      if (!currentUser) {
        return <LoginScreen onLoginSuccess={handleLoginSuccess} />;
      }
      return <MainDashboard currentUser={currentUser} onLogout={handleLogout} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
